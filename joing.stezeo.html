<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stezeo – Trainer Access</title>
<style>
:root{color-scheme:dark;--gold:#E6B93C;--yellow:#FFD84A;--orange:#FF8A1F;--green:#10B36A}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;line-height:1.6;
 background:radial-gradient(1200px 600px at 80% -10%,rgba(16,179,106,.32),transparent 60%),radial-gradient(900px 500px at -10% 40%,rgba(230,185,60,.14),transparent 60%),#04120c}
.card{width:min(420px,100%);padding:30px 26px;border-radius:22px;background:rgba(255,255,255,.05);border:1px solid rgba(230,185,60,.28);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 8px 30px rgba(0,20,10,.55),inset 0 1px 0 rgba(255,216,74,.10)}
.logo{display:inline-block;font-weight:800;font-size:1.4rem;color:var(--gold);text-decoration:none;text-shadow:0 0 24px rgba(255,216,74,.5);margin-bottom:14px}
h1{font-size:1.8rem;line-height:1.15;margin-bottom:4px;background:linear-gradient(90deg,#fff,#FFD84A);-webkit-background-clip:text;background-clip:text;color:transparent}
p.sm{font-size:.9rem;margin-bottom:18px}
input{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:12px;padding:13px;margin:0 0 10px;font:inherit}
input[hidden]{display:none}
input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(230,185,60,.22)}
input::placeholder{color:#d5dcd6}
button.go{width:100%;padding:14px;border-radius:12px;border:1px solid #FFE680;font:inherit;font-weight:800;letter-spacing:.02em;cursor:pointer;color:#1b1204;background:linear-gradient(135deg,#FFF1A8,#FFD84A 42%,#FF9A2E);box-shadow:0 8px 26px rgba(255,154,46,.38),inset 0 1px 0 rgba(255,255,255,.75)}
button.go:disabled{opacity:.5;cursor:default}
a{color:var(--yellow)}
.links{margin-top:14px;font-size:.9rem;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
#msg{min-height:1.3em;font-size:.9rem;margin-top:10px;color:#FFB36B}
</style>
<meta name="stz-page" content="trainer-login">
<script>
window.stzGo=function(rel,replace){var u=String(rel||"index.html");location[replace?"replace":"assign"](u);};
</script>
</head>
<body>
<main class="card">
  <a class="logo" href="index.html">Stezeo</a>
  <h1 id="ttl">Trainer Log in</h1>
  <p class="sm">Access your STEZEO Trainer Studio.</p>
  <input id="nm" placeholder="Full name" autocomplete="name" hidden>
  <input id="em" type="email" placeholder="Email" autocomplete="email">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <button class="go" id="go">Log in</button>
  <p id="msg"></p>
  <div class="links"><a href="#" id="sw">New trainer? Sign up</a><a href="index.html">Back to home</a></div>
</main>
<script>
const SB='https://uxrltzlxdttbjstomhkb.supabase.co',KEY='sb_publishable_bAbA5_9yIPt5IWQ0WwphMg_gdZ6E8-b',AUTH='sb-uxrltzlxdttbjstomhkb-auth-token';
const $=i=>document.getElementById(i);let signup=false;
const saveSession=s=>{s.expires_at=s.expires_at||Math.floor(Date.now()/1000)+(s.expires_in||3600);localStorage.setItem(AUTH,JSON.stringify(s));localStorage.setItem('stz','1')};
async function call(path,body){const r=await fetch(SB+path,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.msg||j.message||j.error_description||'Authentication failed ('+r.status+')');return j}
async function trainerRole(s){const r=await fetch(SB+'/rest/v1/profiles?id=eq.'+encodeURIComponent(s.user.id)+'&select=role',{headers:{apikey:KEY,Authorization:'Bearer '+s.access_token}});if(!r.ok)throw new Error('Could not verify your trainer account. Please run the STEZEO SQL setup.');const rows=await r.json();if(!rows.length||rows[0].role!=='trainer'&&rows[0].role!=='admin')throw new Error('This account is not registered as a trainer. Please use Trainer Sign Up.');}
function mode(v){signup=v;$('ttl').textContent=v?'Create Trainer Account':'Trainer Log in';$('go').textContent=v?'Create Trainer Account':'Log in';$('nm').hidden=!v;$('nm').required=v;$('pw').autocomplete=v?'new-password':'current-password';$('sw').textContent=v?'Already registered? Log in':'New trainer? Sign up';$('msg').textContent='';}
$('sw').onclick=e=>{e.preventDefault();mode(!signup)};
$('go').onclick=async()=>{const m=$('msg');m.style.color='#FFB36B';m.textContent='';const email=$('em').value.trim(),password=$('pw').value,name=$('nm').value.trim();if(!email||!password||signup&&!name){m.textContent='Complete all required fields.';return}if(password.length<8){m.textContent='Use a password with at least 8 characters.';return}$('go').disabled=true;
 try{let s;if(signup){s=await call('/auth/v1/signup',{email,password,data:{full_name:name,account_type:'trainer',role:'trainer'}});if(!s.access_token){m.style.color='#7be3a6';m.textContent='Trainer account created. Confirm your email, then log in.';$('go').disabled=false;return}}else{s=await call('/auth/v1/token?grant_type=password',{email,password});await trainerRole(s)}saveSession(s);location.replace('trainer.html');}
 catch(e){m.textContent=e.message;$('go').disabled=false}};
['em','pw','nm'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()}));
(async()=>{const h=new URLSearchParams(location.hash.slice(1)),token=h.get('access_token');if(token){try{const r=await fetch(SB+'/auth/v1/user',{headers:{apikey:KEY,Authorization:'Bearer '+token}});const u=await r.json();if(!r.ok)throw new Error('Email confirmation could not be verified.');const s={access_token:token,refresh_token:h.get('refresh_token'),token_type:'bearer',user:u};await trainerRole(s);saveSession(s);location.replace('trainer.html');return}catch(e){$('msg').textContent=e.message}}if(location.hash==='#signup')mode(true);})();
</script>
</body>
</html>
