<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher Login | GURHUB</title>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#031326,#0d2f56);
padding:20px;
}

.card{
width:100%;
max-width:500px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.1);
border-radius:25px;
padding:35px;
color:white;
}

.logo{
text-align:center;
font-size:38px;
font-weight:800;
margin-bottom:25px;
}

.logo span{
color:#d4af37;
}

.tabs{
display:flex;
margin-bottom:20px;
overflow:hidden;
border-radius:12px;
}

.tabs button{
flex:1;
padding:15px;
border:none;
cursor:pointer;
font-size:16px;
font-weight:bold;
}

.active{
background:#2563eb;
color:white;
}

.tab{
display:none;
}

.tab.show{
display:block;
}

.input-group{
margin-bottom:15px;
}

.input-group label{
display:block;
margin-bottom:6px;
font-size:14px;
}

.input-group input{
width:100%;
padding:14px;
border:none;
border-radius:10px;
outline:none;
}

.submit-btn{
width:100%;
padding:15px;
border:none;
border-radius:10px;
background:#d4af37;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

.submit-btn:hover{
opacity:.9;
}

.submit-btn:disabled{
opacity:.6;
cursor:not-allowed;
}

.home-link{
display:block;
text-align:center;
margin-top:25px;
text-decoration:none;
color:white;
font-size:18px;
}

.message{
text-align:center;
margin-bottom:15px;
color:#7fffd4;
line-height:1.5;
font-size:14px;
}

.message.error{
color:#ff8a8a;
}

.message.success{
color:#7fffd4;
}

</style>
</head>

<body>

<div class="card">

<div class="logo">
GUR<span>HUB</span>
</div>

<div id="msg" class="message"></div>

<div class="tabs">

<button
class="active"
type="button"
onclick="openTab('signup',this)"
>
Sign Up
</button>

<button
type="button"
onclick="openTab('login',this)"
>
Login
</button>

</div>


<!-- =====================================================
     SIGN UP
===================================================== -->

<div id="signup" class="tab show">

<div class="input-group">

<label>
Full Name
</label>

<input
type="text"
id="signupName"
autocomplete="name"
placeholder="Enter your full name"
>

</div>


<div class="input-group">

<label>
Email
</label>

<input
type="email"
id="signupEmail"
autocomplete="email"
placeholder="Enter your email"
>

</div>


<div class="input-group">

<label>
Password
</label>

<input
type="password"
id="signupPassword"
autocomplete="new-password"
placeholder="Create a password"
>

</div>


<button
class="submit-btn"
id="signupBtn"
type="button"
onclick="createAccount()"
>
Create Account
</button>

</div>


<!-- =====================================================
     LOGIN
===================================================== -->

<div id="login" class="tab">

<div class="input-group">

<label>
Email
</label>

<input
type="email"
id="loginEmail"
autocomplete="email"
placeholder="Enter your email"
>

</div>


<div class="input-group">

<label>
Password
</label>

<input
type="password"
id="loginPassword"
autocomplete="current-password"
placeholder="Enter your password"
>

</div>


<button
class="submit-btn"
id="loginBtn"
type="button"
onclick="loginTeacher()"
>
Login
</button>

</div>


<a
href="index.html"
class="home-link"
>
← Back To Homepage
</a>

</div>


<script>

/* =====================================================
   SUPABASE CONNECTION
===================================================== */

const SUPABASE_URL =
"https://uxrltzlxdttbjstomhkb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_bAbA5_9yIPt5IWQ0WwphMg_gdZ6E8-b";


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    message,
    type = "success"
){

const msg =
document.getElementById("msg");

msg.textContent =
message;

msg.className =
"message " + type;

}


/* =====================================================
   TAB SYSTEM
===================================================== */

function openTab(
    tab,
    btn
){

document
.querySelectorAll(".tab")
.forEach(tabBox => {

    tabBox.classList.remove("show");

});


const selectedTab =
document.getElementById(tab);

if(selectedTab){

    selectedTab.classList.add("show");

}


document
.querySelectorAll(".tabs button")
.forEach(button => {

    button.classList.remove("active");

});


if(btn){

    btn.classList.add("active");

}


showMessage("");

}


/* =====================================================
   EMAIL VALIDATION
===================================================== */

function isValidEmail(email){

return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
.test(email);

}


/* =====================================================
   CREATE TEACHER ACCOUNT
===================================================== */

async function createAccount(){

const name =
document
.getElementById("signupName")
.value
.trim();


const email =
document
.getElementById("signupEmail")
.value
.trim()
.toLowerCase();


const password =
document
.getElementById("signupPassword")
.value;


if(!name){

showMessage(
"Please enter your full name.",
"error"
);

return;

}


if(!email){

showMessage(
"Please enter your email.",
"error"
);

return;

}


if(!isValidEmail(email)){

showMessage(
"Please enter a valid email address.",
"error"
);

return;

}


if(!password){

showMessage(
"Please enter a password.",
"error"
);

return;

}


if(password.length < 6){

showMessage(
"Password must contain at least 6 characters.",
"error"
);

return;

}


const button =
document.getElementById("signupBtn");

button.disabled = true;

button.textContent =
"Creating Account...";


try{

/*
   SUPABASE AUTH SIGN UP

   Full name is stored in
   user_metadata.

   Supabase will send the
   verification email when
   Confirm Email is enabled.
*/

const {
    data,
    error
} =
await supabaseClient.auth.signUp({

    email:email,

    password:password,

    options:{

        data:{
            full_name:name,
            role:"teacher"
        },

        emailRedirectTo:
        window.location.origin +
        "/teacher-login.html"

    }

});


if(error){

    console.error(
        "Teacher signup error:",
        error
    );

    showMessage(
        error.message,
        "error"
    );

    return;

}


/*
   Important:

   Do NOT save the password
   in localStorage.

   Supabase Auth handles
   the account securely.
*/

if(
    data &&
    data.user &&
    data.session === null
){

    showMessage(
        "Account created successfully. Please check your email and click the verification link before logging in.",
        "success"
    );

    document
    .getElementById("signupPassword")
    .value = "";

    return;

}


/*
   In case email confirmation
   is disabled in Supabase,
   session may exist immediately.
*/

if(
    data &&
    data.session &&
    data.user
){

    showMessage(
        "Account created successfully. Opening Teacher Dashboard...",
        "success"
    );

    setTimeout(
        () => {

            window.location.href =
            "teacher.html";

        },
        1000
    );

}

}catch(error){

console.error(
    "Teacher signup error:",
    error
);

showMessage(
    "Unable to create account. Please try again.",
    "error"
);

}finally{

button.disabled = false;

button.textContent =
"Create Account";

}

}


/* =====================================================
   TEACHER LOGIN
===================================================== */

async function loginTeacher(){

const email =
document
.getElementById("loginEmail")
.value
.trim()
.toLowerCase();


const password =
document
.getElementById("loginPassword")
.value;


if(!email){

showMessage(
"Please enter your email.",
"error"
);

return;

}


if(!isValidEmail(email)){

showMessage(
"Please enter a valid email address.",
"error"
);

return;

}


if(!password){

showMessage(
"Please enter your password.",
"error"
);

return;

}


const button =
document.getElementById("loginBtn");

button.disabled = true;

button.textContent =
"Logging in...";


try{

/*
   SUPABASE AUTH LOGIN
*/

const {
    data,
    error
} =
await supabaseClient.auth.signInWithPassword({

    email:email,

    password:password

});


if(error){

    console.error(
        "Teacher login error:",
        error
    );

    /*
       If email has not been confirmed,
       Supabase may return an error.
    */

    if(
        error.message
        .toLowerCase()
        .includes("email not confirmed")
    ){

        showMessage(
            "Please verify your email first. Check your inbox for the Supabase verification email.",
            "error"
        );

    }else{

        showMessage(
            error.message,
            "error"
        );

    }

    return;

}


if(
    !data ||
    !data.user ||
    !data.session
){

    showMessage(
        "Login failed. Please try again.",
        "error"
    );

    return;

}


/*
   EXTRA EMAIL VERIFICATION CHECK

   Supabase Auth stores the
   confirmation time here.
*/

const confirmedAt =
data.user.email_confirmed_at;


if(!confirmedAt){

    /*
       Sign out immediately so
       unverified teachers do not
       keep a session.
    */

    await supabaseClient.auth.signOut();

    showMessage(
        "Your email is not verified. Please check your email and click the verification link.",
        "error"
    );

    return;

}


/*
   VERIFY THAT THIS IS A TEACHER ACCOUNT

   We read role from Supabase
   user metadata.

   Existing accounts without
   role metadata are still allowed
   because the original system
   did not store a role.
*/

const metadata =
data.user.user_metadata || {};

const role =
metadata.role;


/*
   If role exists and is something
   other than teacher, prevent access.
*/

if(
    role &&
    role !== "teacher"
){

    await supabaseClient.auth.signOut();

    showMessage(
        "This account is not registered as a teacher.",
        "error"
    );

    return;

}


/*
   SUCCESS

   Supabase now owns the session.
   No localStorage password.
*/

showMessage(
    "Login successful. Opening Teacher Dashboard...",
    "success"
);


setTimeout(
    () => {

        window.location.href =
        "teacher.html";

    },
    700
);


}catch(error){

console.error(
    "Teacher login error:",
    error
);

showMessage(
    "Unable to login. Please try again.",
    "error"
);

}finally{

button.disabled = false;

button.textContent =
"Login";

}

}


/* =====================================================
   CHECK EXISTING SESSION
===================================================== */

async function checkExistingTeacherSession(){

try{

const {
    data,
    error
} =
await supabaseClient.auth.getSession();


if(error){

    console.error(
        "Session check error:",
        error
    );

    return;

}


if(
    data &&
    data.session &&
    data.session.user
){

    const user =
    data.session.user;


    /*
       Do not redirect an
       unverified account.
    */

    if(!user.email_confirmed_at){

        await supabaseClient.auth.signOut();

        return;

    }


    const metadata =
    user.user_metadata || {};

    const role =
    metadata.role;


    if(
        role &&
        role !== "teacher"
    ){

        await supabaseClient.auth.signOut();

        return;

    }


    /*
       Already logged in teacher.
    */

    window.location.href =
    "teacher.html";

}

}catch(error){

console.error(
    "Existing session error:",
    error
);

}

}


/* =====================================================
   AUTH STATE LISTENER
===================================================== */

supabaseClient
.auth
.onAuthStateChange(
    async (
        event,
        session
    ) => {

        console.log(
            "Supabase Auth:",
            event
        );

    }
);


/* =====================================================
   START
===================================================== */

checkExistingTeacherSession();

</script>

</body>
</html>
