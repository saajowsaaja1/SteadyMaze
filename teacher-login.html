<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Login | GURHUB</title>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#031326,#0d2f56);
padding:20px;
}

.card{
width:100%;
max-width:500px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.1);
border-radius:25px;
padding:35px;
color:white;
}

.logo{
text-align:center;
font-size:38px;
font-weight:800;
margin-bottom:25px;
}

.logo span{
color:#d4af37;
}

.tabs{
display:flex;
margin-bottom:20px;
overflow:hidden;
border-radius:12px;
}

.tabs button{
flex:1;
padding:15px;
border:none;
cursor:pointer;
font-size:16px;
font-weight:bold;
}

.active{
background:#2563eb;
color:white;
}

.tab{
display:none;
}

.tab.show{
display:block;
}

.input-group{
margin-bottom:15px;
}

.input-group label{
display:block;
margin-bottom:6px;
font-size:14px;
}

.input-group input{
width:100%;
padding:14px;
border:none;
border-radius:10px;
outline:none;
}

.submit-btn{
width:100%;
padding:15px;
border:none;
border-radius:10px;
background:#d4af37;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

.submit-btn:hover{
opacity:.9;
}

.submit-btn:disabled{
opacity:.6;
cursor:not-allowed;
}

.home-link{
display:block;
text-align:center;
margin-top:25px;
text-decoration:none;
color:white;
font-size:18px;
}

.message{
text-align:center;
margin-bottom:15px;
color:#7fffd4;
min-height:20px;
}

</style>
</head>

<body>

<div class="card">

<div class="logo">
GUR<span>HUB</span>
</div>

<div id="msg" class="message"></div>

<div class="tabs">

<button
class="active"
onclick="openTab('signup',this)"
>
Sign Up
</button>

<button
onclick="openTab('login',this)"
>
Login
</button>

</div>

<!-- SIGNUP -->

<div id="signup" class="tab show">

<div class="input-group">
<label>Full Name</label>
<input
type="text"
id="signupName"
autocomplete="name"
>
</div>

<div class="input-group">
<label>Email</label>
<input
type="email"
id="signupEmail"
autocomplete="email"
>
</div>

<div class="input-group">
<label>Password</label>
<input
type="password"
id="signupPassword"
autocomplete="new-password"
>
</div>

<button
class="submit-btn"
id="signupBtn"
onclick="createAccount()"
>
Create Account
</button>

</div>

<!-- LOGIN -->

<div id="login" class="tab">

<div class="input-group">
<label>Email</label>
<input
type="email"
id="loginEmail"
autocomplete="email"
>
</div>

<div class="input-group">
<label>Password</label>
<input
type="password"
id="loginPassword"
autocomplete="current-password"
>
</div>

<button
class="submit-btn"
id="loginBtn"
onclick="loginTeacher()"
>
Login
</button>

</div>

<a href="index.html" class="home-link">
← Back To Homepage
</a>

</div>

<script>

/* =====================================================
   SUPABASE CONNECTION
===================================================== */

const SUPABASE_URL =
"https://uxrltzlxdttbjstomhkb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_bAbA5_9yIPt5IWQ0WwphMg_gdZ6E8-b";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    success = false
){

const msg =
document.getElementById("msg");

msg.textContent = text;

msg.style.color =
success
? "#7fffd4"
: "#ffb4b4";

}


/* =====================================================
   TABS
===================================================== */

function openTab(tab,btn){

document
.querySelectorAll(".tab")
.forEach(tabBox=>{
tabBox.classList.remove("show");
});

document
.getElementById(tab)
.classList.add("show");

document
.querySelectorAll(".tabs button")
.forEach(button=>{
button.classList.remove("active");
});

btn.classList.add("active");

showMessage("");

}


/* =====================================================
   CREATE TEACHER ACCOUNT
===================================================== */

async function createAccount(){

const name =
document
.getElementById("signupName")
.value
.trim();

const email =
document
.getElementById("signupEmail")
.value
.trim();

const password =
document
.getElementById("signupPassword")
.value
.trim();


/* VALIDATION */

if(!name || !email || !password){

showMessage(
"Please fill all fields."
);

return;

}

if(password.length < 6){

showMessage(
"Password must be at least 6 characters."
);

return;

}


/* BUTTON */

const button =
document.getElementById("signupBtn");

button.disabled = true;

button.textContent =
"Creating Account...";


try{

/* =================================================
   SUPABASE AUTH SIGN UP
================================================= */

const {
data,
error
} =
await supabaseClient
.auth
.signUp({

email:email,

password:password,

options:{

data:{
full_name:name,
role:"teacher"
},

emailRedirectTo:
window.location.origin +
"/teacher-login.html"

}

});


/* ERROR */

if(error){

console.error(
"Supabase Sign Up Error:",
error
);

showMessage(
error.message
);

return;

}


/* =================================================
   EMAIL VERIFICATION
================================================= */

if(data && data.user){

showMessage(
"Account created successfully. Check your email and click the verification link before logging in.",
true
);


/*
   Do NOT automatically send the teacher
   to teacher.html.

   The teacher must first verify the email.
*/

document
.getElementById("signupPassword")
.value = "";

}

}catch(error){

console.error(
"Sign Up Error:",
error
);

showMessage(
"Unable to create account. Please try again."
);

}finally{

button.disabled = false;

button.textContent =
"Create Account";

}

}


/* =====================================================
   TEACHER LOGIN
===================================================== */

async function loginTeacher(){

const email =
document
.getElementById("loginEmail")
.value
.trim();

const password =
document
.getElementById("loginPassword")
.value
.trim();


/* VALIDATION */

if(!email || !password){

showMessage(
"Please enter your email and password."
);

return;

}


/* BUTTON */

const button =
document.getElementById("loginBtn");

button.disabled = true;

button.textContent =
"Logging in...";


try{

/* =================================================
   SUPABASE AUTH LOGIN
================================================= */

const {
data,
error
} =
await supabaseClient
.auth
.signInWithPassword({

email:email,

password:password

});


/* ERROR */

if(error){

console.error(
"Supabase Login Error:",
error
);

showMessage(
error.message
);

return;

}


/* =================================================
   CHECK USER
================================================= */

if(
!data ||
!data.user
){

showMessage(
"Login failed. User account was not found."
);

return;

}


/* =================================================
   CHECK EMAIL VERIFICATION
================================================= */

const user =
data.user;

if(!user.email_confirmed_at){

await supabaseClient
.auth
.signOut();

showMessage(
"Please verify your email first. Check your inbox for the Supabase verification email."
);

return;

}


/* =================================================
   TEACHER SESSION
================================================= */

/*
   Supabase Auth now controls the session.

   We do NOT save the password in localStorage.
*/

console.log(
"Teacher logged in:",
user.id
);


/* =================================================
   GO TO TEACHER DASHBOARD
================================================= */

window.location.href =
"teacher.html";


}catch(error){

console.error(
"Teacher Login Error:",
error
);

showMessage(
"Login failed. Please check your email and password."
);

}finally{

button.disabled = false;

button.textContent =
"Login";

}

}


/* =====================================================
   CHECK EXISTING SESSION
===================================================== */

async function checkExistingTeacher(){

try{

const {
data,
error
} =
await supabaseClient
.auth
.getSession();

if(error){

console.error(
"Session Error:",
error
);

return;

}

if(
data &&
data.session &&
data.session.user
){

const user =
data.session.user;


/*
   Only redirect if the email
   has already been verified.
*/

if(user.email_confirmed_at){

console.log(
"Existing verified teacher session:",
user.id
);

/*
   Uncomment this if you want
   already logged-in teachers to
   automatically enter dashboard.
*/

}

}

}catch(error){

console.error(
"Existing Session Error:",
error
);

}

}


/* =====================================================
   AUTH STATE LISTENER
===================================================== */

supabaseClient
.auth
.onAuthStateChange(
(event,session)=>{

console.log(
"Auth event:",
event
);

if(
session &&
session.user
){

console.log(
"Authenticated teacher:",
session.user.id
);

}

});


/* =====================================================
   START
===================================================== */

checkExistingTeacher();

</script>

</body>
</html>
