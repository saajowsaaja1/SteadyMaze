<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>SteadyMaze | Teacher Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        radial-gradient(
            circle at top right,
            rgba(212,175,55,.15),
            transparent 35%
        ),
        radial-gradient(
            circle at bottom left,
            rgba(37,99,235,.18),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #031326,
            #0d2f56
        );

    color:white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

.card{
    width:100%;
    max-width:450px;

    padding:36px;

    background:rgba(255,255,255,.08);

    border:1px solid
        rgba(255,255,255,.10);

    border-radius:24px;

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    box-shadow:
        0 25px 80px
        rgba(0,0,0,.50);
}

.logo{
    text-align:center;

    font-size:32px;

    font-weight:900;

    margin-bottom:6px;
}

.logo span{
    color:#d4af37;
}

.subtitle{
    text-align:center;

    color:#9eacbd;

    font-size:11px;

    margin-bottom:26px;
}

.tabs{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:5px;

    padding:5px;

    margin-bottom:22px;

    background:
        rgba(0,0,0,.25);

    border-radius:12px;
}

.tab-button{
    border:0;

    padding:13px;

    border-radius:8px;

    background:transparent;

    color:#91a1b4;

    font-size:11px;

    font-weight:900;

    cursor:pointer;
}

.tab-button.active{
    background:#2563eb;

    color:white;
}

.form{
    display:none;
}

.form.active{
    display:block;
}

.input-group{
    margin-bottom:15px;
}

.input-group label{
    display:block;

    margin-bottom:7px;

    color:#c0cad7;

    font-size:10px;

    font-weight:900;
}

.input-group input{
    width:100%;

    padding:14px;

    border:1px solid
        rgba(255,255,255,.10);

    border-radius:10px;

    outline:none;

    background:#f7f9fc;

    color:#111;

    font-size:13px;
}

.input-group input:focus{
    border-color:#d4af37;

    box-shadow:
        0 0 0 3px
        rgba(212,175,55,.12);
}

.submit-btn{
    width:100%;

    padding:14px;

    margin-top:4px;

    border:0;

    border-radius:10px;

    background:
        linear-gradient(
            135deg,
            #d4af37,
            #f1cc62
        );

    color:#071426;

    font-size:11px;

    font-weight:900;

    cursor:pointer;

    transition:.2s;
}

.submit-btn:hover{
    transform:translateY(-1px);

    box-shadow:
        0 10px 30px
        rgba(212,175,55,.20);
}

.submit-btn:disabled{
    opacity:.60;

    cursor:not-allowed;

    transform:none;
}

.forgot{
    display:block;

    margin-top:16px;

    text-align:center;

    color:#79aaff;

    font-size:10px;

    font-weight:900;

    cursor:pointer;

    text-decoration:none;
}

.forgot:hover{
    color:#d4af37;
}

.back{
    display:block;

    margin-top:25px;

    text-align:center;

    color:#9aaabd;

    font-size:10px;

    text-decoration:none;
}

.back:hover{
    color:#d4af37;
}

.message{
    display:none;

    margin-bottom:15px;

    padding:12px;

    border-radius:9px;

    text-align:center;

    font-size:10px;

    line-height:1.5;

    background:
        rgba(0,230,118,.08);

    color:#7fffd4;
}

.message.error{
    background:
        rgba(255,70,70,.10);

    color:#ff7b7b;
}

.info{
    margin-top:12px;

    text-align:center;

    color:#8797aa;

    font-size:9px;

    line-height:1.5;
}

@media(max-width:500px){

    .card{
        padding:28px 22px;
    }

    .logo{
        font-size:28px;
    }

}

</style>

</head>

<body>


<div class="card">

    <!-- LOGO -->

    <div class="logo">
        Steady<span>Maze</span>
    </div>

    <div class="subtitle">
        Teacher Portal
    </div>


    <!-- MESSAGE -->

    <div
        id="message"
        class="message"
    ></div>


    <!-- TABS -->

    <div
        id="tabs"
        class="tabs"
    >

        <button
            id="signupTab"
            class="tab-button active"
            type="button"
            onclick="showSignup()"
        >
            SIGN UP
        </button>

        <button
            id="loginTab"
            class="tab-button"
            type="button"
            onclick="showLogin()"
        >
            LOGIN
        </button>

    </div>


    <!-- =================================
         SIGN UP
    ================================== -->

    <form
        id="signupForm"
        class="form active"
        onsubmit="createTeacherAccount(event)"
    >

        <div class="input-group">

            <label>
                FULL NAME
            </label>

            <input
                type="text"
                id="signupName"
                placeholder="Enter your full name"
                autocomplete="name"
                required
            >

        </div>


        <div class="input-group">

            <label>
                EMAIL
            </label>

            <input
                type="email"
                id="signupEmail"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

        </div>


        <div class="input-group">

            <label>
                PASSWORD
            </label>

            <input
                type="password"
                id="signupPassword"
                placeholder="Create password"
                autocomplete="new-password"
                minlength="6"
                required
            >

        </div>


        <button
            id="signupButton"
            type="submit"
            class="submit-btn"
        >
            CREATE TEACHER ACCOUNT
        </button>


        <div class="info">
            After registration, check your email
            to confirm your SteadyMaze account.
        </div>

    </form>


    <!-- =================================
         LOGIN
    ================================== -->

    <form
        id="loginForm"
        class="form"
        onsubmit="loginTeacher(event)"
    >

        <div class="input-group">

            <label>
                EMAIL
            </label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

        </div>


        <div class="input-group">

            <label>
                PASSWORD
            </label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

        </div>


        <button
            id="loginButton"
            type="submit"
            class="submit-btn"
        >
            LOGIN
        </button>


        <a
            class="forgot"
            onclick="showForgot()"
        >
            Forgot Password?
        </a>

    </form>


    <!-- =================================
         FORGOT PASSWORD
    ================================== -->

    <form
        id="forgotForm"
        class="form"
        onsubmit="sendResetLink(event)"
    >

        <div class="input-group">

            <label>
                ACCOUNT EMAIL
            </label>

            <input
                type="email"
                id="forgotEmail"
                placeholder="Enter your teacher email"
                autocomplete="email"
                required
            >

        </div>


        <button
            id="forgotButton"
            type="submit"
            class="submit-btn"
        >
            SEND RESET LINK
        </button>


        <div class="info">
            A secure password reset link will be
            sent to your email.
        </div>


        <a
            class="forgot"
            onclick="showLogin()"
        >
            ← Back To Login
        </a>

    </form>


    <!-- =================================
         NEW PASSWORD
    ================================== -->

    <form
        id="newPasswordForm"
        class="form"
        onsubmit="updateTeacherPassword(event)"
    >

        <div class="input-group">

            <label>
                NEW PASSWORD
            </label>

            <input
                type="password"
                id="newPassword"
                placeholder="Create new password"
                autocomplete="new-password"
                minlength="6"
                required
            >

        </div>


        <div class="input-group">

            <label>
                CONFIRM NEW PASSWORD
            </label>

            <input
                type="password"
                id="confirmNewPassword"
                placeholder="Confirm new password"
                autocomplete="new-password"
                minlength="6"
                required
            >

        </div>


        <button
            id="updatePasswordButton"
            type="submit"
            class="submit-btn"
        >
            CREATE NEW PASSWORD
        </button>

    </form>


    <!-- HOME -->

    <a
        href="index.html"
        class="back"
    >
        ← Back To Homepage
    </a>

</div>


<!-- =====================================
     SUPABASE
====================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================
   SUPABASE CONFIG
===================================== */

const SUPABASE_URL =
    "https://uxrltzlxdttbjstomhkb.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_bAbA5_9yIPt5IWQ0WwphMg_gdZ6E8-b";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =====================================
   MESSAGE
===================================== */

function showMessage(text,isError=false){

    const box =
        document.getElementById("message");

    box.textContent = text;

    box.style.display = "block";

    box.classList.toggle(
        "error",
        isError
    );
}


function clearMessage(){

    const box =
        document.getElementById("message");

    box.textContent = "";

    box.style.display = "none";

    box.classList.remove("error");
}


/* =====================================
   HIDE FORMS
===================================== */

function hideForms(){

    document
        .querySelectorAll(".form")
        .forEach(function(form){

            form.classList.remove("active");

        });
}


/* =====================================
   SIGN UP SCREEN
===================================== */

function showSignup(){

    hideForms();

    document
        .getElementById("signupForm")
        .classList.add("active");

    document
        .getElementById("signupTab")
        .classList.add("active");

    document
        .getElementById("loginTab")
        .classList.remove("active");

    document
        .getElementById("tabs")
        .style.display = "grid";

    clearMessage();
}


/* =====================================
   LOGIN SCREEN
===================================== */

function showLogin(){

    hideForms();

    document
        .getElementById("loginForm")
        .classList.add("active");

    document
        .getElementById("loginTab")
        .classList.add("active");

    document
        .getElementById("signupTab")
        .classList.remove("active");

    document
        .getElementById("tabs")
        .style.display = "grid";

    clearMessage();
}


/* =====================================
   FORGOT SCREEN
===================================== */

function showForgot(){

    hideForms();

    document
        .getElementById("forgotForm")
        .classList.add("active");

    document
        .getElementById("tabs")
        .style.display = "none";

    clearMessage();
}


/* =====================================
   NEW PASSWORD SCREEN
===================================== */

function showNewPassword(){

    hideForms();

    document
        .getElementById("newPasswordForm")
        .classList.add("active");

    document
        .getElementById("tabs")
        .style.display = "none";

}


/* =====================================
   CREATE TEACHER ACCOUNT
===================================== */

async function createTeacherAccount(event){

    event.preventDefault();

    clearMessage();


    const name =
        document
            .getElementById("signupName")
            .value
            .trim();


    const email =
        document
            .getElementById("signupEmail")
            .value
            .trim()
            .toLowerCase();


    const password =
        document
            .getElementById("signupPassword")
            .value;


    const button =
        document.getElementById(
            "signupButton"
        );


    if(!name || !email || !password){

        showMessage(
            "Please fill in all fields.",
            true
        );

        return;
    }


    if(password.length < 6){

        showMessage(
            "Password must be at least 6 characters.",
            true
        );

        return;
    }


    button.disabled = true;

    button.textContent =
        "CREATING...";


    try{

        const {
            data,
            error
        } =
        await supabaseClient.auth.signUp({

            email:email,

            password:password,

            options:{

                data:{

                    full_name:name,

                    role:"teacher"

                },

                emailRedirectTo:
                    window.location.origin +
                    "/teacher-login.html"

            }

        });


        if(error){

            throw error;

        }


        /*
         * IMPORTANT:
         *
         * We DO NOT insert into
         * public.teachers here.
         *
         * PostgreSQL trigger:
         *
         * on_auth_user_created
         *
         * automatically creates
         * the teacher profile.
         */


        if(data.session){

            showMessage(
                "Account created. Your teacher account is waiting for administrator approval."
            );

        }else{

            showMessage(
                "Account created. Please check your email and confirm your SteadyMaze account, then login."
            );

        }


        document
            .getElementById(
                "signupForm"
            )
            .reset();


    }catch(error){

        console.error(
            "Teacher signup error:",
            error
        );

        showMessage(
            error.message ||
            "Could not create teacher account.",
            true
        );

    }finally{

        button.disabled = false;

        button.textContent =
            "CREATE TEACHER ACCOUNT";

    }

}


/* =====================================
   LOGIN TEACHER
===================================== */

async function loginTeacher(event){

    event.preventDefault();

    clearMessage();


    const email =
        document
            .getElementById("loginEmail")
            .value
            .trim()
            .toLowerCase();


    const password =
        document
            .getElementById("loginPassword")
            .value;


    const button =
        document.getElementById(
            "loginButton"
        );


    button.disabled = true;

    button.textContent =
        "LOGGING IN...";


    try{

        const {
            data,
            error
        } =
        await supabaseClient.auth
            .signInWithPassword({

                email:email,

                password:password

            });


        if(error){

            throw error;

        }


        if(!data.user){

            throw new Error(
                "Teacher account was not found."
            );

        }


        /*
         * Get teacher profile
         */

        const {
            data:teacher,
            error:teacherError
        } =
        await supabaseClient
            .from("teachers")
            .select(
                "id,user_id,full_name,email,skill,bio,total_students,total_lessons,total_earnings,rating,status"
            )
            .eq(
                "user_id",
                data.user.id
            )
            .maybeSingle();


        if(teacherError){

            throw teacherError;

        }


        if(!teacher){

            await supabaseClient.auth
                .signOut();

            throw new Error(
                "Teacher profile was not found."
            );

        }


        /*
         * APPROVED
         */

        if(
            teacher.status ===
            "approved"
        ){

            window.location.replace(
                "teacher.html"
            );

            return;

        }


        /*
         * PENDING
         */

        if(
            teacher.status ===
            "pending"
        ){

            await supabaseClient.auth
                .signOut();

            throw new Error(
                "Your teacher account is waiting for administrator approval."
            );

        }


        /*
         * REJECTED
         */

        if(
            teacher.status ===
            "rejected"
        ){

            await supabaseClient.auth
                .signOut();

            throw new Error(
                "Your teacher account has been rejected."
            );

        }


        await supabaseClient.auth
            .signOut();


        throw new Error(
            "Your teacher account is not active."
        );


    }catch(error){

        console.error(
            "Teacher login error:",
            error
        );

        showMessage(
            error.message ||
            "Login failed.",
            true
        );

    }finally{

        button.disabled = false;

        button.textContent =
            "LOGIN";

    }

}


/* =====================================
   FORGOT PASSWORD
===================================== */

async function sendResetLink(event){

    event.preventDefault();

    clearMessage();


    const email =
        document
            .getElementById("forgotEmail")
            .value
            .trim()
            .toLowerCase();


    const button =
        document.getElementById(
            "forgotButton"
        );


    button.disabled = true;

    button.textContent =
        "SENDING...";


    try{

        const redirectUrl =
            window.location.origin +
            window.location.pathname;


        const {
            error
        } =
        await supabaseClient.auth
            .resetPasswordForEmail(

                email,

                {
                    redirectTo:
                        redirectUrl
                }

            );


        if(error){

            throw error;

        }


        showMessage(
            "Password reset link has been sent. Please check your email."
        );


    }catch(error){

        console.error(
            "Reset error:",
            error
        );

        showMessage(
            error.message ||
            "Could not send reset link.",
            true
        );

    }finally{

        button.disabled = false;

        button.textContent =
            "SEND RESET LINK";

    }

}


/* =====================================
   UPDATE PASSWORD
===================================== */

async function updateTeacherPassword(event){

    event.preventDefault();

    clearMessage();


    const password =
        document
            .getElementById("newPassword")
            .value;


    const confirmPassword =
        document
            .getElementById("confirmNewPassword")
            .value;


    if(password.length < 6){

        showMessage(
            "Password must be at least 6 characters.",
            true
        );

        return;

    }


    if(password !== confirmPassword){

        showMessage(
            "Passwords do not match.",
            true
        );

        return;

    }


    const button =
        document.getElementById(
            "updatePasswordButton"
        );


    button.disabled = true;

    button.textContent =
        "UPDATING...";


    try{

        const {
            error
        } =
        await supabaseClient.auth
            .updateUser({

                password:password

            });


        if(error){

            throw error;

        }


        showMessage(
            "Your password has been changed successfully."
        );


        setTimeout(
            async function(){

                await supabaseClient.auth
                    .signOut();

                showLogin();

            },
            1500
        );


    }catch(error){

        console.error(
            "Password update error:",
            error
        );

        showMessage(
            error.message ||
            "Could not change password.",
            true
        );

        button.disabled = false;

        button.textContent =
            "CREATE NEW PASSWORD";

    }

}


/* =====================================
   AUTH STATE
===================================== */

supabaseClient.auth
.onAuthStateChange(
    function(event){

        if(
            event ===
            "PASSWORD_RECOVERY"
        ){

            showNewPassword();

            showMessage(
                "Create your new SteadyMaze password."
            );

        }

    }
);


/* =====================================
   CHECK RECOVERY LINK
===================================== */

function checkRecoveryLink(){

    const hash =
        window.location.hash;


    if(
        hash.includes(
            "type=recovery"
        )
    ){

        setTimeout(
            function(){

                showNewPassword();

            },
            500
        );

    }

}


/* =====================================
   START
===================================== */

checkRecoveryLink();

</script>

</body>

</html>
