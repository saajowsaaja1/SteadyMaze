<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>SteadyMaze | Teacher Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;

    background:
        radial-gradient(
            circle at top right,
            rgba(212,175,55,.16),
            transparent 35%
        ),
        radial-gradient(
            circle at bottom left,
            rgba(37,99,235,.18),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #031326,
            #0d2f56
        );

    color:white;
}

.card{
    width:100%;
    max-width:460px;

    padding:35px;

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.1);

    border-radius:24px;

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    box-shadow:
        0 25px 80px rgba(0,0,0,.55);
}

.logo{
    text-align:center;
    font-size:34px;
    font-weight:900;
    margin-bottom:7px;
}

.logo span{
    color:#d4af37;
}

.subtitle{
    text-align:center;
    color:#a8b6c8;
    font-size:12px;
    margin-bottom:27px;
}

.tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:5px;
    padding:5px;
    margin-bottom:22px;
    background:rgba(0,0,0,.25);
    border-radius:12px;
}

.tab-button{
    border:0;
    padding:13px;
    border-radius:8px;
    background:transparent;
    color:#91a1b4;
    font-size:13px;
    font-weight:800;
    cursor:pointer;
}

.tab-button.active{
    background:#2563eb;
    color:white;
}

.form{
    display:none;
}

.form.active{
    display:block;
}

.input-group{
    margin-bottom:15px;
}

.input-group label{
    display:block;
    margin-bottom:7px;
    color:#c0cad7;
    font-size:11px;
    font-weight:800;
}

.input-group input{
    width:100%;
    padding:14px;

    border:1px solid rgba(255,255,255,.1);
    border-radius:10px;

    outline:none;

    background:#f7f9fc;
    color:#111;

    font-size:14px;
}

.input-group input:focus{
    border-color:#d4af37;

    box-shadow:
        0 0 0 3px rgba(212,175,55,.12);
}

.submit-btn{
    width:100%;
    padding:14px;
    margin-top:5px;

    border:0;
    border-radius:10px;

    background:
        linear-gradient(
            135deg,
            #d4af37,
            #f1cc62
        );

    color:#071426;

    font-size:14px;
    font-weight:900;

    cursor:pointer;

    transition:.2s;
}

.submit-btn:hover{
    transform:translateY(-1px);

    box-shadow:
        0 10px 30px
        rgba(212,175,55,.2);
}

.submit-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
}

.forgot{
    display:block;

    margin-top:16px;

    text-align:center;

    color:#79aaff;

    font-size:12px;
    font-weight:800;

    cursor:pointer;

    text-decoration:none;
}

.forgot:hover{
    color:#d4af37;
}

.back{
    display:block;

    margin-top:25px;

    text-align:center;

    color:#aab7c7;

    font-size:12px;

    text-decoration:none;
}

.back:hover{
    color:#d4af37;
}

.message{
    display:none;

    margin-bottom:16px;
    padding:12px;

    border-radius:9px;

    text-align:center;

    font-size:12px;
    line-height:1.5;

    background:rgba(0,230,118,.08);
    color:#7fffd4;
}

.message.error{
    background:rgba(255,70,70,.1);
    color:#ff7b7b;
}

.info{
    margin-top:13px;

    text-align:center;

    color:#93a3b6;

    font-size:11px;

    line-height:1.5;
}

@media(max-width:500px){

    .card{
        padding:28px 22px;
    }

    .logo{
        font-size:30px;
    }
}

</style>

</head>

<body>


<div class="card">

    <div class="logo">
        Steady<span>Maze</span>
    </div>

    <div class="subtitle">
        Teacher Portal
    </div>


    <div
        id="message"
        class="message"
    ></div>


    <!-- TABS -->

    <div
        class="tabs"
        id="tabs"
    >

        <button
            id="signupTab"
            class="tab-button active"
            type="button"
            onclick="showSignup()"
        >
            SIGN UP
        </button>

        <button
            id="loginTab"
            class="tab-button"
            type="button"
            onclick="showLogin()"
        >
            LOGIN
        </button>

    </div>


    <!-- ================================
         SIGN UP
    ================================= -->

    <form
        id="signupForm"
        class="form active"
        onsubmit="createTeacherAccount(event)"
    >

        <div class="input-group">

            <label>FULL NAME</label>

            <input
                type="text"
                id="signupName"
                placeholder="Enter your full name"
                autocomplete="name"
                required
            >

        </div>


        <div class="input-group">

            <label>EMAIL</label>

            <input
                type="email"
                id="signupEmail"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

        </div>


        <div class="input-group">

            <label>PASSWORD</label>

            <input
                type="password"
                id="signupPassword"
                placeholder="Create password"
                autocomplete="new-password"
                minlength="6"
                required
            >

        </div>


        <button
            type="submit"
            id="signupButton"
            class="submit-btn"
        >
            CREATE TEACHER ACCOUNT
        </button>


        <div class="info">
            After signup, check your email and
            confirm your SteadyMaze account.
        </div>

    </form>


    <!-- ================================
         LOGIN
    ================================= -->

    <form
        id="loginForm"
        class="form"
        onsubmit="loginTeacher(event)"
    >

        <div class="input-group">

            <label>EMAIL</label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

        </div>


        <div class="input-group">

            <label>PASSWORD</label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

        </div>


        <button
            type="submit"
            id="loginButton"
            class="submit-btn"
        >
            LOGIN
        </button>


        <a
            class="forgot"
            href="#"
            onclick="showForgot();return false;"
        >
            Forgot Password?
        </a>

    </form>


    <!-- ================================
         FORGOT PASSWORD
    ================================= -->

    <form
        id="forgotForm"
        class="form"
        onsubmit="sendResetLink(event)"
    >

        <div class="input-group">

            <label>ACCOUNT EMAIL</label>

            <input
                type="email"
                id="forgotEmail"
                placeholder="Enter your teacher email"
                autocomplete="email"
                required
            >

        </div>


        <button
            type="submit"
            id="forgotButton"
            class="submit-btn"
        >
            SEND RESET LINK
        </button>


        <div class="info">
            A password reset link will be sent
            to your email.
        </div>


        <a
            class="forgot"
            href="#"
            onclick="showLogin();return false;"
        >
            ← Back To Login
        </a>

    </form>


    <!-- ================================
         NEW PASSWORD
    ================================= -->

    <form
        id="newPasswordForm"
        class="form"
        onsubmit="updateTeacherPassword(event)"
    >

        <div class="input-group">

            <label>NEW PASSWORD</label>

            <input
                type="password"
                id="newPassword"
                placeholder="Create new password"
                autocomplete="new-password"
                minlength="6"
                required
            >

        </div>


        <div class="input-group">

            <label>CONFIRM NEW PASSWORD</label>

            <input
                type="password"
                id="confirmNewPassword"
                placeholder="Confirm new password"
                autocomplete="new-password"
                minlength="6"
                required
            >

        </div>


        <button
            type="submit"
            id="updatePasswordButton"
            class="submit-btn"
        >
            CREATE NEW PASSWORD
        </button>

    </form>


    <a
        href="index.html"
        class="back"
    >
        ← Back To Homepage
    </a>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* ==========================================
   SUPABASE CONFIGURATION
========================================== */

const SUPABASE_URL =
    "https://uxrltzlxdttbjstomhkb.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_bAbA5_9yIPt5IWQ0WwphMg_gdZ6E8-b";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
            auth:{
                persistSession:true,
                autoRefreshToken:true,
                detectSessionInUrl:true
            }
        }
    );


/* ==========================================
   CURRENT PAGE URL
========================================== */

const TEACHER_LOGIN_URL =
    window.location.href.split("#")[0].split("?")[0];


/* ==========================================
   MESSAGE
========================================== */

function showMessage(text,error=false){

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.style.display = "block";

    message.classList.toggle(
        "error",
        error
    );
}


function clearMessage(){

    const message =
        document.getElementById("message");

    message.textContent = "";

    message.style.display = "none";

    message.classList.remove("error");
}


/* ==========================================
   HIDE FORMS
========================================== */

function hideForms(){

    document
        .querySelectorAll(".form")
        .forEach(form => {

            form.classList.remove("active");

        });
}


/* ==========================================
   SHOW SIGNUP
========================================== */

function showSignup(){

    hideForms();

    document
        .getElementById("signupForm")
        .classList.add("active");

    document
        .getElementById("signupTab")
        .classList.add("active");

    document
        .getElementById("loginTab")
        .classList.remove("active");

    document
        .getElementById("tabs")
        .style.display = "grid";

    clearMessage();
}


/* ==========================================
   SHOW LOGIN
========================================== */

function showLogin(){

    hideForms();

    document
        .getElementById("loginForm")
        .classList.add("active");

    document
        .getElementById("loginTab")
        .classList.add("active");

    document
        .getElementById("signupTab")
        .classList.remove("active");

    document
        .getElementById("tabs")
        .style.display = "grid";

    clearMessage();
}


/* ==========================================
   SHOW FORGOT
========================================== */

function showForgot(){

    hideForms();

    document
        .getElementById("forgotForm")
        .classList.add("active");

    document
        .getElementById("tabs")
        .style.display = "none";

    clearMessage();
}


/* ==========================================
   SHOW NEW PASSWORD
========================================== */

function showNewPassword(){

    hideForms();

    document
        .getElementById("newPasswordForm")
        .classList.add("active");

    document
        .getElementById("tabs")
        .style.display = "none";

}


/* ==========================================
   CREATE TEACHER ACCOUNT
========================================== */

async function createTeacherAccount(event){

    event.preventDefault();

    clearMessage();


    const name =
        document
            .getElementById("signupName")
            .value
            .trim();


    const email =
        document
            .getElementById("signupEmail")
            .value
            .trim()
            .toLowerCase();


    const password =
        document
            .getElementById("signupPassword")
            .value;


    const button =
        document.getElementById(
            "signupButton"
        );


    if(!name || !email || !password){

        showMessage(
            "Please complete all fields.",
            true
        );

        return;
    }


    if(password.length < 6){

        showMessage(
            "Password must contain at least 6 characters.",
            true
        );

        return;
    }


    button.disabled = true;

    button.textContent =
        "CREATING...";


    try{

        /*
         * Supabase Auth creates the account.
         *
         * The password is handled by
         * Supabase Auth.
         */

        const {
            data,
            error
        } =
        await supabaseClient.auth.signUp({

            email:email,

            password:password,

            options:{

                data:{

                    full_name:name,

                    role:"teacher"

                },

                emailRedirectTo:
                    TEACHER_LOGIN_URL

            }

        });


        if(error){

            throw error;

        }


        /*
         * If Email Confirmation is ON,
         * Supabase normally returns no session.
         */

        if(!data.session){

            showMessage(
                "Account created. Check your email and click the SteadyMaze confirmation link. Then return here and login."
            );

            document
                .getElementById("signupForm")
                .reset();

            return;
        }


        /*
         * If confirmation is OFF and a session
         * exists, DO NOT automatically trust
         * the user as an approved teacher.
         *
         * The teacher database record must
         * still be checked.
         */

        const teacher =
            await getTeacherRecord(
                data.user.id
            );


        if(
            teacher &&
            teacher.status === "approved"
        ){

            window.location.replace(
                "teacher.html"
            );

            return;
        }


        await supabaseClient.auth.signOut();


        showMessage(
            "Account created, but your teacher account is not approved yet."
        );


    }catch(error){

        console.error(
            "Teacher signup error:",
            error
        );

        showMessage(
            getFriendlyError(error),
            true
        );

    }finally{

        button.disabled = false;

        button.textContent =
            "CREATE TEACHER ACCOUNT";
    }

}


/* ==========================================
   LOGIN TEACHER
========================================== */

async function loginTeacher(event){

    event.preventDefault();

    clearMessage();


    const email =
        document
            .getElementById("loginEmail")
            .value
            .trim()
            .toLowerCase();


    const password =
        document
            .getElementById("loginPassword")
            .value;


    const button =
        document.getElementById(
            "loginButton"
        );


    button.disabled = true;

    button.textContent =
        "LOGGING IN...";


    try{

        /*
         * Supabase Auth login.
         */

        const {
            data,
            error
        } =
        await supabaseClient.auth
            .signInWithPassword({

                email:email,

                password:password

            });


        if(error){

            throw error;

        }


        if(!data.user){

            throw new Error(
                "Login failed. User account was not found."
            );

        }


        /*
         * Check Teacher database record.
         */

        const teacher =
            await getTeacherRecord(
                data.user.id
            );


        if(!teacher){

            await supabaseClient.auth.signOut();

            throw new Error(
                "Teacher profile not found. Please contact the administrator."
            );
        }


        /*
         * APPROVED
         */

        if(
            teacher.status ===
            "approved"
        ){

            window.location.replace(
                "teacher.html"
            );

            return;
        }


        /*
         * PENDING
         */

        if(
            teacher.status ===
            "pending"
        ){

            await supabaseClient.auth.signOut();

            throw new Error(
                "Your teacher account is waiting for administrator approval."
            );
        }


        /*
         * REJECTED
         */

        if(
            teacher.status ===
            "rejected"
        ){

            await supabaseClient.auth.signOut();

            throw new Error(
                "Your teacher account was rejected."
            );
        }


        /*
         * Any other status.
         */

        await supabaseClient.auth.signOut();

        throw new Error(
            "Your teacher account is not active."
        );


    }catch(error){

        console.error(
            "Teacher login error:",
            error
        );

        showMessage(
            getFriendlyError(error),
            true
        );

    }finally{

        button.disabled = false;

        button.textContent =
            "LOGIN";
    }

}


/* ==========================================
   GET TEACHER DATABASE RECORD
========================================== */

async function getTeacherRecord(userId){

    const {
        data,
        error
    } =
    await supabaseClient
        .from("teachers")
        .select(
            "id,user_id,full_name,email,status"
        )
        .eq(
            "user_id",
            userId
        )
        .maybeSingle();


    if(error){

        throw error;

    }


    return data;

}


/* ==========================================
   FORGOT PASSWORD
========================================== */

async function sendResetLink(event){

    event.preventDefault();

    clearMessage();


    const email =
        document
            .getElementById("forgotEmail")
            .value
            .trim()
            .toLowerCase();


    const button =
        document.getElementById(
            "forgotButton"
        );


    button.disabled = true;

    button.textContent =
        "SENDING...";


    try{

        /*
         * Supabase sends the password
         * recovery email.
         */

        const {
            error
        } =
        await supabaseClient.auth
            .resetPasswordForEmail(

                email,

                {
                    redirectTo:
                        TEACHER_LOGIN_URL
                }

            );


        if(error){

            throw error;

        }


        /*
         * Do not reveal whether an account
         * exists. This is safer.
         */

        showMessage(
            "If this email belongs to a SteadyMaze account, a password reset link has been sent."
        );

        document
            .getElementById(
                "forgotForm"
            )
            .reset();


    }catch(error){

        console.error(
            "Password reset error:",
            error
        );

        showMessage(
            getFriendlyError(error),
            true
        );

    }finally{

        button.disabled = false;

        button.textContent =
            "SEND RESET LINK";
    }

}


/* ==========================================
   UPDATE PASSWORD
========================================== */

async function updateTeacherPassword(event){

    event.preventDefault();

    clearMessage();


    const password =
        document
            .getElementById(
                "newPassword"
            )
            .value;


    const confirmPassword =
        document
            .getElementById(
                "confirmNewPassword"
            )
            .value;


    if(password.length < 6){

        showMessage(
            "Password must contain at least 6 characters.",
            true
        );

        return;
    }


    if(password !== confirmPassword){

        showMessage(
            "The passwords do not match.",
            true
        );

        return;
    }


    const button =
        document.getElementById(
            "updatePasswordButton"
        );


    button.disabled = true;

    button.textContent =
        "UPDATING...";


    try{

        /*
         * The recovery link creates a
         * temporary Supabase Auth session.
         *
         * updateUser() changes the password.
         */

        const {
            data,
            error
        } =
        await supabaseClient.auth
            .updateUser({

                password:password

            });


        if(error){

            throw error;

        }


        /*
         * Password changed successfully.
         */

        showMessage(
            "Password changed successfully. Checking your teacher account..."
        );


        /*
         * Check the current authenticated
         * user's teacher record.
         */

        if(data.user){

            const teacher =
                await getTeacherRecord(
                    data.user.id
                );


            if(
                teacher &&
                teacher.status === "approved"
            ){

                setTimeout(
                    function(){

                        window.location.replace(
                            "teacher.html"
                        );

                    },
                    800
                );

                return;
            }

        }


        /*
         * If not approved, sign out.
         */

        await supabaseClient.auth.signOut();

        setTimeout(
            function(){

                showLogin();

                showMessage(
                    "Password changed. Please login after your teacher account is approved."
                );

            },
            1000
        );


    }catch(error){

        console.error(
            "Update password error:",
            error
        );

        showMessage(
            getFriendlyError(error),
            true
        );

    }finally{

        button.disabled = false;

        button.textContent =
            "CREATE NEW PASSWORD";
    }

}


/* ==========================================
   AUTH STATE CHANGE
========================================== */

supabaseClient.auth.onAuthStateChange(

    async function(event,session){

        /*
         * Supabase sends this event when
         * the recovery email is opened.
         */

        if(
            event ===
            "PASSWORD_RECOVERY"
        ){

            showNewPassword();

            showMessage(
                "Create your new SteadyMaze password."
            );

        }

    }

);


/* ==========================================
   CHECK RECOVERY URL
========================================== */

async function checkRecoveryUrl(){

    const hash =
        window.location.hash;


    const search =
        window.location.search;


    /*
     * Supabase recovery links can contain
     * type=recovery in the URL.
     */

    if(
        hash.includes("type=recovery") ||
        search.includes("type=recovery")
    ){

        /*
         * Wait for Supabase to restore
         * the recovery session.
         */

        setTimeout(
            async function(){

                const {
                    data
                } =
                await supabaseClient.auth
                    .getSession();


                if(data.session){

                    showNewPassword();

                    showMessage(
                        "Create your new SteadyMaze password."
                    );

                }else{

                    showLogin();

                    showMessage(
                        "This password reset link has expired or is invalid.",
                        true
                    );

                }

            },
            500
        );

    }

}


/* ==========================================
   FRIENDLY SUPABASE ERRORS
========================================== */

function getFriendlyError(error){

    const message =
        String(
            error?.message || ""
        ).toLowerCase();


    if(
        message.includes(
            "invalid login credentials"
        )
    ){

        return "Incorrect email or password.";

    }


    if(
        message.includes(
            "email not confirmed"
        )
    ){

        return "Please confirm your email first, then login.";

    }


    if(
        message.includes(
            "user already registered"
        )
    ){

        return "This email already has an account. Please login.";

    }


    if(
        message.includes(
            "password should be at least"
        )
    ){

        return "Password is too short.";

    }


    if(
        message.includes(
            "rate limit"
        )
    ){

        return "Too many attempts. Please wait a moment and try again.";

    }


    if(
        message.includes(
            "redirect"
        )
    ){

        return "The confirmation/reset URL is not allowed by Supabase. Check Authentication → URL Configuration.";

    }


    if(
        message.includes(
            "fetch"
        )
    ){

        return "Could not connect to Supabase. Check your internet connection.";

    }


    return (
        error?.message ||
        "Something went wrong. Please try again."
    );

}


/* ==========================================
   START
========================================== */

checkRecoveryUrl();

</script>

</body>

</html>
