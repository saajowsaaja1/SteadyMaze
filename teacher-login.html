<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Login | GURHUB</title>
<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}
body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#031326,#0d2f56);
padding:20px;
}
.card{
width:100%;
max-width:500px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.1);
border-radius:25px;
padding:35px;
color:white;
}
.logo{
text-align:center;
font-size:38px;
font-weight:800;
margin-bottom:25px;
}
.logo span{
color:#d4af37;
}
.tabs{
display:flex;
margin-bottom:20px;
overflow:hidden;
border-radius:12px;
}
.tabs button{
flex:1;
padding:15px;
border:none;
cursor:pointer;
font-size:16px;
font-weight:bold;
}
.active{
background:#2563eb;
color:white;
}
.tab{
display:none;
}
.tab.show{
display:block;
}
.input-group{
margin-bottom:15px;
}
.input-group label{
display:block;
margin-bottom:6px;
font-size:14px;
}
.input-group input{
width:100%;
padding:14px;
border:none;
border-radius:10px;
outline:none;
}
.submit-btn{
width:100%;
padding:15px;
border:none;
border-radius:10px;
background:#d4af37;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}
.submit-btn:hover{
opacity:.9;
}
.submit-btn:disabled{
opacity:.6;
cursor:not-allowed;
}
.home-link{
display:block;
text-align:center;
margin-top:25px;
text-decoration:none;
color:white;
font-size:18px;
}
.message{
text-align:center;
margin-bottom:15px;
color:#7fffd4;
min-height:18px;
}
</style>
</head>
<body>
<div class="card">
<div class="logo">
GUR<span>HUB</span>
</div>
<div id="msg" class="message"></div>
<div class="tabs">

<button
class=“active”
onclick=“openTab(‘signup’,this)”

Sign Up
<button
onclick=“openTab(‘login’,this)”

Login
</div>
<!-- SIGNUP -->
<div id="signup" class="tab show">
<div class="input-group">
<label>
Full Name
</label>

<input
type=“text”
id=“signupName”
autocomplete=“name”

</div>
<div class="input-group">
<label>
Email
</label>

<input
type=“email”
id=“signupEmail”
autocomplete=“email”

</div>
<div class="input-group">
<label>
Password
</label>

<input
type=“password”
id=“signupPassword”
autocomplete=“new-password”

</div>

<button
class=“submit-btn”
id=“signupBtn”
onclick=“createAccount()”

Create Account
</div>
<!-- LOGIN -->
<div id="login" class="tab">
<div class="input-group">
<label>
Email
</label>

<input
type=“email”
id=“loginEmail”
autocomplete=“email”

</div>
<div class="input-group">
<label>
Password
</label>

<input
type=“password”
id=“loginPassword”
autocomplete=“current-password”

</div>

<button
class=“submit-btn”
id=“loginBtn”
onclick=“loginTeacher()”

Login
</div>

<a
href=“index.html”
class=“home-link”

← Back To Homepage
</div>
<script>
/* =====================================================
   SUPABASE CONNECTION
===================================================== */
const SUPABASE_URL =
    "https://uxrltzlxdttbjstomhkb.supabase.co";
const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_bAbA5_9yIPt5IWQ0WwphMg_gdZ6E8-b";
const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );
/* =====================================================
   MESSAGE
===================================================== */
function showMessage(
    text,
    success = true
){
    const message =
        document.getElementById("msg");
    message.textContent =
        text;
    message.style.color =
        success
        ? "#7fffd4"
        : "#ff8a8a";
}
/* =====================================================
   TAB
===================================================== */
function openTab(
    tab,
    btn
){
    document
        .querySelectorAll(".tab")
        .forEach(tabBox => {
            tabBox.classList.remove(
                "show"
            );
        });
    document
        .getElementById(tab)
        .classList.add("show");
    document
        .querySelectorAll(".tabs button")
        .forEach(button => {
            button.classList.remove(
                "active"
            );
        });
    btn.classList.add("active");
    showMessage("");
}
/* =====================================================
   CREATE ACCOUNT
===================================================== */
async function createAccount(){
    const name =
        document
            .getElementById("signupName")
            .value
            .trim();
    const email =
        document
            .getElementById("signupEmail")
            .value
            .trim()
            .toLowerCase();
    const password =
        document
            .getElementById("signupPassword")
            .value;
    if(
        !name ||
        !email ||
        !password
    ){
        showMessage(
            "Fill all fields.",
            false
        );
        return;
    }
    if(password.length < 6){
        showMessage(
            "Password must be at least 6 characters.",
            false
        );
        return;
    }
    const button =
        document.getElementById(
            "signupBtn"
        );
    button.disabled = true;
    button.textContent =
        "Creating...";
    try{
        const {
            data,
            error
        } =
        await supabaseClient
            .auth
            .signUp({
                email: email,
                password: password,
                options: {
                    data: {
                        full_name:
                            name,
                        name:
                            name,
                        role:
                            "teacher"
                    }
                }
            });
        if(error){
            console.error(
                "Supabase signup error:",
                error
            );
            showMessage(
                error.message,
                false
            );
            return;
        }
        /*
         * Confirm Email is already enabled
         * in Supabase Authentication.
         *
         * Therefore we DO NOT create our own
         * email-confirmation system here.
         */
        if(
            data &&
            data.session
        ){
            /*
             * This can happen if email confirmation
             * is disabled in the Supabase project.
             */
            showMessage(
                "Account created successfully."
            );
            setTimeout(
                () => {
                    window.location.href =
                        "teacher.html";
                },
                700
            );
        }else{
            /*
             * With Confirm Email enabled,
             * Supabase normally returns no session
             * until the email is confirmed.
             */
            showMessage(
                "Account created successfully."
            );
            document
                .getElementById(
                    "signupPassword"
                )
                .value = "";
            openLoginTab();
        }
    }catch(error){
        console.error(
            "Signup error:",
            error
        );
        showMessage(
            "Unable to create account.",
            false
        );
    }finally{
        button.disabled = false;
        button.textContent =
            "Create Account";
    }
}
/* =====================================================
   OPEN LOGIN TAB
===================================================== */
function openLoginTab(){
    const loginButton =
        document.querySelectorAll(
            ".tabs button"
        )[1];
    openTab(
        "login",
        loginButton
    );
}
/* =====================================================
   LOGIN
===================================================== */
async function loginTeacher(){
    const email =
        document
            .getElementById("loginEmail")
            .value
            .trim()
            .toLowerCase();
    const password =
        document
            .getElementById("loginPassword")
            .value;
    if(
        !email ||
        !password
    ){
        showMessage(
            "Enter your email and password.",
            false
        );
        return;
    }
    const button =
        document.getElementById(
            "loginBtn"
        );
    button.disabled = true;
    button.textContent =
        "Logging in...";
    try{
        /*
         * Sign in through Supabase Auth.
         */
        const {
            data,
            error
        } =
        await supabaseClient
            .auth
            .signInWithPassword({
                email:
                    email,
                password:
                    password
            });
        if(error){
            console.error(
                "Supabase login error:",
                error
            );
            showMessage(
                error.message,
                false
            );
            return;
        }
        const user =
            data &&
            data.user
            ? data.user
            : null;
        if(!user){
            showMessage(
                "Unable to verify the account.",
                false
            );
            return;
        }
        /* =================================================
           EMAIL CONFIRMATION CHECK
        ================================================= */
        if(
            !user.email_confirmed_at
        ){
            /*
             * Sign out immediately if the email
             * has not been confirmed.
             */
            await supabaseClient
                .auth
                .signOut();
            showMessage(
                "Email verification required.",
                false
            );
            return;
        }
        /* =================================================
           TEACHER ROLE CHECK
        ================================================= */
        const metadata =
            user.user_metadata ||
            {};
        const role =
            String(
                metadata.role ||
                ""
            ).toLowerCase();
        /*
         * If a role exists and it is not teacher,
         * do not allow it into teacher dashboard.
         *
         * Existing accounts without metadata are
         * still allowed so your current accounts
         * are not broken.
         */
        if(
            role &&
            role !== "teacher"
        ){
            await supabaseClient
                .auth
                .signOut();
            showMessage(
                "This account is not a teacher account.",
                false
            );
            return;
        }
        /* =================================================
           SUCCESS
        ================================================= */
        showMessage(
            "Login successful."
        );
        /*
         * Supabase Auth now owns the session.
         * No password is stored in localStorage.
         */
        setTimeout(
            () => {
                window.location.href =
                    "teacher.html";
            },
            500
        );
    }catch(error){
        console.error(
            "Login error:",
            error
        );
        showMessage(
            "Unable to login.",
            false
        );
    }finally{
        button.disabled = false;
        button.textContent =
            "Login";
    }
}
/* =====================================================
   EXISTING SESSION CHECK
===================================================== */
async function checkExistingTeacher(){
    try{
        /*
         * getUser() asks the Supabase Auth server
         * for the authenticated user.
         */
        const {
            data,
            error
        } =
        await supabaseClient
            .auth
            .getUser();
        if(error){
            return;
        }
        const user =
            data &&
            data.user
            ? data.user
            : null;
        if(!user){
            return;
        }
        /*
         * Do not automatically enter the teacher
         * dashboard if email confirmation is missing.
         */
        if(
            !user.email_confirmed_at
        ){
            await supabaseClient
                .auth
                .signOut();
            return;
        }
        const metadata =
            user.user_metadata ||
            {};
        const role =
            String(
                metadata.role ||
                ""
            ).toLowerCase();
        if(
            role &&
            role !== "teacher"
        ){
            await supabaseClient
                .auth
                .signOut();
            return;
        }
        /*
         * Valid authenticated teacher.
         */
        window.location.href =
            "teacher.html";
    }catch(error){
        console.error(
            "Session check error:",
            error
        );
    }
}
/* =====================================================
   AUTH STATE LISTENER
===================================================== */
supabaseClient
    .auth
    .onAuthStateChange(
        async function(
            event,
            session
        ){
            if(
                event ===
                "SIGNED_OUT"
            ){
                return;
            }
            if(
                event ===
                    "SIGNED_IN" &&
                session &&
                session.user
            ){
                /*
                 * The login function itself performs
                 * the confirmation and role checks.
                 */
                console.log(
                    "Supabase teacher authentication active."
                );
            }
        }
    );
/* =====================================================
   START
===================================================== */
checkExistingTeacher();
</script>
</body>
</html>
