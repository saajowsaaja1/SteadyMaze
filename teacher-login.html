<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Login | GURHUB</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}
body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#031326,#0d2f56);
padding:20px;
}
.card{
width:100%;
max-width:500px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.1);
border-radius:25px;
padding:35px;
color:white;
}
.logo{
text-align:center;
font-size:38px;
font-weight:800;
margin-bottom:25px;
}
.logo span{
color:#d4af37;
}
.tabs{
display:flex;
margin-bottom:20px;
overflow:hidden;
border-radius:12px;
}
.tabs button{
flex:1;
padding:15px;
border:none;
cursor:pointer;
font-size:16px;
font-weight:bold;
}
.active{
background:#2563eb;
color:white;
}
.tab{
display:none;
}
.tab.show{
display:block;
}
.input-group{
margin-bottom:15px;
}
.input-group label{
display:block;
margin-bottom:6px;
font-size:14px;
}
.input-group input{
width:100%;
padding:14px;
border:none;
border-radius:10px;
outline:none;
}
.submit-btn{
width:100%;
padding:15px;
border:none;
border-radius:10px;
background:#d4af37;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}
.submit-btn:hover{
opacity:.9;
}
.submit-btn:disabled{
opacity:.6;
cursor:not-allowed;
}
.home-link{
display:block;
text-align:center;
margin-top:25px;
text-decoration:none;
color:white;
font-size:18px;
}
.message{
text-align:center;
margin-bottom:15px;
color:#7fffd4;
min-height:20px;
}
</style>
</head>
<body>
<div class="card">
<div class="logo">
GUR<span>HUB</span>
</div>
<div id="msg" class="message"></div>
<div class="tabs">
<button class="active" onclick="openTab('signup',this)">
Sign Up
</button>
<button onclick="openTab('login',this)">
Login
</button>
</div>
<!-- SIGNUP -->
<div id="signup" class="tab show">
<div class="input-group">
<label>Full Name</label>
<input type="text" id="signupName">
</div>
<div class="input-group">
<label>Email</label>
<input type="email" id="signupEmail">
</div>
<div class="input-group">
<label>Password</label>
<input type="password" id="signupPassword">
</div>
<button class="submit-btn" id="signupBtn" onclick="createAccount()">
Create Account
</button>
</div>
<!-- LOGIN -->
<div id="login" class="tab">
<div class="input-group">
<label>Email</label>
<input type="email" id="loginEmail">
</div>
<div class="input-group">
<label>Password</label>
<input type="password" id="loginPassword">
</div>
<button class="submit-btn" id="loginBtn" onclick="loginTeacher()">
Login
</button>
</div>
<a href="index.html" class="home-link">
← Back To Homepage
</a>
</div>
<!-- =====================================
     SUPABASE
===================================== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =====================================
   SUPABASE CONFIG
   KU BEDDEL KUWAAGA
===================================== */
const SUPABASE_URL =
"YOUR_SUPABASE_PROJECT_URL";
const SUPABASE_ANON_KEY =
"YOUR_SUPABASE_ANON_KEY";
const { createClient } = supabase;
const supabaseClient =
createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);
/* =====================================
   TAB SYSTEM
===================================== */
function openTab(tab,btn){
document.querySelectorAll(".tab")
.forEach(tabBox=>{
tabBox.classList.remove("show");
});
document.getElementById(tab)
.classList.add("show");
document.querySelectorAll(".tabs button")
.forEach(button=>{
button.classList.remove("active");
});
btn.classList.add("active");
document.getElementById("msg").textContent="";
}
/* =====================================
   MESSAGE
===================================== */
function showMessage(text){
document.getElementById("msg").textContent=text;
}
/* =====================================
   CREATE TEACHER ACCOUNT
===================================== */
async function createAccount(){
const name =
document.getElementById("signupName")
.value
.trim();
const email =
document.getElementById("signupEmail")
.value
.trim()
.toLowerCase();
const password =
document.getElementById("signupPassword")
.value
.trim();
if(!name || !email || !password){
alert("Fill all fields");
return;
}
if(password.length < 6){
alert("Password must be at least 6 characters");
return;
}
const button =
document.getElementById("signupBtn");
button.disabled=true;
button.textContent="Creating Account...";
try{
/*
   SUPABASE AUTH
   Password-ka localStorage laguma kaydinayo.
*/
const { data, error } =
await supabaseClient.auth.signUp({
email:email,
password:password,
options:{
data:{
full_name:name,
role:"teacher"
}
}
});
if(error){
console.error(error);
alert(error.message);
button.disabled=false;
button.textContent="Create Account";
return;
}
/*
   EMAIL CONFIRMATION OFF
   ama session isla markiiba la helay
*/
if(data.session && data.user){
showMessage("Account created successfully!");
setTimeout(()=>{
window.location.href="teacher.html";
},700);
return;
}
/*
   EMAIL CONFIRMATION ON
*/
if(data.user){
showMessage(
"Account created. Please confirm your email, then login."
);
document.getElementById("loginEmail").value=email;
setTimeout(()=>{
const loginButton =
document.querySelectorAll(".tabs button")[1];
openTab("login",loginButton);
},1200);
}
}catch(error){
console.error(error);
alert("Something went wrong. Please try again.");
}
button.disabled=false;
button.textContent="Create Account";
}
/* =====================================
   TEACHER LOGIN
===================================== */
async function loginTeacher(){
const email =
document.getElementById("loginEmail")
.value
.trim()
.toLowerCase();
const password =
document.getElementById("loginPassword")
.value
.trim();
if(!email || !password){
alert("Enter email and password");
return;
}
const button =
document.getElementById("loginBtn");
button.disabled=true;
button.textContent="Logging in...";
try{
const { data, error } =
await supabaseClient.auth.signInWithPassword({
email:email,
password:password
});
if(error){
console.error(error);
alert(error.message);
button.disabled=false;
button.textContent="Login";
return;
}
if(data.user){
showMessage("Login successful!");
/*
   Supabase session ayaa hadda
   aqoonsanaya teacher-kan.
   
   localStorage lama isticmaalayo.
   sessionStorage lama isticmaalayo.
*/
setTimeout(()=>{
window.location.href="teacher.html";
},500);
}
}catch(error){
console.error(error);
alert("Login failed. Please try again.");
}
button.disabled=false;
button.textContent="Login";
}
/* =====================================
   CHECK SUPABASE SESSION
===================================== */
async function checkTeacherSession(){
const { data, error } =
await supabaseClient.auth.getSession();
if(error){
console.error(error);
return;
}
/*
   Haddii teacher horey u login yahay,
   session-ka Supabase ayaa jira.
*/
if(data.session){
console.log("Teacher Supabase session active");
}
}
checkTeacherSession();
</script>
</body>
</html>
