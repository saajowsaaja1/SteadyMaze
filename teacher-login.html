<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SteadyMaze Teacher Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:450px;
    background:#ffffff;
    border-radius:20px;
    padding:35px;
    box-shadow:0 15px 40px rgba(0,0,0,.2);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo h1{
    color:#111827;
    font-size:38px;
}

.logo span{
    color:#22c55e;
}

.logo p{
    color:#6b7280;
    margin-top:8px;
}

h2{
    margin-bottom:20px;
    color:#111827;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
}

.input-group input{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:15px;
}

.input-group input:focus{
    outline:none;
    border-color:#2563eb;
}

.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.row a{
    text-decoration:none;
    color:#2563eb;
    font-weight:600;
}

.login-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.login-btn:hover{
    background:#1d4ed8;
}

.bottom-links{
    margin-top:25px;
    text-align:center;
}

.bottom-links a{
    display:block;
    margin-top:10px;
    text-decoration:none;
    color:#2563eb;
    font-weight:600;
}

.back-home{
    color:#6b7280 !important;
}

</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        <h1>Steady<span>Maze</span></h1>
        <p>Teacher Portal</p>
    </div>

    <h2>Teacher Login</h2>

    <form onsubmit="teacherLogin(event)">

        <div class="input-group">
            <label>Email Address</label>
            <input type="email" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" required>
        </div>

        <div class="row">
            <label>
                <input type="checkbox">
                Remember Me
            </label>

            <a href="forgot-password.html">
                Forgot Password?
            </a>
        </div>

        <button class="login-btn" type="submit">
            Login
        </button>

    </form>

    <div class="bottom-links">

        <a href="teacher-signup.html">
            Create Teacher Account
        </a>

        <a href="index.html" class="back-home">
            ← Back To Homepage
        </a>

    </div>

</div>

<script>

function teacherLogin(event){

    event.preventDefault();

    window.location.href = "teacher.html";

}

</script>

</body>
</html>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SteadyMaze Teacher Signup</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
background:white;
width:420px;
padding:30px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h1{
text-align:center;
margin-bottom:20px;
}

input,select{
width:100%;
padding:12px;
margin-top:10px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
}

button{
width:100%;
padding:14px;
background:#22c55e;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#16a34a;
}

a{
text-decoration:none;
color:#2563eb;
}

.bottom{
text-align:center;
margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

<h1>Create Teacher Account</h1>

<form onsubmit="createAccount(event)">

<input type="text" placeholder="Full Name" required>

<input type="email" placeholder="Email Address" required>

<select required>
<option value="">Select Skill</option>
<option>Video Editing</option>
<option>Thumbnail Design</option>
<option>Python</option>
<option>Java</option>
<option>Web Development</option>
<option>AI App Development</option>
</select>

<input type="password" placeholder="Password" required>

<input type="password" placeholder="Confirm Password" required>

<button type="submit">
Create Account
</button>

</form>

<div class="bottom">
Already have an account?
<a href="teacher-login.html">Login</a>
</div>

</div>

<script>
function createAccount(e){
e.preventDefault();
alert("Teacher account created successfully.");
window.location.href="teacher-login.html";
}
</script>

</body>
</html>

<head>

<title>Forgot Password</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.box{
background:white;
width:400px;
padding:30px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h2{
text-align:center;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
margin-bottom:15px;
box-sizing:border-box;
}

button{
width:100%;
padding:14px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

.bottom{
text-align:center;
margin-top:15px;
}
</style>
</head>

<body>

<div class="box">

<h2>Reset Password</h2>

<form onsubmit="resetPassword(event)">

<input type="email"
placeholder="Enter your email address"
required>

<button type="submit">
Send Reset Link
</button>

</form>

<div class="bottom">
<a href="teacher-login.html">
Back To Teacher Login
</a>
</div>

</div>

<script>
function resetPassword(e){
e.preventDefault();
alert("Password reset link sent.");
window.location.href="teacher-login.html";
}
</script>

</body>
</html>
