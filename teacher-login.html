<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>SteadyMaze | Teacher Login</title>


<style>

/* ================================
   RESET
================================ */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}


/* ================================
   BODY
================================ */

body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

    background:
        radial-gradient(
            circle at top right,
            rgba(212,175,55,.14),
            transparent 35%
        ),
        radial-gradient(
            circle at bottom left,
            rgba(37,99,235,.15),
            transparent 32%
        ),
        linear-gradient(
            135deg,
            #031326,
            #0d2f56
        );

    color:white;
}


/* ================================
   CARD
================================ */

.card{

    width:100%;

    max-width:500px;

    padding:35px;

    background:
        rgba(255,255,255,.08);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius:25px;

    box-shadow:
        0 25px 80px
        rgba(0,0,0,.45);
}


/* ================================
   LOGO
================================ */

.logo{

    text-align:center;

    font-size:38px;

    font-weight:800;

    margin-bottom:8px;

    letter-spacing:-1px;
}

.logo span{

    color:#d4af37;
}


.subtitle{

    text-align:center;

    color:#9aabc0;

    font-size:12px;

    margin-bottom:25px;
}


/* ================================
   TABS
================================ */

.tabs{

    display:flex;

    margin-bottom:20px;

    overflow:hidden;

    border-radius:12px;

    background:
        rgba(0,0,0,.22);
}

.tabs button{

    flex:1;

    padding:15px;

    border:none;

    cursor:pointer;

    font-size:15px;

    font-weight:bold;

    background:transparent;

    color:#9aaabd;

    transition:.2s;
}

.tabs button.active{

    background:#2563eb;

    color:white;
}


/* ================================
   FORMS
================================ */

.tab{

    display:none;
}

.tab.show{

    display:block;
}


/* ================================
   INPUT
================================ */

.input-group{

    margin-bottom:15px;
}

.input-group label{

    display:block;

    margin-bottom:7px;

    font-size:13px;

    font-weight:bold;

    color:#b7c3d2;
}

.input-group input{

    width:100%;

    padding:14px;

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius:10px;

    outline:none;

    background:#f8fafc;

    color:#111;

    font-size:15px;
}

.input-group input:focus{

    border-color:#d4af37;

    box-shadow:
        0 0 0 3px
        rgba(212,175,55,.12);
}

.input-group input::placeholder{

    color:#7d8792;
}


/* ================================
   BUTTON
================================ */

.submit-btn{

    width:100%;

    padding:15px;

    border:none;

    border-radius:10px;

    background:
        linear-gradient(
            135deg,
            #d4af37,
            #f0c957
        );

    color:#071426;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    margin-top:10px;

    transition:.2s;
}

.submit-btn:hover{

    transform:translateY(-1px);

    box-shadow:
        0 10px 30px
        rgba(212,175,55,.18);
}

.submit-btn:disabled{

    opacity:.6;

    cursor:not-allowed;

    transform:none;
}


/* ================================
   FORGOT
================================ */

.forgot{

    display:block;

    text-align:center;

    margin-top:16px;

    color:#74a8ff;

    font-size:13px;

    font-weight:bold;

    text-decoration:none;

    cursor:pointer;
}

.forgot:hover{

    color:#d4af37;
}


/* ================================
   HOME
================================ */

.home-link{

    display:block;

    text-align:center;

    margin-top:25px;

    text-decoration:none;

    color:#dce4ee;

    font-size:16px;
}

.home-link:hover{

    color:#d4af37;
}


/* ================================
   MESSAGE
================================ */

.message{

    display:none;

    text-align:center;

    margin-bottom:15px;

    padding:11px;

    border-radius:9px;

    background:
        rgba(212,175,55,.09);

    color:#7fffd4;

    font-size:13px;

    line-height:1.5;
}

.message.error{

    background:
        rgba(255,70,70,.1);

    color:#ff7777;
}


/* ================================
   RESET INFO
================================ */

.reset-info{

    margin-top:13px;

    text-align:center;

    color:#9aabc0;

    font-size:12px;

    line-height:1.5;
}


/* ================================
   MOBILE
================================ */

@media(max-width:520px){

    .card{

        padding:28px 22px;
    }

    .logo{

        font-size:32px;
    }

    .tabs button{

        font-size:14px;
    }

}

</style>

</head>


<body>


<div class="card">


    <!-- =================================
         STEADYMAZE LOGO
    ================================== -->

    <div class="logo">

        Steady<span>Maze</span>

    </div>


    <div class="subtitle">

        Teacher Portal

    </div>


    <!-- =================================
         MESSAGE
    ================================== -->

    <div
        id="msg"
        class="message"
    ></div>


    <!-- =================================
         LOGIN / SIGNUP TABS
    ================================== -->

    <div
        class="tabs"
        id="tabs"
    >

        <button
            id="signupTab"
            class="active"
            onclick="showSignup()"
        >

            Sign Up

        </button>


        <button
            id="loginTab"
            onclick="showLogin()"
        >

            Login

        </button>

    </div>


    <!-- =================================
         SIGN UP
    ================================== -->

    <div
        id="signup"
        class="tab show"
    >

        <div class="input-group">

            <label>
                Full Name
            </label>

            <input
                type="text"
                id="signupName"
                placeholder="Enter your full name"
                autocomplete="name"
            >

        </div>


        <div class="input-group">

            <label>
                Email
            </label>

            <input
                type="email"
                id="signupEmail"
                placeholder="Enter your email"
                autocomplete="email"
            >

        </div>


        <div class="input-group">

            <label>
                Password
            </label>

            <input
                type="password"
                id="signupPassword"
                placeholder="Create your password"
                autocomplete="new-password"
            >

        </div>


        <button
            class="submit-btn"
            id="signupButton"
            onclick="createAccount()"
        >

            Create Account

        </button>

    </div>


    <!-- =================================
         LOGIN
    ================================== -->

    <div
        id="login"
        class="tab"
    >

        <div class="input-group">

            <label>
                Email
            </label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                autocomplete="email"
            >

        </div>


        <div class="input-group">

            <label>
                Password
            </label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                autocomplete="current-password"
            >

        </div>


        <button
            class="submit-btn"
            id="loginButton"
            onclick="loginTeacher()"
        >

            Login

        </button>


        <a
            class="forgot"
            onclick="showForgot()"
        >

            Forgot Password?

        </a>

    </div>


    <!-- =================================
         FORGOT PASSWORD
    ================================== -->

    <div
        id="forgot"
        class="tab"
    >

        <div class="input-group">

            <label>
                Email
            </label>

            <input
                type="email"
                id="forgotEmail"
                placeholder="Enter your account email"
                autocomplete="email"
            >

        </div>


        <button
            class="submit-btn"
            id="forgotButton"
            onclick="sendResetEmail()"
        >

            Send Reset Link

        </button>


        <div class="reset-info">

            A secure SteadyMaze password reset
            link will be sent to your email.

        </div>


        <a
            class="forgot"
            onclick="showLogin()"
        >

            ← Back To Login

        </a>

    </div>


    <!-- =================================
         CREATE NEW PASSWORD
    ================================== -->

    <div
        id="newPassword"
        class="tab"
    >

        <div class="input-group">

            <label>
                New Password
            </label>

            <input
                type="password"
                id="newPasswordInput"
                placeholder="Create new password"
                autocomplete="new-password"
            >

        </div>


        <div class="input-group">

            <label>
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPasswordInput"
                placeholder="Confirm new password"
                autocomplete="new-password"
            >

        </div>


        <button
            class="submit-btn"
            id="updatePasswordButton"
            onclick="updatePassword()"
        >

            Create New Password

        </button>

    </div>


    <!-- =================================
         HOME
    ================================== -->

    <a
        href="index.html"
        class="home-link"
    >

        ← Back To Homepage

    </a>


</div>


<!-- =====================================
     SUPABASE
====================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================
   SUPABASE CONFIG
===================================== */

const SUPABASE_URL =
    "https://uxrltzlxdttbjstomhkb.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_bAbA5_9yIPt5IWQ0WwphMg_gdZ6E8-b";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =====================================
   MESSAGE
===================================== */

function showMessage(text,isError=false){

    const msg =
        document.getElementById("msg");

    msg.style.display = "block";

    msg.textContent = text;

    msg.classList.toggle(
        "error",
        isError
    );
}


function clearMessage(){

    const msg =
        document.getElementById("msg");

    msg.style.display = "none";

    msg.textContent = "";

    msg.classList.remove("error");
}


/* =====================================
   HIDE ALL TABS
===================================== */

function hideAllTabs(){

    document
        .querySelectorAll(".tab")
        .forEach(tab => {

            tab.classList.remove("show");

        });
}


/* =====================================
   SIGN UP
===================================== */

function showSignup(){

    hideAllTabs();

    document
        .getElementById("signup")
        .classList.add("show");


    document
        .getElementById("signupTab")
        .classList.add("active");


    document
        .getElementById("loginTab")
        .classList.remove("active");


    document
        .getElementById("tabs")
        .style.display = "flex";


    clearMessage();
}


/* =====================================
   LOGIN
===================================== */

function showLogin(){

    hideAllTabs();

    document
        .getElementById("login")
        .classList.add("show");


    document
        .getElementById("loginTab")
        .classList.add("active");


    document
        .getElementById("signupTab")
        .classList.remove("active");


    document
        .getElementById("tabs")
        .style.display = "flex";


    clearMessage();
}


/* =====================================
   FORGOT PASSWORD SCREEN
===================================== */

function showForgot(){

    hideAllTabs();

    document
        .getElementById("forgot")
        .classList.add("show");


    document
        .getElementById("tabs")
        .style.display = "none";


    clearMessage();
}


/* =====================================
   NEW PASSWORD SCREEN
===================================== */

function showNewPassword(){

    hideAllTabs();

    document
        .getElementById("newPassword")
        .classList.add("show");


    document
        .getElementById("tabs")
        .style.display = "none";

}


/* =====================================
   CREATE TEACHER ACCOUNT
===================================== */

async function createAccount(){

    clearMessage();


    const name =
        document
            .getElementById("signupName")
            .value
            .trim();


    const email =
        document
            .getElementById("signupEmail")
            .value
            .trim()
            .toLowerCase();


    const password =
        document
            .getElementById("signupPassword")
            .value;


    if(!name || !email || !password){

        showMessage(
            "Please fill all fields.",
            true
        );

        return;
    }


    if(password.length < 6){

        showMessage(
            "Password must be at least 6 characters.",
            true
        );

        return;
    }


    const button =
        document.getElementById(
            "signupButton"
        );


    button.disabled = true;

    button.textContent =
        "Creating...";


    try{

        const {
            data,
            error
        } =
        await supabaseClient.auth.signUp({

            email:email,

            password:password,

            options:{

                data:{

                    full_name:name,

                    role:"teacher"

                },

                emailRedirectTo:
                    window.location.origin +
                    "/teacher.html"

            }

        });


        if(error){

            throw error;

        }


        /*
         * If Supabase Email Confirmation
         * is OFF:
         *
         * session exists
         * → teacher.html
         */

        if(data.session){

            window.location.replace(
                "teacher.html"
            );

            return;
        }


        /*
         * If Email Confirmation is ON:
         *
         * Supabase sends confirmation email.
         *
         * No verification screen is created here.
         */

        showMessage(
            "Account created. Please confirm your email, then login."
        );


        document
            .getElementById("signupName")
            .value = "";


        document
            .getElementById("signupEmail")
            .value = "";


        document
            .getElementById("signupPassword")
            .value = "";


    }catch(error){

        showMessage(
            error.message ||
            "Could not create account.",
            true
        );

    }finally{

        button.disabled = false;

        button.textContent =
            "Create Account";
    }

}


/* =====================================
   LOGIN TEACHER
===================================== */

async function loginTeacher(){

    clearMessage();


    const email =
        document
            .getElementById("loginEmail")
            .value
            .trim()
            .toLowerCase();


    const password =
        document
            .getElementById("loginPassword")
            .value;


    if(!email || !password){

        showMessage(
            "Enter your email and password.",
            true
        );

        return;
    }


    const button =
        document.getElementById(
            "loginButton"
        );


    button.disabled = true;

    button.textContent =
        "Logging In...";


    try{

        const {
            data,
            error
        } =
        await supabaseClient.auth
            .signInWithPassword({

                email:email,

                password:password

            });


        if(error){

            throw error;

        }


        if(data.session){

            window.location.replace(
                "teacher.html"
            );

        }


    }catch(error){

        showMessage(
            error.message ||
            "Invalid email or password.",
            true
        );

    }finally{

        button.disabled = false;

        button.textContent =
            "Login";
    }

}


/* =====================================
   SEND PASSWORD RESET EMAIL
===================================== */

async function sendResetEmail(){

    clearMessage();


    const email =
        document
            .getElementById("forgotEmail")
            .value
            .trim()
            .toLowerCase();


    if(!email){

        showMessage(
            "Enter your email address.",
            true
        );

        return;
    }


    const button =
        document.getElementById(
            "forgotButton"
        );


    button.disabled = true;

    button.textContent =
        "Sending...";


    try{

        /*
         * The reset link returns to
         * THIS SAME teacher-login.html.
         */

        const redirectUrl =
            window.location.origin +
            window.location.pathname;


        const {
            error
        } =
        await supabaseClient.auth
            .resetPasswordForEmail(

                email,

                {
                    redirectTo:
                        redirectUrl
                }

            );


        if(error){

            throw error;

        }


        showMessage(
            "Reset link sent. Please check your email."
        );


    }catch(error){

        showMessage(
            error.message ||
            "Could not send reset email.",
            true
        );

    }finally{

        button.disabled = false;

        button.textContent =
            "Send Reset Link";
    }

}


/* =====================================
   UPDATE NEW PASSWORD
===================================== */

async function updatePassword(){

    clearMessage();


    const password =
        document
            .getElementById(
                "newPasswordInput"
            )
            .value;


    const confirmPassword =
        document
            .getElementById(
                "confirmPasswordInput"
            )
            .value;


    if(password.length < 6){

        showMessage(
            "Password must be at least 6 characters.",
            true
        );

        return;
    }


    if(password !== confirmPassword){

        showMessage(
            "Passwords do not match.",
            true
        );

        return;
    }


    const button =
        document.getElementById(
            "updatePasswordButton"
        );


    button.disabled = true;

    button.textContent =
        "Updating...";


    try{

        const {
            error
        } =
        await supabaseClient.auth
            .updateUser({

                password:password

            });


        if(error){

            throw error;

        }


        showMessage(
            "Password updated successfully."
        );


        /*
         * After changing password,
         * go directly to teacher dashboard.
         */

        setTimeout(function(){

            window.location.replace(
                "teacher.html"
            );

        },1000);


    }catch(error){

        showMessage(
            error.message ||
            "Could not update password.",
            true
        );


        button.disabled = false;

        button.textContent =
            "Create New Password";
    }

}


/* =====================================
   AUTH STATE
===================================== */

supabaseClient.auth.onAuthStateChange(

    function(event,session){

        /*
         * Password recovery link
         * has been opened.
         */

        if(event === "PASSWORD_RECOVERY"){

            showNewPassword();

            showMessage(
                "Create your new password."
            );

            return;
        }


        /*
         * Normal successful login.
         */

        if(
            event === "SIGNED_IN" &&
            session
        ){

            /*
             * Do not redirect while
             * password recovery is active.
             */

            if(
                !window.location.hash
                    .includes("type=recovery")
            ){

                window.location.replace(
                    "teacher.html"
                );

            }

        }

    }

);


/* =====================================
   CHECK EXISTING SESSION
===================================== */

async function checkSession(){

    const {
        data
    } =
    await supabaseClient.auth
        .getSession();


    /*
     * Already logged in?
     * Send to teacher dashboard.
     */

    if(
        data.session &&
        !window.location.hash
            .includes("type=recovery")
    ){

        window.location.replace(
            "teacher.html"
        );

    }

}


/* =====================================
   START
===================================== */

checkSession();

</script>


</body>

</html>
