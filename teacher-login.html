<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>GURHUB | Teacher Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at top right,
            rgba(212,175,55,.14),
            transparent 35%
        ),
        radial-gradient(
            circle at bottom left,
            rgba(37,99,235,.12),
            transparent 30%
        ),
        #02050a;

    color:#f5f8ff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

.auth-card{
    width:100%;
    max-width:430px;
    margin:20px;
    padding:38px;

    background:rgba(7,15,27,.94);

    border:1px solid
        rgba(255,255,255,.08);

    border-radius:22px;

    box-shadow:
        0 25px 80px
        rgba(0,0,0,.55);
}

.logo{
    text-align:center;
    font-size:28px;
    font-weight:900;
    margin-bottom:8px;
}

.logo span{
    color:#d4af37;
}

.subtitle{
    text-align:center;
    color:#68758a;
    font-size:10px;
    margin-bottom:30px;
}

.tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
    padding:5px;
    margin-bottom:25px;
    background:#02060d;
    border-radius:11px;
}

.tab{
    border:0;
    padding:12px;
    border-radius:8px;
    background:transparent;
    color:#667386;
    font-size:10px;
    font-weight:900;
    cursor:pointer;
}

.tab.active{
    background:#2563eb;
    color:white;
}

.form{
    display:none;
}

.form.active{
    display:block;
}

label{
    display:block;
    margin-bottom:7px;
    color:#8996a9;
    font-size:9px;
    font-weight:800;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:16px;

    background:#02060d;

    border:1px solid
        rgba(255,255,255,.08);

    border-radius:10px;

    outline:none;

    color:white;

    font-size:11px;
}

input:focus{
    border-color:#d4af37;

    box-shadow:
        0 0 0 3px
        rgba(212,175,55,.06);
}

input::placeholder{
    color:#465264;
}

.main-button{
    width:100%;
    padding:14px;
    margin-top:5px;

    border:0;
    border-radius:10px;

    background:
        linear-gradient(
            135deg,
            #d4af37,
            #f0c957
        );

    color:#07101f;

    font-size:10px;
    font-weight:900;

    cursor:pointer;

    transition:.2s;
}

.main-button:hover{
    transform:translateY(-1px);

    box-shadow:
        0 10px 30px
        rgba(212,175,55,.15);
}

.main-button:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
}

.forgot{
    display:block;
    margin-top:16px;
    text-align:center;

    color:#6fa3ff;

    font-size:9px;
    font-weight:800;

    text-decoration:none;
    cursor:pointer;
}

.forgot:hover{
    color:#d4af37;
}

.back{
    display:block;
    margin-top:25px;
    text-align:center;

    color:#566275;

    font-size:9px;
    text-decoration:none;
}

.back:hover{
    color:#d4af37;
}

.message{
    display:none;

    margin-bottom:15px;
    padding:11px;

    border-radius:8px;

    background:
        rgba(212,175,55,.07);

    color:#d4af37;

    font-size:9px;

    text-align:center;

    line-height:1.5;
}

.message.error{
    background:
        rgba(255,70,70,.08);

    color:#ff7070;
}

.reset-info{
    text-align:center;

    color:#68758a;

    font-size:9px;

    line-height:1.5;

    margin-top:13px;
}

@media(max-width:500px){

    .auth-card{
        padding:27px 22px;
    }

    .logo{
        font-size:24px;
    }

}

</style>

</head>

<body>

<div class="auth-card">

    <div class="logo">
        GUR<span>HUB</span>
    </div>

    <div class="subtitle">
        Teacher Portal · Learn · Teach · Grow
    </div>


    <!-- TABS -->

    <div
        class="tabs"
        id="tabs"
    >

        <button
            class="tab active"
            id="loginTab"
            onclick="showLogin()"
        >
            LOGIN
        </button>

        <button
            class="tab"
            id="signupTab"
            onclick="showSignup()"
        >
            SIGN UP
        </button>

    </div>


    <!-- MESSAGE -->

    <div
        class="message"
        id="message"
    ></div>


    <!-- LOGIN -->

    <form
        class="form active"
        id="loginForm"
        onsubmit="loginTeacher(event)"
    >

        <label>
            EMAIL
        </label>

        <input
            type="email"
            id="loginEmail"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >

        <label>
            PASSWORD
        </label>

        <input
            type="password"
            id="loginPassword"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >

        <button
            type="submit"
            class="main-button"
            id="loginButton"
        >
            LOGIN
        </button>

        <a
            class="forgot"
            onclick="showForgot()"
        >
            Forgot Password?
        </a>

    </form>


    <!-- SIGN UP -->

    <form
        class="form"
        id="signupForm"
        onsubmit="createTeacher(event)"
    >

        <label>
            FULL NAME
        </label>

        <input
            type="text"
            id="signupName"
            placeholder="Enter your full name"
            autocomplete="name"
            required
        >

        <label>
            EMAIL
        </label>

        <input
            type="email"
            id="signupEmail"
            placeholder="Enter your real email"
            autocomplete="email"
            required
        >

        <label>
            PASSWORD
        </label>

        <input
            type="password"
            id="signupPassword"
            placeholder="Create a password"
            autocomplete="new-password"
            minlength="6"
            required
        >

        <button
            type="submit"
            class="main-button"
            id="signupButton"
        >
            CREATE ACCOUNT
        </button>

    </form>


    <!-- FORGOT PASSWORD -->

    <form
        class="form"
        id="forgotForm"
        onsubmit="forgotPassword(event)"
    >

        <label>
            EMAIL
        </label>

        <input
            type="email"
            id="forgotEmail"
            placeholder="Enter your account email"
            autocomplete="email"
            required
        >

        <button
            type="submit"
            class="main-button"
            id="forgotButton"
        >
            RESET PASSWORD
        </button>

        <div class="reset-info">
            A secure password reset link will be
            sent to your email.
        </div>

        <a
            class="forgot"
            onclick="showLogin()"
        >
            ← Back to Login
        </a>

    </form>


    <!-- NEW PASSWORD -->

    <form
        class="form"
        id="newPasswordForm"
        onsubmit="updatePassword(event)"
    >

        <label>
            NEW PASSWORD
        </label>

        <input
            type="password"
            id="newPassword"
            placeholder="Create a new password"
            autocomplete="new-password"
            minlength="6"
            required
        >

        <label>
            CONFIRM PASSWORD
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm your new password"
            autocomplete="new-password"
            minlength="6"
            required
        >

        <button
            type="submit"
            class="main-button"
            id="updateButton"
        >
            UPDATE PASSWORD
        </button>

    </form>


    <a
        href="index.html"
        class="back"
    >
        ← Back to Homepage
    </a>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
    "https://uxrltzlxdttbjstomhkb.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_bAbA5_9yIPt5IWQ0WwphMg_gdZ6E8-b";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* ================================
   MESSAGE
================================ */

function showMessage(text,isError=false){

    const message =
        document.getElementById("message");

    message.style.display = "block";

    message.textContent = text;

    message.classList.toggle(
        "error",
        isError
    );
}


function clearMessage(){

    const message =
        document.getElementById("message");

    message.style.display = "none";

    message.textContent = "";

    message.classList.remove("error");
}


/* ================================
   HIDE FORMS
================================ */

function hideForms(){

    document
        .querySelectorAll(".form")
        .forEach(form => {

            form.classList.remove("active");

        });
}


/* ================================
   LOGIN TAB
================================ */

function showLogin(){

    hideForms();

    document
        .getElementById("loginForm")
        .classList.add("active");

    document
        .getElementById("loginTab")
        .classList.add("active");

    document
        .getElementById("signupTab")
        .classList.remove("active");

    document
        .getElementById("tabs")
        .style.display = "grid";

    clearMessage();
}


/* ================================
   SIGN UP TAB
================================ */

function showSignup(){

    hideForms();

    document
        .getElementById("signupForm")
        .classList.add("active");

    document
        .getElementById("signupTab")
        .classList.add("active");

    document
        .getElementById("loginTab")
        .classList.remove("active");

    document
        .getElementById("tabs")
        .style.display = "grid";

    clearMessage();
}


/* ================================
   FORGOT PASSWORD
================================ */

function showForgot(){

    hideForms();

    document
        .getElementById("forgotForm")
        .classList.add("active");

    document
        .getElementById("tabs")
        .style.display = "none";

    clearMessage();
}


/* ================================
   NEW PASSWORD
================================ */

function showNewPassword(){

    hideForms();

    document
        .getElementById("newPasswordForm")
        .classList.add("active");

    document
        .getElementById("tabs")
        .style.display = "none";

    clearMessage();
}


/* ================================
   CREATE TEACHER ACCOUNT
================================ */

async function createTeacher(event){

    event.preventDefault();

    clearMessage();

    const name =
        document
        .getElementById("signupName")
        .value
        .trim();

    const email =
        document
        .getElementById("signupEmail")
        .value
        .trim()
        .toLowerCase();

    const password =
        document
        .getElementById("signupPassword")
        .value;

    const button =
        document
        .getElementById("signupButton");


    if(password.length < 6){

        showMessage(
            "Password must be at least 6 characters.",
            true
        );

        return;
    }


    button.disabled = true;

    button.textContent =
        "CREATING...";


    try{

        const {
            data,
            error
        } =
        await supabaseClient.auth.signUp({

            email:email,

            password:password,

            options:{

                data:{
                    full_name:name,
                    role:"teacher"
                },

                emailRedirectTo:
                    window.location.origin +
                    "/teacher.html"
            }

        });


        if(error){
            throw error;
        }


        /*
           If email confirmation is disabled,
           Supabase returns a session.
        */

        if(data.session){

            window.location.replace(
                "teacher.html"
            );

            return;
        }


        /*
           If email confirmation is enabled,
           Supabase sends the email.
        */

        showMessage(
            "Account created. Check your email and confirm your account."
        );


        document
            .getElementById("signupForm")
            .reset();


    }catch(error){

        showMessage(
            error.message ||
            "Could not create account.",
            true
        );

    }finally{

        button.disabled = false;

        button.textContent =
            "CREATE ACCOUNT";
    }

}


/* ================================
   LOGIN TEACHER
================================ */

async function loginTeacher(event){

    event.preventDefault();

    clearMessage();

    const email =
        document
        .getElementById("loginEmail")
        .value
        .trim()
        .toLowerCase();

    const password =
        document
        .getElementById("loginPassword")
        .value;

    const button =
        document
        .getElementById("loginButton");


    button.disabled = true;

    button.textContent =
        "LOGGING IN...";


    try{

        const {
            data,
            error
        } =
        await supabaseClient.auth
        .signInWithPassword({

            email:email,

            password:password

        });


        if(error){
            throw error;
        }


        if(data.session){

            window.location.replace(
                "teacher.html"
            );

            return;
        }


    }catch(error){

        showMessage(
            error.message ||
            "Invalid email or password.",
            true
        );

    }finally{

        button.disabled = false;

        button.textContent =
            "LOGIN";
    }

}


/* ================================
   FORGOT PASSWORD
================================ */

async function forgotPassword(event){

    event.preventDefault();

    clearMessage();

    const email =
        document
        .getElementById("forgotEmail")
        .value
        .trim()
        .toLowerCase();

    const button =
        document
        .getElementById("forgotButton");


    button.disabled = true;

    button.textContent =
        "SENDING...";


    try{

        /*
           Same teacher-login.html receives
           the recovery session.
        */

        const redirectUrl =
            window.location.origin +
            window.location.pathname;


        const {
            error
        } =
        await supabaseClient.auth
        .resetPasswordForEmail(

            email,

            {
                redirectTo:redirectUrl
            }

        );


        if(error){
            throw error;
        }


        showMessage(
            "Password reset link sent. Check your email."
        );


    }catch(error){

        showMessage(
            error.message ||
            "Could not send reset email.",
            true
        );

    }finally{

        button.disabled = false;

        button.textContent =
            "RESET PASSWORD";
    }

}


/* ================================
   UPDATE PASSWORD
================================ */

async function updatePassword(event){

    event.preventDefault();

    clearMessage();

    const password =
        document
        .getElementById("newPassword")
        .value;

    const confirmPassword =
        document
        .getElementById("confirmPassword")
        .value;

    const button =
        document
        .getElementById("updateButton");


    if(password.length < 6){

        showMessage(
            "Password must be at least 6 characters.",
            true
        );

        return;
    }


    if(password !== confirmPassword){

        showMessage(
            "Passwords do not match.",
            true
        );

        return;
    }


    button.disabled = true;

    button.textContent =
        "UPDATING...";


    try{

        const {
            error
        } =
        await supabaseClient.auth
        .updateUser({

            password:password

        });


        if(error){
            throw error;
        }


        showMessage(
            "Password updated successfully."
        );


        setTimeout(function(){

            window.location.replace(
                "teacher.html"
            );

        },1000);


    }catch(error){

        showMessage(
            error.message ||
            "Could not update password.",
            true
        );

        button.disabled = false;

        button.textContent =
            "UPDATE PASSWORD";
    }

}


/* ================================
   SUPABASE AUTH STATE
================================ */

supabaseClient.auth.onAuthStateChange(

    function(event,session){

        /*
           User clicked password reset link.
        */

        if(event === "PASSWORD_RECOVERY"){

            showNewPassword();

            showMessage(
                "Create your new password."
            );

            return;
        }


        /*
           Normal login.
        */

        if(
            event === "SIGNED_IN" &&
            session
        ){

            if(
                !window.location.hash
                .includes("type=recovery")
            ){

                window.location.replace(
                    "teacher.html"
                );

            }

        }

    }

);


/* ================================
   EXISTING SESSION
================================ */

async function checkSession(){

    const {
        data
    } =
    await supabaseClient.auth
    .getSession();


    if(
        data.session &&
        !window.location.hash
        .includes("type=recovery")
    ){

        window.location.replace(
            "teacher.html"
        );

    }

}


checkSession();

</script>

</body>

</html>
