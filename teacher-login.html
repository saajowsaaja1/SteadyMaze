<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Teacher Login | GURHUB</title>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}


/* =========================
   BODY
========================= */

body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(37,99,235,.38),
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 90%,
            rgba(212,175,55,.20),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #020b18,
            #08264a,
            #031326
        );

}


/* =========================
   CARD
========================= */

.card{

    width:100%;

    max-width:500px;

    padding:35px;

    color:white;

    background:
        rgba(255,255,255,.075);

    border:
        1px solid rgba(255,255,255,.13);

    border-radius:25px;

    backdrop-filter:blur(22px);

    -webkit-backdrop-filter:blur(22px);

    box-shadow:
        0 25px 70px rgba(0,0,0,.45);

}


/* =========================
   LOGO
========================= */

.logo{

    text-align:center;

    font-size:40px;

    font-weight:900;

    letter-spacing:1px;

    margin-bottom:7px;

}

.logo span{

    color:#d4af37;

}


.subtitle{

    text-align:center;

    color:#aebed3;

    font-size:14px;

    margin-bottom:25px;

}


/* =========================
   MESSAGE
========================= */

.message{

    min-height:22px;

    text-align:center;

    margin-bottom:15px;

    font-size:14px;

    line-height:1.5;

}

.message.success{

    color:#7fffd4;

}

.message.error{

    color:#ff8585;

}


/* =========================
   TABS
========================= */

.tabs{

    display:flex;

    gap:4px;

    padding:4px;

    margin-bottom:22px;

    border-radius:13px;

    background:
        rgba(0,0,0,.25);

}


.tabs button{

    flex:1;

    padding:14px;

    border:none;

    border-radius:10px;

    background:transparent;

    color:#bdc9d9;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


.tabs button.active{

    background:#2563eb;

    color:white;

    box-shadow:
        0 5px 18px rgba(37,99,235,.35);

}


/* =========================
   TAB
========================= */

.tab{

    display:none;

}


.tab.show{

    display:block;

}


/* =========================
   INPUT
========================= */

.input-group{

    margin-bottom:17px;

}


.input-group label{

    display:block;

    margin-bottom:7px;

    color:#e8edf5;

    font-size:14px;

}


.input-group input{

    width:100%;

    padding:15px;

    border:
        1px solid rgba(255,255,255,.15);

    border-radius:11px;

    outline:none;

    background:#ffffff;

    color:#071426;

    font-size:15px;

    transition:.2s;

}


.input-group input:focus{

    border:
        2px solid #d4af37;

    box-shadow:
        0 0 0 3px rgba(212,175,55,.12);

}


/* =========================
   BUTTON
========================= */

.submit-btn{

    width:100%;

    padding:15px;

    margin-top:5px;

    border:none;

    border-radius:11px;

    background:
        linear-gradient(
            135deg,
            #d4af37,
            #f0ce62
        );

    color:#071426;

    font-size:16px;

    font-weight:800;

    cursor:pointer;

    transition:.2s;

}


.submit-btn:hover{

    transform:translateY(-1px);

    box-shadow:
        0 8px 25px rgba(212,175,55,.28);

}


.submit-btn:disabled{

    opacity:.6;

    cursor:not-allowed;

    transform:none;

}


/* =========================
   LINKS
========================= */

.forgot{

    display:block;

    text-align:right;

    margin-top:10px;

    color:#70a7ff;

    font-size:14px;

    cursor:pointer;

    text-decoration:none;

}


.forgot:hover{

    color:#d4af37;

}


.back-login{

    text-align:center;

    margin-top:16px;

    color:#70a7ff;

    font-size:14px;

    cursor:pointer;

}


.back-login:hover{

    color:#d4af37;

}


.home-link{

    display:block;

    text-align:center;

    margin-top:25px;

    color:white;

    text-decoration:none;

    font-size:16px;

}


.home-link:hover{

    color:#d4af37;

}


/* =========================
   SMALL TEXT
========================= */

.small-text{

    text-align:center;

    color:#9fb0c7;

    font-size:13px;

    line-height:1.5;

    margin-top:14px;

}


/* =========================
   MOBILE
========================= */

@media(max-width:520px){

    .card{

        padding:25px 20px;

        border-radius:20px;

    }

    .logo{

        font-size:34px;

    }

}

</style>

</head>


<body>


<div class="card">


    <!-- =====================
         LOGO
    ====================== -->

    <div class="logo">

        GUR<span>HUB</span>

    </div>


    <div class="subtitle">

        Teacher Account

    </div>


    <!-- =====================
         MESSAGE
    ====================== -->

    <div
        id="msg"
        class="message"
    ></div>


    <!-- =====================
         NORMAL TABS
    ====================== -->

    <div
        id="normalTabs"
        class="tabs"
    >

        <button
            id="signupTabButton"
            class="active"
            onclick="showSignup()"
        >
            Sign Up
        </button>


        <button
            id="loginTabButton"
            onclick="showLogin()"
        >
            Login
        </button>

    </div>


    <!-- =====================
         SIGN UP
    ====================== -->

    <div
        id="signup"
        class="tab show"
    >


        <div class="input-group">

            <label>
                Full Name
            </label>

            <input
                type="text"
                id="signupName"
                placeholder="Enter your full name"
                autocomplete="name"
            >

        </div>


        <div class="input-group">

            <label>
                Email
            </label>

            <input
                type="email"
                id="signupEmail"
                placeholder="Enter your real email"
                autocomplete="email"
            >

        </div>


        <div class="input-group">

            <label>
                Password
            </label>

            <input
                type="password"
                id="signupPassword"
                placeholder="Create your password"
                autocomplete="new-password"
            >

        </div>


        <button
            id="signupBtn"
            class="submit-btn"
            onclick="signUpTeacher()"
        >

            Create Teacher Account

        </button>


    </div>


    <!-- =====================
         LOGIN
    ====================== -->

    <div
        id="login"
        class="tab"
    >


        <div class="input-group">

            <label>
                Email
            </label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                autocomplete="email"
            >

        </div>


        <div class="input-group">

            <label>
                Password
            </label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                autocomplete="current-password"
            >

        </div>


        <a
            class="forgot"
            onclick="showForgot()"
        >

            Forgot Password?

        </a>


        <button
            id="loginBtn"
            class="submit-btn"
            onclick="loginTeacher()"
        >

            Login

        </button>


    </div>


    <!-- =====================
         FORGOT PASSWORD
    ====================== -->

    <div
        id="forgot"
        class="tab"
    >


        <div class="input-group">

            <label>
                Email
            </label>

            <input
                type="email"
                id="forgotEmail"
                placeholder="Enter your account email"
                autocomplete="email"
            >

        </div>


        <button
            id="forgotBtn"
            class="submit-btn"
            onclick="sendResetLink()"
        >

            Send Reset Link

        </button>


        <div class="small-text">

            A secure password reset link will be
            sent to your email.

        </div>


        <div
            class="back-login"
            onclick="showLogin()"
        >

            ← Back To Login

        </div>


    </div>


    <!-- =====================
         NEW PASSWORD
    ====================== -->

    <div
        id="newPassword"
        class="tab"
    >


        <div class="input-group">

            <label>
                New Password
            </label>

            <input
                type="password"
                id="newPasswordInput"
                placeholder="Enter new password"
                autocomplete="new-password"
            >

        </div>


        <div class="input-group">

            <label>
                Confirm New Password
            </label>

            <input
                type="password"
                id="confirmPasswordInput"
                placeholder="Confirm new password"
                autocomplete="new-password"
            >

        </div>


        <button
            id="updatePasswordBtn"
            class="submit-btn"
            onclick="updatePassword()"
        >

            Update Password

        </button>


    </div>


    <!-- =====================
         HOME
    ====================== -->

    <a
        href="index.html"
        class="home-link"
    >

        ← Back To Homepage

    </a>


</div>


<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
    "https://uxrltzlxdttbjstomhkb.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_bAbA5_9yIPt5IWQ0WwphMg_gdZ6E8-b";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text,type=""){

    const message =
        document.getElementById("msg");

    message.textContent = text;

    message.className =
        "message " + type;

}


/* =====================================================
   HIDE ALL FORMS
===================================================== */

function hideAllForms(){

    document
        .querySelectorAll(".tab")
        .forEach(form => {

            form.classList.remove("show");

        });

}


/* =====================================================
   SHOW SIGN UP
===================================================== */

function showSignup(){

    hideAllForms();

    document
        .getElementById("signup")
        .classList.add("show");


    document
        .getElementById("signupTabButton")
        .classList.add("active");


    document
        .getElementById("loginTabButton")
        .classList.remove("active");


    document
        .getElementById("normalTabs")
        .style.display = "flex";


    showMessage("");

}


/* =====================================================
   SHOW LOGIN
===================================================== */

function showLogin(){

    hideAllForms();

    document
        .getElementById("login")
        .classList.add("show");


    document
        .getElementById("loginTabButton")
        .classList.add("active");


    document
        .getElementById("signupTabButton")
        .classList.remove("active");


    document
        .getElementById("normalTabs")
        .style.display = "flex";


    showMessage("");

}


/* =====================================================
   SHOW FORGOT
===================================================== */

function showForgot(){

    hideAllForms();

    document
        .getElementById("forgot")
        .classList.add("show");


    document
        .getElementById("normalTabs")
        .style.display = "none";


    showMessage("");

}


/* =====================================================
   SHOW NEW PASSWORD
===================================================== */

function showNewPassword(){

    hideAllForms();

    document
        .getElementById("newPassword")
        .classList.add("show");


    document
        .getElementById("normalTabs")
        .style.display = "none";


    showMessage("");

}


/* =====================================================
   SIGN UP TEACHER
===================================================== */

async function signUpTeacher(){

    const name =
        document
            .getElementById("signupName")
            .value
            .trim();


    const email =
        document
            .getElementById("signupEmail")
            .value
            .trim();


    const password =
        document
            .getElementById("signupPassword")
            .value;


    if(!name){

        showMessage(
            "Please enter your full name.",
            "error"
        );

        return;

    }


    if(!email){

        showMessage(
            "Please enter your email.",
            "error"
        );

        return;

    }


    /*
       Basic email format check.
    */

    const emailPattern =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


    if(!emailPattern.test(email)){

        showMessage(
            "Please enter a valid email address.",
            "error"
        );

        return;

    }


    if(!password){

        showMessage(
            "Please create a password.",
            "error"
        );

        return;

    }


    if(password.length < 6){

        showMessage(
            "Password must be at least 6 characters.",
            "error"
        );

        return;

    }


    const button =
        document.getElementById("signupBtn");


    button.disabled = true;

    button.textContent =
        "Creating Account...";


    try{

        const {
            data,
            error
        } =
        await supabaseClient.auth.signUp({

            email:email,

            password:password,

            options:{

                data:{

                    full_name:name,

                    role:"teacher"

                },

                emailRedirectTo:
                    window.location.origin +
                    "/teacher.html"

            }

        });


        if(error){

            throw error;

        }


        /*
           If email confirmation is OFF,
           Supabase returns a session.
           Teacher goes directly to teacher.html.
        */

        if(data.session){

            window.location.replace(
                "teacher.html"
            );

            return;

        }


        /*
           Email confirmation is ON.
           No verification screen is created.
           Supabase sends the confirmation email.
        */

        showMessage(
            "Account created. Check your email and confirm your account.",
            "success"
        );


        button.disabled = false;

        button.textContent =
            "Create Teacher Account";


    }catch(error){

        showMessage(
            error.message ||
            "Unable to create account.",
            "error"
        );


        button.disabled = false;

        button.textContent =
            "Create Teacher Account";

    }

}


/* =====================================================
   LOGIN TEACHER
===================================================== */

async function loginTeacher(){

    const email =
        document
            .getElementById("loginEmail")
            .value
            .trim();


    const password =
        document
            .getElementById("loginPassword")
            .value;


    if(!email || !password){

        showMessage(
            "Please enter your email and password.",
            "error"
        );

        return;

    }


    const button =
        document.getElementById("loginBtn");


    button.disabled = true;

    button.textContent =
        "Logging In...";


    try{

        const {
            data,
            error
        } =
        await supabaseClient.auth
            .signInWithPassword({

                email:email,

                password:password

            });


        if(error){

            throw error;

        }


        if(data.session){

            window.location.replace(
                "teacher.html"
            );

        }


    }catch(error){

        showMessage(
            error.message ||
            "Invalid email or password.",
            "error"
        );


        button.disabled = false;

        button.textContent =
            "Login";

    }

}


/* =====================================================
   SEND PASSWORD RESET LINK
===================================================== */

async function sendResetLink(){

    const email =
        document
            .getElementById("forgotEmail")
            .value
            .trim();


    if(!email){

        showMessage(
            "Please enter your email.",
            "error"
        );

        return;

    }


    const emailPattern =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


    if(!emailPattern.test(email)){

        showMessage(
            "Please enter a valid email address.",
            "error"
        );

        return;

    }


    const button =
        document.getElementById("forgotBtn");


    button.disabled = true;

    button.textContent =
        "Sending...";


    try{

        /*
           Supabase sends the real recovery email.

           The same teacher-login.html receives
           the recovery session.
        */

        const redirectUrl =
            window.location.origin +
            window.location.pathname;


        const {
            error
        } =
        await supabaseClient.auth
            .resetPasswordForEmail(

                email,

                {

                    redirectTo:
                        redirectUrl

                }

            );


        if(error){

            throw error;

        }


        showMessage(
            "Password reset link sent to your email.",
            "success"
        );


        button.disabled = false;

        button.textContent =
            "Send Reset Link";


    }catch(error){

        showMessage(
            error.message ||
            "Unable to send reset link.",
            "error"
        );


        button.disabled = false;

        button.textContent =
            "Send Reset Link";

    }

}


/* =====================================================
   UPDATE PASSWORD
===================================================== */

async function updatePassword(){

    const password =
        document
            .getElementById("newPasswordInput")
            .value;


    const confirmPassword =
        document
            .getElementById("confirmPasswordInput")
            .value;


    if(!password || !confirmPassword){

        showMessage(
            "Please fill both password fields.",
            "error"
        );

        return;

    }


    if(password.length < 6){

        showMessage(
            "Password must be at least 6 characters.",
            "error"
        );

        return;

    }


    if(password !== confirmPassword){

        showMessage(
            "Passwords do not match.",
            "error"
        );

        return;

    }


    const button =
        document.getElementById(
            "updatePasswordBtn"
        );


    button.disabled = true;

    button.textContent =
        "Updating Password...";


    try{

        /*
           This requires the recovery session
           created by the Supabase email link.
        */

        const {
            error
        } =
        await supabaseClient.auth
            .updateUser({

                password:password

            });


        if(error){

            throw error;

        }


        showMessage(
            "Password changed successfully. Opening dashboard...",
            "success"
        );


        setTimeout(async ()=>{

            await supabaseClient.auth.signOut();

            window.location.replace(
                "teacher-login.html"
            );

        },1200);


    }catch(error){

        showMessage(
            error.message ||
            "Unable to change password.",
            "error"
        );


        button.disabled = false;

        button.textContent =
            "Update Password";

    }

}


/* =====================================================
   AUTH STATE
===================================================== */

supabaseClient.auth.onAuthStateChange(

    async (event,session)=>{

        /*
           Password recovery link opened.
        */

        if(event === "PASSWORD_RECOVERY"){

            showNewPassword();

            showMessage(
                "Create your new password.",
                "success"
            );

            return;

        }


        /*
           Normal sign-in.
        */

        if(
            event === "SIGNED_IN" &&
            session
        ){

            /*
               Do not redirect while using
               password recovery.
            */

            if(
                !window.location.hash
                    .includes("type=recovery")
            ){

                window.location.replace(
                    "teacher.html"
                );

            }

        }

    }

);


/* =====================================================
   CHECK CURRENT SESSION
===================================================== */

async function checkCurrentSession(){

    const {
        data
    } =
    await supabaseClient.auth.getSession();


    if(
        data &&
        data.session
    ){

        /*
           Already logged in.
           Go directly to teacher dashboard.
        */

        window.location.replace(
            "teacher.html"
        );

    }

}


checkCurrentSession();

</script>

</body>

</html>
