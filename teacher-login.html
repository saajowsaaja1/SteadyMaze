<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SteadyMaze | Teacher Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        radial-gradient(
            circle at top right,
            rgba(0,230,118,.12),
            transparent 35%
        ),
        radial-gradient(
            circle at bottom left,
            rgba(0,230,118,.07),
            transparent 30%
        ),
        #020504;

    color:#f5f8f6;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

.auth-card{
    width:100%;
    max-width:430px;

    padding:38px;

    background:rgba(7,16,11,.94);

    border:1px solid rgba(255,255,255,.08);

    border-radius:22px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.55);
}

.logo{
    text-align:center;

    font-size:30px;
    font-weight:900;

    margin-bottom:8px;
}

.logo span{
    color:#00e676;
}

.subtitle{
    text-align:center;

    color:#68756d;

    font-size:10px;

    margin-bottom:28px;
}

.tabs{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:6px;

    padding:5px;

    margin-bottom:22px;

    background:#020604;

    border-radius:11px;
}

.tab{
    border:0;

    padding:12px;

    border-radius:8px;

    background:transparent;

    color:#66736b;

    font-size:10px;

    font-weight:900;

    cursor:pointer;
}

.tab.active{
    background:#00e676;

    color:#001b0c;
}

.form{
    display:none;
}

.form.active{
    display:block;
}

label{
    display:block;

    margin-bottom:7px;

    color:#89958e;

    font-size:9px;

    font-weight:800;
}

input{
    width:100%;

    padding:14px;

    margin-bottom:15px;

    background:#020604;

    border:1px solid rgba(255,255,255,.08);

    border-radius:10px;

    outline:none;

    color:white;

    font-size:11px;
}

input:focus{
    border-color:#00e676;

    box-shadow:
        0 0 0 3px rgba(0,230,118,.06);
}

.main-button{
    width:100%;

    padding:14px;

    margin-top:5px;

    border:0;

    border-radius:10px;

    background:#00e676;

    color:#001b0c;

    font-size:10px;

    font-weight:900;

    cursor:pointer;

    transition:.2s;
}

.main-button:hover{
    transform:translateY(-1px);

    box-shadow:
        0 10px 30px rgba(0,230,118,.15);
}

.main-button:disabled{
    opacity:.6;

    cursor:not-allowed;

    transform:none;
}

.forgot{
    display:block;

    margin-top:16px;

    text-align:center;

    color:#00e676;

    font-size:9px;

    font-weight:800;

    text-decoration:none;

    cursor:pointer;
}

.back{
    display:block;

    margin-top:25px;

    text-align:center;

    color:#56635b;

    font-size:9px;

    text-decoration:none;
}

.back:hover{
    color:#00e676;
}

.message{
    display:none;

    margin-bottom:15px;

    padding:11px;

    border-radius:8px;

    background:rgba(0,230,118,.07);

    color:#00e676;

    font-size:9px;

    line-height:1.5;

    text-align:center;
}

.message.error{
    background:rgba(255,70,70,.08);

    color:#ff7070;
}

.info{
    margin-top:13px;

    color:#68756d;

    text-align:center;

    font-size:9px;

    line-height:1.5;
}

@media(max-width:500px){

    .auth-card{
        padding:27px 22px;
    }

    .logo{
        font-size:25px;
    }

}

</style>

</head>

<body>

<div class="auth-card">

    <div class="logo">
        Steady<span>Maze</span>
    </div>

    <div class="subtitle">
        Teacher Portal
    </div>


    <div
        id="message"
        class="message"
    ></div>


    <!-- TABS -->

    <div
        class="tabs"
        id="tabs"
    >

        <button
            id="loginTab"
            class="tab active"
            type="button"
            onclick="showLogin()"
        >
            LOGIN
        </button>

        <button
            id="signupTab"
            class="tab"
            type="button"
            onclick="showSignup()"
        >
            SIGN UP
        </button>

    </div>


    <!-- LOGIN -->

    <form
        id="loginForm"
        class="form active"
        onsubmit="loginTeacher(event)"
    >

        <label>EMAIL</label>

        <input
            type="email"
            id="loginEmail"
            placeholder="Enter your teacher email"
            autocomplete="email"
            required
        >


        <label>PASSWORD</label>

        <input
            type="password"
            id="loginPassword"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >


        <button
            type="submit"
            id="loginButton"
            class="main-button"
        >
            LOGIN
        </button>


        <a
            class="forgot"
            onclick="showForgot()"
        >
            Forgot Password?
        </a>

    </form>


    <!-- SIGN UP -->

    <form
        id="signupForm"
        class="form"
        onsubmit="createTeacher(event)"
    >

        <label>FULL NAME</label>

        <input
            type="text"
            id="signupName"
            placeholder="Enter your full name"
            autocomplete="name"
            required
        >


        <label>EMAIL</label>

        <input
            type="email"
            id="signupEmail"
            placeholder="Enter your teacher email"
            autocomplete="email"
            required
        >


        <label>PASSWORD</label>

        <input
            type="password"
            id="signupPassword"
            placeholder="Create password"
            minlength="6"
            autocomplete="new-password"
            required
        >


        <button
            type="submit"
            id="signupButton"
            class="main-button"
        >
            CREATE TEACHER ACCOUNT
        </button>


        <div class="info">
            A confirmation email will be sent
            after registration.
        </div>

    </form>


    <!-- FORGOT PASSWORD -->

    <form
        id="forgotForm"
        class="form"
        onsubmit="sendReset(event)"
    >

        <label>ACCOUNT EMAIL</label>

        <input
            type="email"
            id="forgotEmail"
            placeholder="Enter your teacher email"
            required
        >


        <button
            type="submit"
            id="forgotButton"
            class="main-button"
        >
            SEND RESET LINK
        </button>


        <div class="info">
            A password reset link will be sent
            to your email.
        </div>


        <a
            class="forgot"
            onclick="showLogin()"
        >
            ← Back To Login
        </a>

    </form>


    <!-- NEW PASSWORD -->

    <form
        id="newPasswordForm"
        class="form"
        onsubmit="changePassword(event)"
    >

        <label>NEW PASSWORD</label>

        <input
            type="password"
            id="newPassword"
            minlength="6"
            placeholder="Create new password"
            required
        >


        <label>CONFIRM PASSWORD</label>

        <input
            type="password"
            id="confirmPassword"
            minlength="6"
            placeholder="Confirm new password"
            required
        >


        <button
            type="submit"
            id="changePasswordButton"
            class="main-button"
        >
            CREATE NEW PASSWORD
        </button>

    </form>


    <a
        href="index.html"
        class="back"
    >
        ← Back To Homepage
    </a>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================
   SUPABASE CONFIG
========================================= */

const SUPABASE_URL =
    "https://uxrltzlxdttbjstomhkb.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_bAbA5_9yIPt5IWQ0WwphMg_gdZ6E8-b";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================================
   MESSAGE
========================================= */

function showMessage(text,isError=false){

    const box =
        document.getElementById("message");

    box.textContent = text;

    box.style.display = "block";

    box.classList.toggle(
        "error",
        isError
    );
}


function clearMessage(){

    const box =
        document.getElementById("message");

    box.textContent = "";

    box.style.display = "none";

    box.classList.remove("error");
}


/* =========================================
   HIDE FORMS
========================================= */

function hideForms(){

    document
        .querySelectorAll(".form")
        .forEach(function(form){

            form.classList.remove("active");

        });

}


/* =========================================
   LOGIN SCREEN
========================================= */

function showLogin(){

    hideForms();

    document
        .getElementById("loginForm")
        .classList.add("active");

    document
        .getElementById("tabs")
        .style.display = "grid";

    document
        .getElementById("loginTab")
        .classList.add("active");

    document
        .getElementById("signupTab")
        .classList.remove("active");

    clearMessage();
}


/* =========================================
   SIGNUP SCREEN
========================================= */

function showSignup(){

    hideForms();

    document
        .getElementById("signupForm")
        .classList.add("active");

    document
        .getElementById("tabs")
        .style.display = "grid";

    document
        .getElementById("signupTab")
        .classList.add("active");

    document
        .getElementById("loginTab")
        .classList.remove("active");

    clearMessage();
}


/* =========================================
   FORGOT SCREEN
========================================= */

function showForgot(){

    hideForms();

    document
        .getElementById("forgotForm")
        .classList.add("active");

    document
        .getElementById("tabs")
        .style.display = "none";

    clearMessage();
}


/* =========================================
   NEW PASSWORD
========================================= */

function showNewPassword(){

    hideForms();

    document
        .getElementById("newPasswordForm")
        .classList.add("active");

    document
        .getElementById("tabs")
        .style.display = "none";

}


/* =========================================
   CREATE TEACHER
========================================= */

async function createTeacher(event){

    event.preventDefault();

    clearMessage();


    const name =
        document
            .getElementById("signupName")
            .value
            .trim();


    const email =
        document
            .getElementById("signupEmail")
            .value
            .trim()
            .toLowerCase();


    const password =
        document
            .getElementById("signupPassword")
            .value;


    const button =
        document.getElementById("signupButton");


    button.disabled = true;

    button.textContent =
        "CREATING...";


    try{

        const {
            data,
            error
        } =
        await supabaseClient.auth.signUp({

            email:email,

            password:password,

            options:{

                data:{

                    full_name:name,

                    role:"teacher"

                },

                emailRedirectTo:
                    window.location.origin +
                    window.location.pathname

            }

        });


        if(error){

            throw error;

        }


        /*
        EMAIL CONFIRMATION ON
        */

        if(!data.session){

            document
                .getElementById("signupForm")
                .reset();

            showMessage(
                "Account created. Check your email and confirm your SteadyMaze account, then login."
            );

            return;

        }


        /*
        EMAIL CONFIRMATION OFF
        */

        await supabaseClient.auth.signOut();


        document
            .getElementById("signupForm")
            .reset();


        showLogin();


        showMessage(
            "Account created successfully. You can now login."
        );


    }catch(error){

        console.error(error);

        showMessage(
            error.message ||
            "Could not create teacher account.",
            true
        );

    }finally{

        button.disabled = false;

        button.textContent =
            "CREATE TEACHER ACCOUNT";

    }

}


/* =========================================
   TEACHER LOGIN
========================================= */

async function loginTeacher(event){

    event.preventDefault();

    clearMessage();


    const email =
        document
            .getElementById("loginEmail")
            .value
            .trim()
            .toLowerCase();


    const password =
        document
            .getElementById("loginPassword")
            .value;


    const button =
        document.getElementById("loginButton");


    button.disabled = true;

    button.textContent =
        "LOGGING IN...";


    try{

        /*
        SUPABASE AUTH LOGIN
        */

        const {
            data,
            error
        } =
        await supabaseClient.auth
            .signInWithPassword({

                email:email,

                password:password

            });


        if(error){

            throw error;

        }


        if(!data.user){

            throw new Error(
                "User account was not found."
            );

        }


        /*
        GET TEACHER PROFILE
        */

        const {
            data:teacher,
            error:teacherError
        } =
        await supabaseClient
            .from("teachers")
            .select(`
                id,
                user_id,
                full_name,
                email,
                status,
                skill,
                bio,
                total_students,
                total_lessons,
                total_earnings,
                rating
            `)
            .eq(
                "user_id",
                data.user.id
            )
            .maybeSingle();


        if(teacherError){

            throw teacherError;

        }


        if(!teacher){

            await supabaseClient.auth.signOut();

            throw new Error(
                "Teacher profile was not found."
            );

        }


        /*
        APPROVED
        */

        if(
            teacher.status === "approved"
        ){

            window.location.replace(
                "teacher.html"
            );

            return;

        }


        /*
        PENDING
        */

        if(
            teacher.status === "pending"
        ){

            await supabaseClient.auth.signOut();

            showMessage(
                "Your teacher account is waiting for administrator approval.",
                true
            );

            return;

        }


        /*
        REJECTED
        */

        if(
            teacher.status === "rejected"
        ){

            await supabaseClient.auth.signOut();

            showMessage(
                "Your teacher application was rejected.",
                true
            );

            return;

        }


        await supabaseClient.auth.signOut();

        showMessage(
            "Your teacher account is not active yet.",
            true
        );


    }catch(error){

        console.error(error);

        showMessage(
            error.message ||
            "Login failed.",
            true
        );

    }finally{

        button.disabled = false;

        button.textContent =
            "LOGIN";

    }

}


/* =========================================
   FORGOT PASSWORD
========================================= */

async function sendReset(event){

    event.preventDefault();

    clearMessage();


    const email =
        document
            .getElementById("forgotEmail")
            .value
            .trim()
            .toLowerCase();


    const button =
        document.getElementById("forgotButton");


    button.disabled = true;

    button.textContent =
        "SENDING...";


    try{

        const redirectUrl =
            window.location.origin +
            window.location.pathname;


        const {
            error
        } =
        await supabaseClient.auth
            .resetPasswordForEmail(

                email,

                {
                    redirectTo:
                        redirectUrl
                }

            );


        if(error){

            throw error;

        }


        showMessage(
            "Password reset link has been sent. Check your email."
        );


    }catch(error){

        showMessage(
            error.message ||
            "Could not send reset email.",
            true
        );

    }finally{

        button.disabled = false;

        button.textContent =
            "SEND RESET LINK";

    }

}


/* =========================================
   CHANGE PASSWORD
========================================= */

async function changePassword(event){

    event.preventDefault();

    clearMessage();


    const password =
        document
            .getElementById("newPassword")
            .value;


    const confirm =
        document
            .getElementById("confirmPassword")
            .value;


    if(password.length < 6){

        showMessage(
            "Password must contain at least 6 characters.",
            true
        );

        return;

    }


    if(password !== confirm){

        showMessage(
            "Passwords do not match.",
            true
        );

        return;

    }


    const button =
        document.getElementById(
            "changePasswordButton"
        );


    button.disabled = true;

    button.textContent =
        "UPDATING...";


    try{

        const {
            error
        } =
        await supabaseClient.auth
            .updateUser({

                password:password

            });


        if(error){

            throw error;

        }


        showMessage(
            "Password changed successfully. Please login again."
        );


        setTimeout(
            async function(){

                await supabaseClient.auth.signOut();

                showLogin();

            },
            1500
        );


    }catch(error){

        showMessage(
            error.message ||
            "Could not change password.",
            true
        );

    }finally{

        button.disabled = false;

        button.textContent =
            "CREATE NEW PASSWORD";

    }

}


/* =========================================
   PASSWORD RECOVERY
========================================= */

supabaseClient.auth
.onAuthStateChange(
    function(event){

        if(
            event === "PASSWORD_RECOVERY"
        ){

            showNewPassword();

            showMessage(
                "Create your new SteadyMaze password."
            );

        }

    }
);


/* =========================================
   CHECK RECOVERY URL
========================================= */

function checkRecovery(){

    const hash =
        window.location.hash;

    const search =
        window.location.search;


    if(
        hash.includes("type=recovery") ||
        search.includes("type=recovery")
    ){

        setTimeout(
            function(){

                showNewPassword();

            },
            300
        );

    }

}


/* =========================================
   START
========================================= */

checkRecovery();

</script>

</body>

</html>
