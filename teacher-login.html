<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Teacher Login | Gurhub</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:
linear-gradient(135deg,#021427,#0d2f56);
padding:20px;
}

.card{
width:100%;
max-width:500px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.1);
border-radius:25px;
padding:35px;
color:white;
}

.logo{
text-align:center;
font-size:34px;
font-weight:800;
margin-bottom:25px;
}

.logo span{
color:gold;
}

.tabs{
display:flex;
margin-bottom:20px;
border-radius:10px;
overflow:hidden;
}

.tabs button{
flex:1;
padding:14px;
border:none;
cursor:pointer;
font-weight:bold;
}

.active{
background:#2563eb;
color:white;
}

.tab{
display:none;
}

.tab.show{
display:block;
}

.input-group{
margin-bottom:15px;
}

.input-group label{
display:block;
margin-bottom:6px;
font-size:14px;
}

.input-group input{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:white;
}

.submit-btn{
width:100%;
padding:15px;
border:none;
border-radius:10px;
background:gold;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

.link{
display:block;
text-align:center;
margin-top:15px;
color:#9ec5ff;
text-decoration:none;
}

.home-link{
display:block;
text-align:center;
margin-top:25px;
color:white;
text-decoration:none;
}

.message{
text-align:center;
margin-bottom:15px;
color:#7fffd4;
}

</style>
</head>
<body>

<div class="card">

<div class="logo">
GUR<span>HUB</span>
</div>

<div class="tabs">
<button class="active" onclick="openTab('signup',this)">Sign Up</button>
<button onclick="openTab('login',this)">Login</button>
</div>

<div id="msg" class="message"></div>

<!-- SIGNUP -->

<div id="signup" class="tab show">

<div class="input-group">
<label>Full Name</label>
<input type="text" id="signupName">
</div>

<div class="input-group">
<label>Email</label>
<input type="email" id="signupEmail">
</div>

<div class="input-group">
<label>Password</label>
<input type="password" id="signupPassword">
</div>

<button class="submit-btn" onclick="createAccount()">
Create Account
</button>

</div>

<!-- LOGIN -->

<div id="login" class="tab">

<div class="input-group">
<label>Email</label>
<input type="email" id="loginEmail">
</div>

<div class="input-group">
<label>Password</label>
<input type="password" id="loginPassword">
</div>

<button class="submit-btn" onclick="loginTeacher()">
Login
</button>

<a href="#" class="link" onclick="showForgot()">
Forgot Password?
</a>

</div>

<a href="index.html" class="home-link">
← Back To Homepage
</a>

</div>

<script>

function openTab(tab,btn){

document.querySelectorAll('.tab')
.forEach(t=>t.classList.remove('show'));

document.getElementById(tab)
.classList.add('show');

document.querySelectorAll('.tabs button')
.forEach(b=>b.classList.remove('active'));

btn.classList.add('active');

}

function createAccount(){

let name=
document.getElementById('signupName').value.trim();

let email=
document.getElementById('signupEmail').value.trim();

let password=
document.getElementById('signupPassword').value.trim();

if(!name || !email || !password){

alert('Fill all fields');

return;

}

let teacher={

name:name,
email:email,
password:password

};

localStorage.setItem(
'teacherAccount',
JSON.stringify(teacher)
);

window.location.href=
'teacher-dashboard.html';

}

function loginTeacher(){

let email=
document.getElementById('loginEmail').value;

let password=
document.getElementById('loginPassword').value;

let teacher=
JSON.parse(
localStorage.getItem('teacherAccount')
);

if(!teacher){

alert('Account not found');

return;

}

if(
teacher.email===email &&
teacher.password===password
){

window.location.href=
'teacher-dashboard.html';

}else{

alert('Invalid login');

}

}

function showForgot(){

let email=
prompt(
'Enter your account email'
);

if(email){

document.getElementById('msg')
.innerHTML=
'Password reset request received for: '+email;

}

}

</script>

</body>
</html>
