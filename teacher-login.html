<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SteadyMaze | Teacher Login</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}
body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:
        radial-gradient(
            circle at top right,
            rgba(212,175,55,.16),
            transparent 35%
        ),
        radial-gradient(
            circle at bottom left,
            rgba(37,99,235,.18),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #031326,
            #0d2f56
        );
    color:white;
}
.card{
    width:100%;
    max-width:460px;
    padding:35px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.10);
    border-radius:24px;
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    box-shadow:
        0 25px 80px rgba(0,0,0,.55);
}
.logo{
    text-align:center;
    font-size:34px;
    font-weight:900;
    margin-bottom:7px;
}
.logo span{
    color:#d4af37;
}
.subtitle{
    text-align:center;
    color:#a9b7c9;
    font-size:12px;
    margin-bottom:28px;
}
.tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:5px;
    padding:5px;
    margin-bottom:22px;
    background:rgba(0,0,0,.25);
    border-radius:12px;
}
.tab-button{
    border:0;
    padding:13px;
    border-radius:8px;
    background:transparent;
    color:#91a1b4;
    font-size:13px;
    font-weight:800;
    cursor:pointer;
}
.tab-button.active{
    background:#2563eb;
    color:white;
}
.form{
    display:none;
}
.form.active{
    display:block;
}
.input-group{
    margin-bottom:15px;
}
.input-group label{
    display:block;
    margin-bottom:7px;
    color:#c2ccda;
    font-size:11px;
    font-weight:800;
}
.input-group input{
    width:100%;
    padding:14px;
    border:1px solid rgba(255,255,255,.10);
    border-radius:10px;
    outline:none;
    background:#f7f9fc;
    color:#111;
    font-size:14px;
}
.input-group input:focus{
    border-color:#d4af37;
    box-shadow:
        0 0 0 3px
        rgba(212,175,55,.12);
}
.submit-btn{
    width:100%;
    padding:14px;
    margin-top:5px;
    border:0;
    border-radius:10px;
    background:
        linear-gradient(
            135deg,
            #d4af37,
            #f1cc62
        );
    color:#071426;
    font-size:13px;
    font-weight:900;
    cursor:pointer;
    transition:.2s;
}
.submit-btn:hover{
    transform:translateY(-1px);
    box-shadow:
        0 10px 30px
        rgba(212,175,55,.22);
}
.submit-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
}
.forgot{
    display:block;
    text-align:center;
    margin-top:16px;
    color:#79aaff;
    font-size:12px;
    font-weight:800;
    cursor:pointer;
    text-decoration:none;
}
.forgot:hover{
    color:#d4af37;
}
.back{
    display:block;
    margin-top:25px;
    text-align:center;
    color:#aab7c7;
    font-size:12px;
    text-decoration:none;
}
.back:hover{
    color:#d4af37;
}
.message{
    display:none;
    margin-bottom:16px;
    padding:12px;
    border-radius:9px;
    text-align:center;
    font-size:12px;
    line-height:1.5;
    background:rgba(0,230,118,.08);
    color:#7fffd4;
}
.message.error{
    background:rgba(255,70,70,.10);
    color:#ff7b7b;
}
.info{
    margin-top:13px;
    text-align:center;
    color:#93a3b6;
    font-size:11px;
    line-height:1.5;
}
@media(max-width:500px){
    .card{
        padding:28px 22px;
    }
    .logo{
        font-size:30px;
    }
}
</style>
</head>
<body>
<div class="card">
    <!-- LOGO -->
    <div class="logo">
        Steady<span>Maze</span>
    </div>
    <div class="subtitle">
        Teacher Portal
    </div>
    <!-- MESSAGE -->
    <div
        id="message"
        class="message"
    ></div>
    <!-- TABS -->
    <div
        class="tabs"
        id="tabs"
    >
        <button
            id="signupTab"
            class="tab-button active"
            onclick="showSignup()"
        >
            SIGN UP
        </button>
        <button
            id="loginTab"
            class="tab-button"
            onclick="showLogin()"
        >
            LOGIN
        </button>
    </div>
    <!-- =========================
         SIGN UP
    ========================== -->
    <div
        id="signupForm"
        class="form active"
    >
        <div class="input-group">
            <label>
                FULL NAME
            </label>
            <input
                type="text"
                id="signupName"
                placeholder="Enter your full name"
                autocomplete="name"
            >
        </div>
        <div class="input-group">
            <label>
                EMAIL
            </label>
            <input
                type="email"
                id="signupEmail"
                placeholder="Enter your email"
                autocomplete="email"
            >
        </div>
        <div class="input-group">
            <label>
                PASSWORD
            </label>
            <input
                type="password"
                id="signupPassword"
                placeholder="Create your password"
                autocomplete="new-password"
            >
        </div>
        <button
            id="signupButton"
            class="submit-btn"
            onclick="createTeacherAccount()"
        >
            CREATE TEACHER ACCOUNT
        </button>
        <div class="info">
            After creating your account, check your
            email to confirm your SteadyMaze account.
        </div>
    </div>
    <!-- =========================
         LOGIN
    ========================== -->
    <div
        id="loginForm"
        class="form"
    >
        <div class="input-group">
            <label>
                EMAIL
            </label>
            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                autocomplete="email"
            >
        </div>
        <div class="input-group">
            <label>
                PASSWORD
            </label>
            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                autocomplete="current-password"
            >
        </div>
        <button
            id="loginButton"
            class="submit-btn"
            onclick="loginTeacher()"
        >
            LOGIN
        </button>
        <a
            class="forgot"
            onclick="showForgot()"
        >
            Forgot Password?
        </a>
    </div>
    <!-- =========================
         FORGOT PASSWORD
    ========================== -->
    <div
        id="forgotForm"
        class="form"
    >
        <div class="input-group">
            <label>
                ACCOUNT EMAIL
            </label>
            <input
                type="email"
                id="forgotEmail"
                placeholder="Enter your teacher email"
                autocomplete="email"
            >
        </div>
        <button
            id="forgotButton"
            class="submit-btn"
            onclick="sendResetLink()"
        >
            SEND RESET LINK
        </button>
        <div class="info">
            A password reset link will be sent to
            your account email.
        </div>
        <a
            class="forgot"
            onclick="showLogin()"
        >
            ← Back To Login
        </a>
    </div>
    <!-- =========================
         NEW PASSWORD
    ========================== -->
    <div
        id="newPasswordForm"
        class="form"
    >
        <div class="input-group">
            <label>
                NEW PASSWORD
            </label>
            <input
                type="password"
                id="newPassword"
                placeholder="Create new password"
                autocomplete="new-password"
            >
        </div>
        <div class="input-group">
            <label>
                CONFIRM PASSWORD
            </label>
            <input
                type="password"
                id="confirmNewPassword"
                placeholder="Confirm your password"
                autocomplete="new-password"
            >
        </div>
        <button
            id="updatePasswordButton"
            class="submit-btn"
            onclick="updateTeacherPassword()"
        >
            CREATE NEW PASSWORD
        </button>
    </div>
    <!-- HOME -->
    <a
        href="index.html"
        class="back"
    >
        ← Back To Homepage
    </a>
</div>
<!-- ============================
     SUPABASE LIBRARY
============================= -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ==========================================
   SUPABASE CONFIGURATION
========================================== */
const SUPABASE_URL =
    "https://uxrltzlxdttbjstomhkb.supabase.co";
const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_bAbA5_9yIPt5IWQ0WwphMg_gdZ6E8-b";
const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );
/* ==========================================
   MESSAGE
========================================== */
function showMessage(
    text,
    isError = false
){
    const message =
        document.getElementById("message");
    message.textContent = text;
    message.style.display = "block";
    message.classList.toggle(
        "error",
        isError
    );
}
function clearMessage(){
    const message =
        document.getElementById("message");
    message.textContent = "";
    message.style.display = "none";
    message.classList.remove("error");
}
/* ==========================================
   HIDE ALL FORMS
========================================== */
function hideForms(){
    document
        .querySelectorAll(".form")
        .forEach(function(form){
            form.classList.remove("active");
        });
}
/* ==========================================
   SIGN UP SCREEN
========================================== */
function showSignup(){
    hideForms();
    document
        .getElementById("signupForm")
        .classList.add("active");
    document
        .getElementById("signupTab")
        .classList.add("active");
    document
        .getElementById("loginTab")
        .classList.remove("active");
    document
        .getElementById("tabs")
        .style.display = "grid";
    clearMessage();
}
/* ==========================================
   LOGIN SCREEN
========================================== */
function showLogin(){
    hideForms();
    document
        .getElementById("loginForm")
        .classList.add("active");
    document
        .getElementById("loginTab")
        .classList.add("active");
    document
        .getElementById("signupTab")
        .classList.remove("active");
    document
        .getElementById("tabs")
        .style.display = "grid";
    clearMessage();
}
/* ==========================================
   FORGOT PASSWORD SCREEN
========================================== */
function showForgot(){
    hideForms();
    document
        .getElementById("forgotForm")
        .classList.add("active");
    document
        .getElementById("tabs")
        .style.display = "none";
    clearMessage();
}
/* ==========================================
   NEW PASSWORD SCREEN
========================================== */
function showNewPassword(){
    hideForms();
    document
        .getElementById("newPasswordForm")
        .classList.add("active");
    document
        .getElementById("tabs")
        .style.display = "none";
}
/* ==========================================
   CREATE TEACHER ACCOUNT
========================================== */
async function createTeacherAccount(){
    clearMessage();
    const name =
        document
            .getElementById("signupName")
            .value
            .trim();
    const email =
        document
            .getElementById("signupEmail")
            .value
            .trim()
            .toLowerCase();
    const password =
        document
            .getElementById("signupPassword")
            .value;
    if(!name || !email || !password){
        showMessage(
            "Please fill in all fields.",
            true
        );
        return;
    }
    if(password.length < 6){
        showMessage(
            "Password must be at least 6 characters.",
            true
        );
        return;
    }
    const button =
        document.getElementById(
            "signupButton"
        );
    button.disabled = true;
    button.textContent =
        "CREATING...";
    try{
        const {
            data,
            error
        } =
        await supabaseClient.auth.signUp({
            email:email,
            password:password,
            options:{
                data:{
                    full_name:name,
                    role:"teacher"
                },
                emailRedirectTo:
                    window.location.origin +
                    "/teacher-login.html"
            }
        });
        if(error){
            throw error;
        }
        /*
         * Email confirmation is enabled.
         *
         * No verification screen is created.
         * Supabase sends the confirmation email.
         */
        if(!data.session){
            showMessage(
                "Account created successfully. Check your email and confirm your SteadyMaze account, then come back and login."
            );
        }else{
            /*
             * If email confirmation is disabled,
             * a session may be returned.
             *
             * Login is still used to enter
             * the teacher dashboard.
             */
            showMessage(
                "Account created successfully. You can now login."
            );
        }
        document
            .getElementById("signupName")
            .value = "";
        document
            .getElementById("signupEmail")
            .value = "";
        document
            .getElementById("signupPassword")
            .value = "";
    }catch(error){
        let message =
            error.message ||
            "Could not create teacher account.";
        if(
            message
                .toLowerCase()
                .includes("already registered")
        ){
            message =
                "This email is already registered. Please login instead.";
        }
        showMessage(
            message,
            true
        );
    }finally{
        button.disabled = false;
        button.textContent =
            "CREATE TEACHER ACCOUNT";
    }
}
/* ==========================================
   LOGIN TEACHER
========================================== */
async function loginTeacher(){
    clearMessage();
    const email =
        document
            .getElementById("loginEmail")
            .value
            .trim()
            .toLowerCase();
    const password =
        document
            .getElementById("loginPassword")
            .value;
    if(!email || !password){
        showMessage(
            "Enter your email and password.",
            true
        );
        return;
    }
    const button =
        document.getElementById(
            "loginButton"
        );
    button.disabled = true;
    button.textContent =
        "LOGGING IN...";
    try{
        /*
         * Supabase checks:
         *
         * EMAIL
         * PASSWORD
         * EMAIL CONFIRMATION
         */
        const {
            data,
            error
        } =
        await supabaseClient.auth
            .signInWithPassword({
                email:email,
                password:password
            });
        if(error){
            /*
             * Email not confirmed
             */
            if(
                error.message
                    .toLowerCase()
                    .includes("email not confirmed")
            ){
                throw new Error(
                    "Please confirm your email first, then login."
                );
            }
            throw error;
        }
        if(!data.user){
            throw new Error(
                "User account was not found."
            );
        }
        /*
         * CHECK TEACHER PROFILE
         *
         * Expected table:
         *
         * teachers
         *
         * user_id
         * full_name
         * email
         * status
         */
        const {
            data:teacher,
            error:teacherError
        } =
        await supabaseClient
            .from("teachers")
            .select(
                "id,user_id,full_name,email,status"
            )
            .eq(
                "user_id",
                data.user.id
            )
            .maybeSingle();
        if(teacherError){
            throw teacherError;
        }
        if(!teacher){
            await supabaseClient.auth
                .signOut();
            throw new Error(
                "Teacher profile was not found. Please contact the administrator."
            );
        }
        /*
         * APPROVED TEACHER
         */
        if(
            teacher.status ===
            "approved"
        ){
            window.location.replace(
                "teacher.html"
            );
            return;
        }
        /*
         * PENDING TEACHER
         */
        if(
            teacher.status ===
            "pending"
        ){
            await supabaseClient.auth
                .signOut();
            throw new Error(
                "Your teacher account is waiting for administrator approval."
            );
        }
        /*
         * REJECTED TEACHER
         */
        if(
            teacher.status ===
            "rejected"
        ){
            await supabaseClient.auth
                .signOut();
            throw new Error(
                "Your teacher application was rejected."
            );
        }
        /*
         * UNKNOWN STATUS
         */
        await supabaseClient.auth
            .signOut();
        throw new Error(
            "Your teacher account is not active."
        );
    }catch(error){
        showMessage(
            error.message ||
            "Login failed.",
            true
        );
    }finally{
        button.disabled = false;
        button.textContent =
            "LOGIN";
    }
}
/* ==========================================
   SEND PASSWORD RESET LINK
========================================== */
async function sendResetLink(){
    clearMessage();
    const email =
        document
            .getElementById("forgotEmail")
            .value
            .trim()
            .toLowerCase();
    if(!email){
        showMessage(
            "Enter your account email.",
            true
        );
        return;
    }
    const button =
        document.getElementById(
            "forgotButton"
        );
    button.disabled = true;
    button.textContent =
        "SENDING...";
    try{
        /*
         * Supabase sends the reset email.
         *
         * The link returns to this
         * teacher-login.html page.
         */
        const redirectUrl =
            window.location.origin +
            window.location.pathname;
        const {
            error
        } =
        await supabaseClient.auth
            .resetPasswordForEmail(
                email,
                {
                    redirectTo:
                        redirectUrl
                }
            );
        if(error){
            throw error;
        }
        showMessage(
            "Password reset link sent. Check your email and open the link to create a new password."
        );
    }catch(error){
        showMessage(
            error.message ||
            "Could not send password reset link.",
            true
        );
    }finally{
        button.disabled = false;
        button.textContent =
            "SEND RESET LINK";
    }
}
/* ==========================================
   UPDATE NEW PASSWORD
========================================== */
async function updateTeacherPassword(){
    clearMessage();
    const password =
        document
            .getElementById("newPassword")
            .value;
    const confirmPassword =
        document
            .getElementById("confirmNewPassword")
            .value;
    if(password.length < 6){
        showMessage(
            "Password must be at least 6 characters.",
            true
        );
        return;
    }
    if(password !== confirmPassword){
        showMessage(
            "Passwords do not match.",
            true
        );
        return;
    }
    const button =
        document.getElementById(
            "updatePasswordButton"
        );
    button.disabled = true;
    button.textContent =
        "UPDATING...";
    try{
        const {
            error
        } =
        await supabaseClient.auth
            .updateUser({
                password:password
            });
        if(error){
            throw error;
        }
        showMessage(
            "Password changed successfully. You can now login."
        );
        setTimeout(
            async function(){
                await supabaseClient.auth
                    .signOut();
                showLogin();
            },
            1500
        );
    }catch(error){
        showMessage(
            error.message ||
            "Could not change password.",
            true
        );
        button.disabled = false;
        button.textContent =
            "CREATE NEW PASSWORD";
    }
}
/* ==========================================
   PASSWORD RECOVERY EVENT
========================================== */
supabaseClient.auth
.onAuthStateChange(
    function(event){
        if(
            event ===
            "PASSWORD_RECOVERY"
        ){
            showNewPassword();
            showMessage(
                "Create your new SteadyMaze password."
            );
        }
    }
);
/* ==========================================
   CHECK PASSWORD RECOVERY LINK
========================================== */
function checkPasswordRecovery(){
    const hash =
        window.location.hash;
    if(
        hash &&
        hash.includes("type=recovery")
    ){
        setTimeout(
            function(){
                showNewPassword();
            },
            500
        );
    }
}
/* ==========================================
   START
========================================== */
checkPasswordRecovery();
</script>
</body>
</html>
