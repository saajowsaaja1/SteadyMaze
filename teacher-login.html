<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Login | GURHUB</title>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#031326,#0d2f56);
padding:20px;
}

.card{
width:100%;
max-width:500px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.1);
border-radius:25px;
padding:35px;
color:white;
}

.logo{
text-align:center;
font-size:38px;
font-weight:800;
margin-bottom:25px;
}

.logo span{
color:#d4af37;
}

.tabs{
display:flex;
margin-bottom:20px;
overflow:hidden;
border-radius:12px;
}

.tabs button{
flex:1;
padding:15px;
border:none;
cursor:pointer;
font-size:16px;
font-weight:bold;
}

.active{
background:#2563eb;
color:white;
}

.tab{
display:none;
}

.tab.show{
display:block;
}

.input-group{
margin-bottom:15px;
}

.input-group label{
display:block;
margin-bottom:6px;
font-size:14px;
}

.input-group input{
width:100%;
padding:14px;
border:none;
border-radius:10px;
outline:none;
}

.submit-btn{
width:100%;
padding:15px;
border:none;
border-radius:10px;
background:#d4af37;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

.submit-btn:hover{
opacity:.9;
}

.submit-btn:disabled{
opacity:.6;
cursor:not-allowed;
}

.home-link{
display:block;
text-align:center;
margin-top:25px;
text-decoration:none;
color:white;
font-size:18px;
}

.message{
text-align:center;
margin-bottom:15px;
color:#7fffd4;
min-height:20px;
}

</style>
</head>

<body>

<div class="card">

<div class="logo">
GUR<span>HUB</span>
</div>

<div id="msg" class="message"></div>

<div class="tabs">

<button
class="active"
type="button"
onclick="openTab('signup',this)"
>
Sign Up
</button>

<button
type="button"
onclick="openTab('login',this)"
>
Login
</button>

</div>

<!-- SIGNUP -->

<div id="signup" class="tab show">

<div class="input-group">

<label>
Full Name
</label>

<input
type="text"
id="signupName"
autocomplete="name"
>

</div>

<div class="input-group">

<label>
Email
</label>

<input
type="email"
id="signupEmail"
autocomplete="email"
>

</div>

<div class="input-group">

<label>
Password
</label>

<input
type="password"
id="signupPassword"
autocomplete="new-password"
>

</div>

<button
class="submit-btn"
id="signupBtn"
type="button"
onclick="createAccount()"
>
Create Account
</button>

</div>

<!-- LOGIN -->

<div id="login" class="tab">

<div class="input-group">

<label>
Email
</label>

<input
type="email"
id="loginEmail"
autocomplete="email"
>

</div>

<div class="input-group">

<label>
Password
</label>

<input
type="password"
id="loginPassword"
autocomplete="current-password"
>

</div>

<button
class="submit-btn"
id="loginBtn"
type="button"
onclick="loginTeacher()"
>
Login
</button>

</div>

<a
href="index.html"
class="home-link"
>
← Back To Homepage
</a>

</div>

<script>

/* =====================================================
   SUPABASE CONNECTION
===================================================== */

const SUPABASE_URL =
"https://uxrltzlxdttbjstomhkb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_bAbA5_9yIPt5IWQ0WwphMg_gdZ6E8-b";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(message,type="success"){

const msg =
document.getElementById("msg");

msg.textContent =
message;

if(type === "error"){

msg.style.color =
"#ff7b7b";

}else{

msg.style.color =
"#7fffd4";

}

}


/* =====================================================
   TAB
===================================================== */

function openTab(tab,btn){

document
.querySelectorAll(".tab")
.forEach(tabBox=>{

tabBox.classList.remove("show");

});

document
.getElementById(tab)
.classList.add("show");

document
.querySelectorAll(".tabs button")
.forEach(button=>{

button.classList.remove("active");

});

btn.classList.add("active");

showMessage("");

}


/* =====================================================
   CREATE TEACHER ACCOUNT
===================================================== */

async function createAccount(){

const name =
document
.getElementById("signupName")
.value
.trim();

const email =
document
.getElementById("signupEmail")
.value
.trim()
.toLowerCase();

const password =
document
.getElementById("signupPassword")
.value
.trim();

if(!name || !email || !password){

showMessage(
"Fill all fields",
"error"
);

return;

}

if(password.length < 6){

showMessage(
"Password must be at least 6 characters.",
"error"
);

return;

}

const signupBtn =
document.getElementById(
"signupBtn"
);

signupBtn.disabled = true;

signupBtn.textContent =
"Creating Account...";

try{

/*
   Supabase Auth creates the account.
   Because Confirm Email is enabled
   in your Supabase project, Supabase
   will send the confirmation email.
*/

const {
data,
error
} =
await supabaseClient
.auth
.signUp({

email:email,

password:password,

options:{

data:{
full_name:name,
role:"teacher"
},

emailRedirectTo:
window.location.origin +
"/teacher-login.html"

}

});


if(error){

showMessage(
error.message,
"error"
);

return;

}


/*
   When Confirm Email is ON,
   Supabase normally returns a user
   without an active session until
   the email is confirmed.
*/

if(
data &&
data.user &&
!data.session
){

showMessage(
"Account created successfully. Check your email and click the confirmation link before logging in."
);

document
.getElementById("signupPassword")
.value = "";

return;

}


/*
   If Supabase allows an immediate
   session, check the user.
*/

if(
data &&
data.user
){

showMessage(
"Account created successfully. Please check your email to confirm your account."
);

document
.getElementById("signupPassword")
.value = "";

return;

}

showMessage(
"Account creation completed. Check your email for confirmation."
);

}catch(error){

console.error(
"Teacher signup error:",
error
);

showMessage(
"Unable to create account. Please try again.",
"error"
);

}finally{

signupBtn.disabled = false;

signupBtn.textContent =
"Create Account";

}

}


/* =====================================================
   LOGIN TEACHER
===================================================== */

async function loginTeacher(){

const email =
document
.getElementById("loginEmail")
.value
.trim()
.toLowerCase();

const password =
document
.getElementById("loginPassword")
.value
.trim();

if(!email || !password){

showMessage(
"Fill all fields",
"error"
);

return;

}

const loginBtn =
document.getElementById(
"loginBtn"
);

loginBtn.disabled = true;

loginBtn.textContent =
"Logging in...";

try{

/*
   Login through Supabase Auth.
*/

const {
data,
error
} =
await supabaseClient
.auth
.signInWithPassword({

email:email,

password:password

});


if(error){

/*
   If email is not confirmed,
   Supabase normally returns an
   authentication error.
*/

showMessage(
error.message,
"error"
);

return;

}

if(
!data ||
!data.user ||
!data.session
){

showMessage(
"Login failed. Please try again.",
"error"
);

return;

}


/*
   Check email confirmation.
*/

const user =
data.user;

if(!user.email_confirmed_at){

await supabaseClient
.auth
.signOut();

showMessage(
"Please confirm your email before logging in.",
"error"
);

return;

}


/*
   Save only non-sensitive teacher
   session information for the UI.

   Password is NEVER stored.
*/

sessionStorage.setItem(
"gurhub_teacher",
JSON.stringify({

id:user.id,

name:
user.user_metadata?.full_name ||
"Teacher",

email:
user.email,

skill:"Teacher"

})
);


/*
   Go to Teacher Dashboard.
*/

window.location.href =
"teacher.html";

}catch(error){

console.error(
"Teacher login error:",
error
);

showMessage(
"Unable to login. Please check your email and password.",
"error"
);

}finally{

loginBtn.disabled = false;

loginBtn.textContent =
"Login";

}

}


/* =====================================================
   AUTH STATE
===================================================== */

supabaseClient
.auth
.onAuthStateChange(
async function(event,session){

if(
event === "SIGNED_IN" &&
session &&
session.user
){

console.log(
"Teacher Supabase session active:",
session.user.id
);

}

if(
event === "SIGNED_OUT"
){

sessionStorage.removeItem(
"gurhub_teacher"
);

}

});


/* =====================================================
   CHECK EXISTING SESSION
===================================================== */

async function checkExistingSession(){

try{

const {
data,
error
} =
await supabaseClient
.auth
.getSession();

if(error){

console.error(
"Session check error:",
error.message
);

return;

}

if(
data &&
data.session &&
data.session.user
){

const user =
data.session.user;

if(
user.email_confirmed_at
){

console.log(
"Confirmed teacher session found."
);

}

}

}catch(error){

console.error(
"Session check failed:",
error
);

}

}

checkExistingSession();

</script>

</body>
</html>
