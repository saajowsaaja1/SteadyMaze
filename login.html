<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SteadyMaze | Student Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;

    font-family:Arial,Helvetica,sans-serif;
    color:white;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(255,0,60,.22),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 15%,
            rgba(255,140,0,.20),
            transparent 30%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(128,0,255,.20),
            transparent 35%
        ),
        #07030a;
}

.auth-card{
    width:100%;
    max-width:440px;

    padding:36px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.10),
            rgba(255,255,255,.035)
        );

    border:1px solid rgba(255,215,120,.25);

    border-radius:25px;

    box-shadow:
        0 30px 100px rgba(0,0,0,.65),
        0 0 50px rgba(255,0,60,.08);

    backdrop-filter:blur(22px);
}

.logo{
    text-align:center;
    font-size:34px;
    font-weight:900;
    letter-spacing:-1px;
    margin-bottom:7px;

    background:
        linear-gradient(
            90deg,
            #ffd700,
            #ff8c00,
            #ff304f,
            #b65cff
        );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.subtitle{
    text-align:center;
    color:#c7bdca;
    font-size:10px;
    font-weight:700;
    letter-spacing:2px;
    margin-bottom:27px;
}

.tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;

    padding:5px;
    margin-bottom:23px;

    background:rgba(0,0,0,.45);
    border:1px solid rgba(255,255,255,.07);
    border-radius:13px;
}

.tab{
    border:0;
    padding:13px;

    border-radius:9px;

    background:transparent;
    color:#8f8793;

    font-size:10px;
    font-weight:900;

    cursor:pointer;
}

.tab.active{
    color:white;

    background:
        linear-gradient(
            90deg,
            #ff1744,
            #ff8c00
        );

    box-shadow:
        0 7px 22px rgba(255,60,0,.20);
}

.form{
    display:none;
}

.form.active{
    display:block;
}

label{
    display:block;
    margin-bottom:7px;

    color:#ddd4df;

    font-size:9px;
    font-weight:900;
    letter-spacing:1px;
}

.input-wrap{
    position:relative;
}

input{
    width:100%;

    padding:14px;

    margin-bottom:16px;

    background:
        rgba(0,0,0,.42);

    border:
        1px solid
        rgba(255,255,255,.10);

    border-radius:11px;

    outline:none;

    color:white;

    font-size:11px;
}

input:focus{
    border-color:#ff9d00;

    box-shadow:
        0 0 0 3px
        rgba(255,140,0,.08);
}

.password-input{
    padding-right:55px;
}

.toggle-password{
    position:absolute;

    right:10px;
    top:8px;

    height:32px;
    min-width:42px;

    border:0;
    border-radius:8px;

    background:
        rgba(255,255,255,.07);

    color:#ffd166;

    cursor:pointer;

    font-size:15px;
}

.toggle-password:hover{
    background:
        rgba(255,140,0,.14);
}

.main-button{
    width:100%;

    padding:15px;

    margin-top:3px;

    border:0;
    border-radius:11px;

    background:
        linear-gradient(
            90deg,
            #ff1744,
            #ff8c00,
            #ffd000
        );

    color:#170600;

    font-size:10px;
    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 10px 30px
        rgba(255,70,0,.18);
}

.main-button:hover{
    transform:translateY(-1px);
}

.main-button:disabled{
    opacity:.55;
    cursor:not-allowed;
    transform:none;
}

.forgot{
    display:block;

    margin-top:17px;

    text-align:center;

    color:#c58cff;

    font-size:9px;
    font-weight:900;

    cursor:pointer;
}

.forgot:hover{
    color:#ffd166;
}

.back{
    display:block;

    margin-top:25px;

    text-align:center;

    color:#8d8292;

    font-size:9px;

    text-decoration:none;
}

.back:hover{
    color:#ffd166;
}

.message{
    display:none;

    margin-bottom:15px;

    padding:11px;

    border-radius:10px;

    background:
        rgba(255,166,0,.08);

    border:
        1px solid
        rgba(255,166,0,.15);

    color:#ffd166;

    font-size:9px;

    line-height:1.5;

    text-align:center;
}

.message.error{
    background:
        rgba(255,0,60,.09);

    border-color:
        rgba(255,0,60,.18);

    color:#ff7189;
}

.info{
    margin-top:13px;

    color:#827887;

    text-align:center;

    font-size:9px;

    line-height:1.5;
}

@media(max-width:500px){

    .auth-card{
        padding:28px 21px;
    }

    .logo{
        font-size:29px;
    }
}

</style>
</head>

<body>

<div class="auth-card">

    <div class="logo">
        SteadyMaze
    </div>

    <div class="subtitle">
        STUDENT PORTAL
    </div>

    <div
        id="message"
        class="message"
    ></div>

    <div
        class="tabs"
        id="tabs"
    >

        <button
            id="loginTab"
            class="tab active"
            type="button"
            onclick="showLogin()"
        >
            LOGIN
        </button>

        <button
            id="signupTab"
            class="tab"
            type="button"
            onclick="showSignup()"
        >
            SIGN UP
        </button>

    </div>


    <!-- LOGIN -->

    <form
        id="loginForm"
        class="form active"
        onsubmit="loginStudent(event)"
    >

        <label>
            EMAIL
        </label>

        <input
            type="email"
            id="loginEmail"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >

        <label>
            PASSWORD
        </label>

        <div class="input-wrap">

            <input
                type="password"
                id="loginPassword"
                class="password-input"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button
                type="button"
                class="toggle-password"
                onclick="togglePassword('loginPassword',this)"
                aria-label="Show password"
            >
                👁
            </button>

        </div>

        <button
            type="submit"
            id="loginButton"
            class="main-button"
        >
            LOGIN
        </button>

        <span
            class="forgot"
            onclick="showForgot()"
        >
            Forgot Password?
        </span>

    </form>


    <!-- SIGN UP -->

    <form
        id="signupForm"
        class="form"
        onsubmit="createStudent(event)"
    >

        <label>
            FULL NAME
        </label>

        <input
            type="text"
            id="signupName"
            placeholder="Enter your full name"
            autocomplete="name"
            required
        >

        <label>
            EMAIL
        </label>

        <input
            type="email"
            id="signupEmail"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >

        <label>
            PASSWORD
        </label>

        <div class="input-wrap">

            <input
                type="password"
                id="signupPassword"
                class="password-input"
                placeholder="Create password"
                minlength="6"
                autocomplete="new-password"
                required
            >

            <button
                type="button"
                class="toggle-password"
                onclick="togglePassword('signupPassword',this)"
            >
                👁
            </button>

        </div>

        <button
            type="submit"
            id="signupButton"
            class="main-button"
        >
            CREATE STUDENT ACCOUNT
        </button>

        <div class="info">
            Your account is managed securely by Supabase.
        </div>

    </form>


    <!-- FORGOT PASSWORD -->

    <form
        id="forgotForm"
        class="form"
        onsubmit="sendReset(event)"
    >

        <label>
            ACCOUNT EMAIL
        </label>

        <input
            type="email"
            id="forgotEmail"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >

        <button
            type="submit"
            id="forgotButton"
            class="main-button"
        >
            SEND RESET LINK
        </button>

        <div class="info">
            Supabase will send the password reset link.
        </div>

        <span
            class="forgot"
            onclick="showLogin()"
        >
            ← Back To Login
        </span>

    </form>


    <!-- NEW PASSWORD -->

    <form
        id="newPasswordForm"
        class="form"
        onsubmit="changePassword(event)"
    >

        <label>
            NEW PASSWORD
        </label>

        <div class="input-wrap">

            <input
                type="password"
                id="newPassword"
                class="password-input"
                placeholder="Create new password"
                minlength="6"
                autocomplete="new-password"
                required
            >

            <button
                type="button"
                class="toggle-password"
                onclick="togglePassword('newPassword',this)"
            >
                👁
            </button>

        </div>

        <label>
            CONFIRM PASSWORD
        </label>

        <div class="input-wrap">

            <input
                type="password"
                id="confirmPassword"
                class="password-input"
                placeholder="Confirm password"
                minlength="6"
                autocomplete="new-password"
                required
            >

            <button
                type="button"
                class="toggle-password"
                onclick="togglePassword('confirmPassword',this)"
            >
                👁
            </button>

        </div>

        <button
            type="submit"
            id="changePasswordButton"
            class="main-button"
        >
            CHANGE PASSWORD
        </button>

    </form>


    <a
        href="index.html"
        class="back"
    >
        ← Back To Homepage
    </a>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://uxrltzlxdttbjstomhkb.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_bAbA5_9yIPt5IWQ0WwphMg_gdZ6E8-b";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================================
   MESSAGE
========================================= */

function showMessage(text,isError=false){

    const box =
        document.getElementById("message");

    box.textContent = text;

    box.style.display = "block";

    box.classList.toggle(
        "error",
        isError
    );
}

function clearMessage(){

    const box =
        document.getElementById("message");

    box.textContent = "";

    box.style.display = "none";

    box.classList.remove("error");
}


/* =========================================
   PASSWORD SHOW / HIDE
========================================= */

function togglePassword(id,button){

    const input =
        document.getElementById(id);

    if(!input) return;

    if(input.type === "password"){

        input.type = "text";

        button.textContent = "🙈";

    }else{

        input.type = "password";

        button.textContent = "👁";

    }

}


/* =========================================
   FORM CONTROL
========================================= */

function hideForms(){

    document
        .querySelectorAll(".form")
        .forEach(function(form){

            form.classList.remove("active");

        });
}

function showLogin(){

    hideForms();

    document
        .getElementById("loginForm")
        .classList.add("active");

    document
        .getElementById("tabs")
        .style.display = "grid";

    document
        .getElementById("loginTab")
        .classList.add("active");

    document
        .getElementById("signupTab")
        .classList.remove("active");

    clearMessage();
}

function showSignup(){

    hideForms();

    document
        .getElementById("signupForm")
        .classList.add("active");

    document
        .getElementById("tabs")
        .style.display = "grid";

    document
        .getElementById("signupTab")
        .classList.add("active");

    document
        .getElementById("loginTab")
        .classList.remove("active");

    clearMessage();
}

function showForgot(){

    hideForms();

    document
        .getElementById("forgotForm")
        .classList.add("active");

    document
        .getElementById("tabs")
        .style.display = "none";

    clearMessage();
}

function showNewPassword(){

    hideForms();

    document
        .getElementById("newPasswordForm")
        .classList.add("active");

    document
        .getElementById("tabs")
        .style.display = "none";
}


/* =========================================
   CREATE STUDENT
========================================= */

async function createStudent(event){

    event.preventDefault();

    clearMessage();

    const name =
        document
            .getElementById("signupName")
            .value
            .trim();

    const email =
        document
            .getElementById("signupEmail")
            .value
            .trim()
            .toLowerCase();

    const password =
        document
            .getElementById("signupPassword")
            .value;

    if(
        !name ||
        !email ||
        !password
    ){

        showMessage(
            "Please fill in all fields.",
            true
        );

        return;
    }

    if(password.length < 6){

        showMessage(
            "Password must contain at least 6 characters.",
            true
        );

        return;
    }

    const button =
        document.getElementById(
            "signupButton"
        );

    button.disabled = true;

    button.textContent =
        "CREATING...";

    try{

        /*
         * Supabase Auth only.
         *
         * No localStorage.
         */

        const {
            data,
            error
        } =
        await supabaseClient.auth.signUp({

            email:email,

            password:password,

            options:{
                data:{
                    full_name:name,
                    role:"student"
                }
            }

        });

        if(error){
            throw error;
        }

        /*
         * If email confirmation is enabled,
         * Supabase will handle it.
         */

        if(!data.session){

            document
                .getElementById("signupForm")
                .reset();

            showMessage(
                "Account created. Please follow the Supabase email confirmation process before logging in."
            );

            return;
        }

        /*
         * If confirmation is disabled,
         * login can continue normally.
         */

        await supabaseClient.auth.signOut();

        document
            .getElementById("signupForm")
            .reset();

        showLogin();

        showMessage(
            "Account created successfully. You can now login."
        );

    }catch(error){

        showMessage(
            error.message ||
            "Could not create account.",
            true
        );

    }finally{

        button.disabled = false;

        button.textContent =
            "CREATE STUDENT ACCOUNT";
    }

}


/* =========================================
   LOGIN STUDENT
========================================= */

async function loginStudent(event){

    event.preventDefault();

    clearMessage();

    const email =
        document
            .getElementById("loginEmail")
            .value
            .trim()
            .toLowerCase();

    const password =
        document
            .getElementById("loginPassword")
            .value;

    const button =
        document.getElementById(
            "loginButton"
        );

    button.disabled = true;

    button.textContent =
        "LOGGING IN...";

    try{

        /*
         * Login through Supabase Auth.
         */

        const {
            data,
            error
        } =
        await supabaseClient.auth
            .signInWithPassword({

                email:email,

                password:password

            });

        if(error){
            throw error;
        }

        if(!data.user){

            throw new Error(
                "Account not found."
            );
        }

        /*
         * IMPORTANT:
         *
         * We do NOT query
         * students.full_name.
         *
         * This prevents:
         *
         * column students.full_name
         * does not exist
         *
         * from breaking the login.
         *
         * Supabase Auth has already
         * successfully authenticated
         * the student.
         */

        window.location.replace(
            "student.html"
        );

    }catch(error){

        let message =
            error.message ||
            "Login failed.";

        /*
         * Friendly Supabase errors.
         */

        if(
            message
                .toLowerCase()
                .includes("invalid login credentials")
        ){

            message =
                "Incorrect email or password.";

        }

        if(
            message
                .toLowerCase()
                .includes("email not confirmed")
        ){

            message =
                "Please confirm your email before logging in.";

        }

        showMessage(
            message,
            true
        );

    }finally{

        button.disabled = false;

        button.textContent =
            "LOGIN";
    }

}


/* =========================================
   FORGOT PASSWORD
========================================= */

async function sendReset(event){

    event.preventDefault();

    clearMessage();

    const email =
        document
            .getElementById("forgotEmail")
            .value
            .trim()
            .toLowerCase();

    const button =
        document.getElementById(
            "forgotButton"
        );

    button.disabled = true;

    button.textContent =
        "SENDING...";

    try{

        const {
            error
        } =
        await supabaseClient.auth
            .resetPasswordForEmail(
                email,
                {
                    redirectTo:
                        window.location.origin +
                        window.location.pathname
                }
            );

        if(error){
            throw error;
        }

        showMessage(
            "Password reset link has been sent to your email."
        );

    }catch(error){

        showMessage(
            error.message ||
            "Could not send reset link.",
            true
        );

    }finally{

        button.disabled = false;

        button.textContent =
            "SEND RESET LINK";
    }

}


/* =========================================
   CHANGE PASSWORD
========================================= */

async function changePassword(event){

    event.preventDefault();

    clearMessage();

    const password =
        document
            .getElementById("newPassword")
            .value;

    const confirm =
        document
            .getElementById("confirmPassword")
            .value;

    if(password.length < 6){

        showMessage(
            "Password must contain at least 6 characters.",
            true
        );

        return;
    }

    if(password !== confirm){

        showMessage(
            "Passwords do not match.",
            true
        );

        return;
    }

    const button =
        document.getElementById(
            "changePasswordButton"
        );

    button.disabled = true;

    button.textContent =
        "UPDATING...";

    try{

        const {
            error
        } =
        await supabaseClient.auth
            .updateUser({
                password:password
            });

        if(error){
            throw error;
        }

        showMessage(
            "Password changed successfully."
        );

        setTimeout(
            async function(){

                await supabaseClient.auth
                    .signOut();

                showLogin();

            },
            1500
        );

    }catch(error){

        showMessage(
            error.message ||
            "Could not change password.",
            true
        );

    }finally{

        button.disabled = false;

        button.textContent =
            "CHANGE PASSWORD";
    }

}


/* =========================================
   AUTH STATE
========================================= */

supabaseClient.auth
    .onAuthStateChange(
        function(event){

            if(
                event ===
                "PASSWORD_RECOVERY"
            ){

                showNewPassword();

                showMessage(
                    "Create your new password."
                );
            }

        }
    );


/* =========================================
   RECOVERY CHECK
========================================= */

function checkRecovery(){

    const hash =
        window.location.hash;

    const search =
        window.location.search;

    if(
        hash.includes("type=recovery") ||
        search.includes("type=recovery")
    ){

        setTimeout(
            function(){

                showNewPassword();

            },
            500
        );
    }

}

checkRecovery();

</script>

</body>
</html>
