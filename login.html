<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>SteadyMaze | Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at top right,
            rgba(0,230,118,.12),
            transparent 35%
        ),
        radial-gradient(
            circle at bottom left,
            rgba(0,230,118,.07),
            transparent 30%
        ),
        #020504;

    color:#f5f8f6;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* CARD */

.auth-card{

    width:100%;
    max-width:430px;

    margin:20px;

    padding:38px;

    background:
        rgba(7,16,11,.94);

    border:1px solid
        rgba(255,255,255,.08);

    border-radius:22px;

    box-shadow:
        0 25px 80px
        rgba(0,0,0,.55);
}


/* LOGO */

.logo{

    text-align:center;

    font-size:28px;

    font-weight:900;

    margin-bottom:8px;
}

.logo span{
    color:#00e676;
}

.subtitle{

    text-align:center;

    color:#68756d;

    font-size:10px;

    margin-bottom:30px;
}


/* TABS */

.tabs{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:6px;

    padding:5px;

    margin-bottom:25px;

    background:#020604;

    border-radius:11px;
}

.tab{

    border:0;

    padding:12px;

    border-radius:8px;

    background:transparent;

    color:#66736b;

    font-size:10px;

    font-weight:900;

    cursor:pointer;
}

.tab.active{

    background:#00e676;

    color:#001b0c;
}


/* FORM */

.form{
    display:none;
}

.form.active{
    display:block;
}

label{

    display:block;

    margin-bottom:7px;

    color:#89958e;

    font-size:9px;

    font-weight:800;
}

input{

    width:100%;

    padding:14px;

    margin-bottom:16px;

    background:#020604;

    border:1px solid
        rgba(255,255,255,.08);

    border-radius:10px;

    outline:none;

    color:white;

    font-size:11px;
}

input:focus{

    border-color:#00e676;

    box-shadow:
        0 0 0 3px
        rgba(0,230,118,.06);
}


/* BUTTON */

.main-button{

    width:100%;

    padding:14px;

    margin-top:5px;

    border:0;

    border-radius:10px;

    background:#00e676;

    color:#001b0c;

    font-size:10px;

    font-weight:900;

    cursor:pointer;

    transition:.2s;
}

.main-button:hover{

    transform:translateY(-1px);

    box-shadow:
        0 10px 30px
        rgba(0,230,118,.15);
}


/* FORGOT */

.forgot{

    display:block;

    margin-top:16px;

    text-align:center;

    color:#00e676;

    font-size:9px;

    font-weight:800;

    text-decoration:none;

    cursor:pointer;
}


/* BACK */

.back{

    display:block;

    margin-top:25px;

    text-align:center;

    color:#56635b;

    font-size:9px;

    text-decoration:none;
}

.back:hover{
    color:#00e676;
}


/* MESSAGE */

.message{

    display:none;

    margin-bottom:15px;

    padding:11px;

    border-radius:8px;

    background:
        rgba(0,230,118,.07);

    color:#00e676;

    font-size:9px;

    text-align:center;
}


/* MOBILE */

@media(max-width:500px){

    .auth-card{
        padding:27px 22px;
    }

    .logo{
        font-size:24px;
    }

}

</style>

</head>


<body>


<div class="auth-card">


    <div class="logo">

        Steady<span>Maze</span>

    </div>


    <div class="subtitle">

        Learn digital skills. Build projects. Compete.

    </div>


    <!-- TABS -->

    <div class="tabs">

        <button
            class="tab active"
            id="loginTab"
            onclick="showLogin()"
        >
            LOGIN
        </button>


        <button
            class="tab"
            id="signupTab"
            onclick="showSignup()"
        >
            SIGN UP
        </button>

    </div>


    <!-- MESSAGE -->

    <div
        class="message"
        id="message"
    ></div>


    <!-- LOGIN -->

    <form
        class="form active"
        id="loginForm"
        onsubmit="loginStudent(event)"
    >

        <label>
            EMAIL
        </label>

        <input
            type="email"
            id="loginEmail"
            placeholder="Enter your email"
            required
        >


        <label>
            PASSWORD
        </label>

        <input
            type="password"
            id="loginPassword"
            placeholder="Enter your password"
            required
        >


        <button
            type="submit"
            class="main-button"
        >
            LOGIN
        </button>


        <a
            class="forgot"
            onclick="showForgot()"
        >
            Forgot Password?
        </a>

    </form>


    <!-- SIGN UP -->

    <form
        class="form"
        id="signupForm"
        onsubmit="createAccount(event)"
    >

        <label>
            FULL NAME
        </label>

        <input
            type="text"
            id="signupName"
            placeholder="Enter your name"
            required
        >


        <label>
            EMAIL
        </label>

        <input
            type="email"
            id="signupEmail"
            placeholder="Enter your email"
            required
        >


        <label>
            PASSWORD
        </label>

        <input
            type="password"
            id="signupPassword"
            placeholder="Create a password"
            required
        >


        <button
            type="submit"
            class="main-button"
        >
            CREATE ACCOUNT
        </button>

    </form>


    <!-- FORGOT PASSWORD -->

    <form
        class="form"
        id="forgotForm"
        onsubmit="forgotPassword(event)"
    >

        <label>
            EMAIL
        </label>

        <input
            type="email"
            id="forgotEmail"
            placeholder="Enter your account email"
            required
        >


        <button
            type="submit"
            class="main-button"
        >
            RESET PASSWORD
        </button>


        <a
            class="forgot"
            onclick="showLogin()"
        >
            ← Back to Login
        </a>

    </form>


    <a
        href="index.html"
        class="back"
    >
        ← Back to Homepage
    </a>


</div>


<script>


/* SHOW LOGIN */

function showLogin(){

    document
        .getElementById("loginForm")
        .classList.add("active");

    document
        .getElementById("signupForm")
        .classList.remove("active");

    document
        .getElementById("forgotForm")
        .classList.remove("active");


    document
        .getElementById("loginTab")
        .classList.add("active");

    document
        .getElementById("signupTab")
        .classList.remove("active");


    clearMessage();
}


/* SHOW SIGN UP */

function showSignup(){

    document
        .getElementById("loginForm")
        .classList.remove("active");

    document
        .getElementById("signupForm")
        .classList.add("active");

    document
        .getElementById("forgotForm")
        .classList.remove("active");


    document
        .getElementById("loginTab")
        .classList.remove("active");

    document
        .getElementById("signupTab")
        .classList.add("active");


    clearMessage();
}


/* FORGOT PASSWORD */

function showForgot(){

    document
        .getElementById("loginForm")
        .classList.remove("active");

    document
        .getElementById("signupForm")
        .classList.remove("active");

    document
        .getElementById("forgotForm")
        .classList.add("active");


    document
        .getElementById("loginTab")
        .classList.remove("active");

    document
        .getElementById("signupTab")
        .classList.remove("active");


    clearMessage();
}


/* CREATE ACCOUNT */

function createAccount(event){

    event.preventDefault();


    const name =
        document
        .getElementById("signupName")
        .value;

    const email =
        document
        .getElementById("signupEmail")
        .value;

    const password =
        document
        .getElementById("signupPassword")
        .value;


    /*
       DEMO ONLY

       Later this will connect to
       PostgreSQL/backend.
    */

    localStorage.setItem(
        "steadymazeName",
        name
    );

    localStorage.setItem(
        "steadymazeEmail",
        email
    );


    localStorage.setItem(
        "steadymazeLoggedIn",
        "true"
    );


    /*
       SEND STUDENT TO DASHBOARD
    */

    window.location.href =
        "student.html";
}


/* LOGIN */

function loginStudent(event){

    event.preventDefault();


    const email =
        document
        .getElementById("loginEmail")
        .value;

    const password =
        document
        .getElementById("loginPassword")
        .value;


    if(email && password){

        localStorage.setItem(
            "steadymazeLoggedIn",
            "true"
        );


        window.location.href =
            "student.html";

    }

}


/* FORGOT PASSWORD */

function forgotPassword(event){

    event.preventDefault();


    const message =
        document.getElementById(
            "message"
        );


    message.style.display =
        "block";

    message.textContent =
        "Password reset will be connected to email service later.";
}


/* MESSAGE */

function clearMessage(){

    const message =
        document.getElementById(
            "message"
        );

    message.style.display =
        "none";

    message.textContent =
        "";
}

</script>


</body>

</html>

<section class="teacher-login-section">
  <div class="teacher-login-card">

    <div class="teacher-login-header">
      <div class="teacher-icon">🎓</div>

      <h2>Teacher Login</h2>
      <p>Sign in to access your SteadyMaze Teacher Dashboard.</p>
    </div>

    <form id="teacherLoginForm">

      <!-- Email -->
      <div class="form-group">

          id="teacherEmail"
          name="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >

      <!-- Password -->
      <div class="form-group">

        <div class="password-wrapper">

            id="teacherPassword"
            name="password"
            placeholder="Enter your password"

          >

          <button

          <input type="checkbox" id="rememberTeacher">

        <a href="#" id="forgotTeacherPassword">
          Forgot Password?
        </a>

      </div>

      <!-- Login Button -->
      <button type="submit" class="teacher-login-btn">
        Login

      <div
        id="teacherLoginMessage"
        class="login-message"
        role="alert"
        aria-live="polite"
      ></div>

    <!-- Create Account -->
    <div class="teacher-create-account">

    </div>

    </div>

  </div>
</section>

<!-- =========================
     TEACHER LOGIN JAVASCRIPT
     FRONTEND ONLY
     ========================= -->

<script>

const teacherPasswordInput =
  document.getElementById("teacherPassword");

const showTeacherPassword =
  document.getElementById("showTeacherPassword");

const teacherLoginForm =
  document.getElementById("teacherLoginForm");

const teacherLoginMessage =
  document.getElementById("teacherLoginMessage");


/* Show / Hide Password */

if (showTeacherPassword) {

  showTeacherPassword.addEventListener("click", function () {

    if (teacherPasswordInput.type === "password") {

      teacherPasswordInput.type = "text";
      showTeacherPassword.textContent = "🙈";

    } else {

      teacherPasswordInput.type = "password";
      showTeacherPassword.textContent = "👁";

    }

  });

}


/* Login */

if (teacherLoginForm) {

  teacherLoginForm.addEventListener("submit", function(event) {

    event.preventDefault();

    const email =
      document.getElementById("teacherEmail").value.trim();

    const password =
      teacherPasswordInput.value;

    if (!email || !password) {

      teacherLoginMessage.textContent =
        "Please enter your email and password.";

      return;

    }

    /*
      IMPORTANT:

      This is only frontend UI.

      Later we will replace this with:

      Authentication
          ↓
      PostgreSQL
          ↓
      Check role
          ↓
      Check account status
          ↓
      Teacher Dashboard

      We will NOT store real passwords here.
    */

    teacherLoginMessage.textContent =
      "Login system will be connected to the database.";

  });

}


/* Forgot Password */

const forgotTeacherPassword =
  document.getElementById("forgotTeacherPassword");

if (forgotTeacherPassword) {

  forgotTeacherPassword.addEventListener("click", function(event) {

    event.preventDefault();

    teacherLoginMessage.textContent =
      "Password recovery will be connected later.";

  });

}


/* Create Teacher Account */

const createTeacherAccount =
  document.getElementById("createTeacherAccount");

if (createTeacherAccount) {

  createTeacherAccount.addEventListener("click", function() {

    /*
      Later this will open:

      teacher-signup.html

      or the Teacher Create Account section.
    */

  });

}

</script>
