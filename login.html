<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>SteadyMaze | Student Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(255,0,70,.20),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 15%,
            rgba(255,145,0,.18),
            transparent 30%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(125,40,255,.20),
            transparent 35%
        ),
        #080509;

    color:#fff;
}

.auth-card{

    width:100%;
    max-width:440px;

    padding:38px;

    border-radius:26px;

    background:
        linear-gradient(
            145deg,
            rgba(35,10,20,.96),
            rgba(13,7,20,.96)
        );

    border:
        1px solid
        rgba(255,190,70,.25);

    box-shadow:
        0 30px 90px rgba(0,0,0,.65),
        0 0 45px rgba(255,70,30,.08);

    position:relative;
    overflow:hidden;
}

.auth-card::before{

    content:"";

    position:absolute;

    width:180px;
    height:180px;

    top:-100px;
    right:-80px;

    background:#ff5a00;

    opacity:.12;

    filter:blur(45px);
}

.logo{

    text-align:center;

    font-size:32px;

    font-weight:900;

    letter-spacing:.5px;

    margin-bottom:8px;
}

.logo .gold{
    color:#d4af37;
}

.logo .red{
    color:#ff3b30;
}

.logo .purple{
    color:#a855f7;
}

.subtitle{

    text-align:center;

    color:#c9c1ca;

    font-size:10px;

    font-weight:700;

    letter-spacing:2px;

    margin-bottom:12px;
}

.brand-line{

    width:70px;
    height:2px;

    margin:
        0 auto
        24px;

    border-radius:20px;

    background:
        linear-gradient(
            90deg,
            #ff3030,
            #d4af37,
            #a855f7,
            #ff7a00
        );
}

.tabs{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:6px;

    padding:5px;

    margin-bottom:22px;

    background:#090609;

    border:
        1px solid
        rgba(255,255,255,.06);

    border-radius:12px;
}

.tab{

    border:0;

    padding:13px;

    border-radius:9px;

    background:transparent;

    color:#9a919c;

    font-size:10px;

    font-weight:900;

    cursor:pointer;
}

.tab.active{

    background:
        linear-gradient(
            135deg,
            #d4af37,
            #ff7a00
        );

    color:#170b05;

    box-shadow:
        0 6px 20px
        rgba(255,120,0,.18);
}

.form{
    display:none;
}

.form.active{
    display:block;
}

label{

    display:block;

    margin-bottom:7px;

    color:#ddd3dc;

    font-size:9px;

    font-weight:900;

    letter-spacing:1px;
}

input{

    width:100%;

    padding:14px;

    margin-bottom:16px;

    background:#08060a;

    border:
        1px solid
        rgba(255,255,255,.10);

    border-radius:11px;

    outline:none;

    color:#fff;

    font-size:11px;

    transition:.2s;
}

input::placeholder{
    color:#665d68;
}

input:focus{

    border-color:#d4af37;

    box-shadow:
        0 0 0 3px
        rgba(212,175,55,.07),

        0 0 20px
        rgba(255,70,30,.05);
}

.main-button{

    width:100%;

    padding:15px;

    margin-top:4px;

    border:0;

    border-radius:11px;

    background:
        linear-gradient(
            135deg,
            #d4af37,
            #ff7a00,
            #ff3030
        );

    color:#fff;

    font-size:10px;

    font-weight:900;

    letter-spacing:1px;

    cursor:pointer;

    transition:.2s;
}

.main-button:hover{

    transform:
        translateY(-1px);

    box-shadow:
        0 12px 30px
        rgba(255,80,20,.20);
}

.main-button:disabled{

    opacity:.55;

    cursor:not-allowed;

    transform:none;
}

.forgot{

    display:block;

    margin-top:17px;

    text-align:center;

    color:#c084fc;

    font-size:9px;

    font-weight:900;

    text-decoration:none;

    cursor:pointer;
}

.forgot:hover{
    color:#d4af37;
}

.back{

    display:block;

    margin-top:26px;

    text-align:center;

    color:#857b88;

    font-size:9px;

    text-decoration:none;
}

.back:hover{
    color:#d4af37;
}

.message{

    display:none;

    margin-bottom:15px;

    padding:12px;

    border-radius:9px;

    background:
        rgba(212,175,55,.08);

    border:
        1px solid
        rgba(212,175,55,.15);

    color:#ffd76a;

    font-size:9px;

    line-height:1.5;

    text-align:center;
}

.message.error{

    background:
        rgba(255,45,70,.09);

    border-color:
        rgba(255,45,70,.18);

    color:#ff858f;
}

.info{

    margin-top:13px;

    color:#847987;

    text-align:center;

    font-size:9px;

    line-height:1.5;
}

@media(max-width:500px){

    .auth-card{
        padding:28px 22px;
    }

    .logo{
        font-size:27px;
    }

}

</style>

</head>

<body>

<div class="auth-card">

    <div class="logo">

        Steady
        <span class="gold">M</span>
        <span class="red">a</span>
        <span class="purple">z</span>
        <span class="gold">e</span>

    </div>

    <div class="subtitle">
        STUDENT PORTAL
    </div>

    <div class="brand-line"></div>

    <div
        id="message"
        class="message"
    ></div>


    <!-- TABS -->

    <div
        class="tabs"
        id="tabs"
    >

        <button
            id="loginTab"
            class="tab active"
            type="button"
            onclick="showLogin()"
        >
            LOGIN
        </button>

        <button
            id="signupTab"
            class="tab"
            type="button"
            onclick="showSignup()"
        >
            SIGN UP
        </button>

    </div>


    <!-- =========================
         LOGIN
    ========================== -->

    <form
        id="loginForm"
        class="form active"
        onsubmit="loginStudent(event)"
    >

        <label>
            EMAIL
        </label>

        <input
            type="email"
            id="loginEmail"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >

        <label>
            PASSWORD
        </label>

        <input
            type="password"
            id="loginPassword"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >

        <button
            type="submit"
            id="loginButton"
            class="main-button"
        >
            LOGIN
        </button>

        <a
            class="forgot"
            onclick="showForgot()"
        >
            Forgot Password?
        </a>

    </form>


    <!-- =========================
         SIGN UP
    ========================== -->

    <form
        id="signupForm"
        class="form"
        onsubmit="createStudent(event)"
    >

        <label>
            FULL NAME
        </label>

        <input
            type="text"
            id="signupName"
            placeholder="Enter your full name"
            autocomplete="name"
            required
        >

        <label>
            EMAIL
        </label>

        <input
            type="email"
            id="signupEmail"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >

        <label>
            PASSWORD
        </label>

        <input
            type="password"
            id="signupPassword"
            placeholder="Create password"
            minlength="6"
            autocomplete="new-password"
            required
        >

        <button
            type="submit"
            id="signupButton"
            class="main-button"
        >
            CREATE ACCOUNT
        </button>

        <div class="info">
            Your account is secured by Supabase.
        </div>

    </form>


    <!-- =========================
         FORGOT PASSWORD
    ========================== -->

    <form
        id="forgotForm"
        class="form"
        onsubmit="sendReset(event)"
    >

        <label>
            ACCOUNT EMAIL
        </label>

        <input
            type="email"
            id="forgotEmail"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >

        <button
            type="submit"
            id="forgotButton"
            class="main-button"
        >
            SEND RESET LINK
        </button>

        <div class="info">
            Supabase will send the password reset link.
        </div>

        <a
            class="forgot"
            onclick="showLogin()"
        >
            ← Back To Login
        </a>

    </form>


    <!-- =========================
         NEW PASSWORD
    ========================== -->

    <form
        id="newPasswordForm"
        class="form"
        onsubmit="changePassword(event)"
    >

        <label>
            NEW PASSWORD
        </label>

        <input
            type="password"
            id="newPassword"
            placeholder="Create new password"
            minlength="6"
            autocomplete="new-password"
            required
        >

        <label>
            CONFIRM PASSWORD
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm password"
            minlength="6"
            autocomplete="new-password"
            required
        >

        <button
            type="submit"
            id="changePasswordButton"
            class="main-button"
        >
            CHANGE PASSWORD
        </button>

    </form>


    <!-- HOME -->

    <a
        href="index.html"
        class="back"
    >
        ← Back To Homepage
    </a>

</div>


<!-- =========================================
     SUPABASE
========================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================
   SUPABASE CONNECTION
========================================= */

const SUPABASE_URL =
    "https://uxrltzlxdttbjstomhkb.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_bAbA5_9yIPt5IWQ0WwphMg_gdZ6E8-b";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================================
   MESSAGE
========================================= */

function showMessage(
    text,
    isError = false
){

    const box =
        document.getElementById(
            "message"
        );

    box.textContent = text;

    box.style.display = "block";

    box.classList.toggle(
        "error",
        isError
    );
}

function clearMessage(){

    const box =
        document.getElementById(
            "message"
        );

    box.textContent = "";

    box.style.display = "none";

    box.classList.remove(
        "error"
    );
}


/* =========================================
   HIDE ALL FORMS
========================================= */

function hideForms(){

    document
        .querySelectorAll(".form")
        .forEach(
            function(form){

                form.classList.remove(
                    "active"
                );

            }
        );
}


/* =========================================
   LOGIN SCREEN
========================================= */

function showLogin(){

    hideForms();

    document
        .getElementById("loginForm")
        .classList.add("active");

    document
        .getElementById("tabs")
        .style.display = "grid";

    document
        .getElementById("loginTab")
        .classList.add("active");

    document
        .getElementById("signupTab")
        .classList.remove("active");

    clearMessage();
}


/* =========================================
   SIGNUP SCREEN
========================================= */

function showSignup(){

    hideForms();

    document
        .getElementById("signupForm")
        .classList.add("active");

    document
        .getElementById("tabs")
        .style.display = "grid";

    document
        .getElementById("signupTab")
        .classList.add("active");

    document
        .getElementById("loginTab")
        .classList.remove("active");

    clearMessage();
}


/* =========================================
   FORGOT SCREEN
========================================= */

function showForgot(){

    hideForms();

    document
        .getElementById("forgotForm")
        .classList.add("active");

    document
        .getElementById("tabs")
        .style.display = "none";

    clearMessage();
}


/* =========================================
   NEW PASSWORD SCREEN
========================================= */

function showNewPassword(){

    hideForms();

    document
        .getElementById("newPasswordForm")
        .classList.add("active");

    document
        .getElementById("tabs")
        .style.display = "none";

    clearMessage();
}


/* =========================================
   CREATE STUDENT
========================================= */

async function createStudent(event){

    event.preventDefault();

    clearMessage();

    const name =
        document
            .getElementById("signupName")
            .value
            .trim();

    const email =
        document
            .getElementById("signupEmail")
            .value
            .trim()
            .toLowerCase();

    const password =
        document
            .getElementById("signupPassword")
            .value;

    if(
        !name ||
        !email ||
        !password
    ){

        showMessage(
            "Please fill in all fields.",
            true
        );

        return;
    }

    if(password.length < 6){

        showMessage(
            "Password must contain at least 6 characters.",
            true
        );

        return;
    }

    const button =
        document.getElementById(
            "signupButton"
        );

    button.disabled = true;

    button.textContent =
        "CREATING...";

    try{

        const {
            data,
            error
        } =
        await supabaseClient.auth.signUp({

            email:email,

            password:password,

            options:{

                data:{

                    full_name:name,

                    role:"student"

                },

                emailRedirectTo:
                    window.location.origin +
                    window.location.pathname

            }

        });

        if(error){

            throw error;

        }


        /*
         * Supabase Auth handles
         * the account.
         *
         * No localStorage.
         */

        if(!data.session){

            document
                .getElementById(
                    "signupForm"
                )
                .reset();

            showMessage(
                "Account created. Please confirm your email before logging in."
            );

            return;
        }


        /*
         * If email confirmation
         * is disabled.
         */

        await supabaseClient.auth
            .signOut();

        document
            .getElementById(
                "signupForm"
            )
            .reset();

        showLogin();

        showMessage(
            "Account created successfully. You can now login."
        );

    }catch(error){

        showMessage(
            error.message ||
            "Could not create account.",
            true
        );

    }finally{

        button.disabled = false;

        button.textContent =
            "CREATE ACCOUNT";

    }

}


/* =========================================
   LOGIN STUDENT
========================================= */

async function loginStudent(event){

    event.preventDefault();

    clearMessage();

    const email =
        document
            .getElementById("loginEmail")
            .value
            .trim()
            .toLowerCase();

    const password =
        document
            .getElementById("loginPassword")
            .value;

    const button =
        document.getElementById(
            "loginButton"
        );

    button.disabled = true;

    button.textContent =
        "LOGGING IN...";

    try{

        /*
         * IMPORTANT:
         *
         * Login is ONLY handled
         * by Supabase Auth.
         *
         * We DO NOT query:
         *
         * students.full_name
         *
         * students.status
         *
         * or other columns.
         *
         * Therefore the previous
         * "column students.full_name
         * does not exist" error is
         * removed.
         */

        const {
            data,
            error
        } =
        await supabaseClient.auth
            .signInWithPassword({

                email:email,

                password:password

            });

        if(error){

            throw error;

        }

        if(!data.user){

            throw new Error(
                "Account was not found."
            );

        }


        /*
         * LOGIN SUCCESS
         *
         * Go directly to
         * student.html.
         *
         * No localStorage.
         * No students table query.
         */

        window.location.replace(
            "student.html"
        );

    }catch(error){

        showMessage(
            error.message ||
            "Login failed.",
            true
        );

    }finally{

        button.disabled = false;

        button.textContent =
            "LOGIN";

    }

}


/* =========================================
   PASSWORD RESET
========================================= */

async function sendReset(event){

    event.preventDefault();

    clearMessage();

    const email =
        document
            .getElementById("forgotEmail")
            .value
            .trim()
            .toLowerCase();

    const button =
        document.getElementById(
            "forgotButton"
        );

    button.disabled = true;

    button.textContent =
        "SENDING...";

    try{

        const {
            error
        } =
        await supabaseClient.auth
            .resetPasswordForEmail(

                email,

                {

                    redirectTo:
                        window.location.origin +
                        window.location.pathname

                }

            );

        if(error){

            throw error;

        }

        showMessage(
            "Password reset link has been sent to your email."
        );

    }catch(error){

        showMessage(
            error.message ||
            "Could not send reset link.",
            true
        );

    }finally{

        button.disabled = false;

        button.textContent =
            "SEND RESET LINK";

    }

}


/* =========================================
   CHANGE PASSWORD
========================================= */

async function changePassword(event){

    event.preventDefault();

    clearMessage();

    const password =
        document
            .getElementById(
                "newPassword"
            )
            .value;

    const confirm =
        document
            .getElementById(
                "confirmPassword"
            )
            .value;

    if(password.length < 6){

        showMessage(
            "Password must contain at least 6 characters.",
            true
        );

        return;
    }

    if(password !== confirm){

        showMessage(
            "Passwords do not match.",
            true
        );

        return;
    }

    const button =
        document.getElementById(
            "changePasswordButton"
        );

    button.disabled = true;

    button.textContent =
        "UPDATING...";

    try{

        const {
            error
        } =
        await supabaseClient.auth
            .updateUser({

                password:password

            });

        if(error){

            throw error;

        }

        showMessage(
            "Password changed successfully."
        );

        setTimeout(
            async function(){

                await supabaseClient.auth
                    .signOut();

                showLogin();

            },
            1500
        );

    }catch(error){

        showMessage(
            error.message ||
            "Could not change password.",
            true
        );

    }finally{

        button.disabled = false;

        button.textContent =
            "CHANGE PASSWORD";

    }

}


/* =========================================
   AUTH STATE
========================================= */

supabaseClient.auth
.onAuthStateChange(

    function(event){

        if(
            event ===
            "PASSWORD_RECOVERY"
        ){

            showNewPassword();

            showMessage(
                "Create your new SteadyMaze password."
            );

        }

    }

);


/* =========================================
   CHECK RECOVERY URL
========================================= */

function checkRecovery(){

    const hash =
        window.location.hash;

    const search =
        window.location.search;

    if(
        hash.includes(
            "type=recovery"
        ) ||
        search.includes(
            "type=recovery"
        )
    ){

        setTimeout(
            function(){

                showNewPassword();

            },
            500
        );

    }

}


/* =========================================
   START
========================================= */

checkRecovery();

</script>

</body>
</html>
