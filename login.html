<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stezeo – Log in</title>
<style>
:root{color-scheme:dark;--gold:#E6B93C;--yellow:#FFD84A;--orange:#FF8A1F;--green:#10B36A}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;line-height:1.6;
 background:radial-gradient(1200px 600px at 80% -10%,rgba(16,179,106,.32),transparent 60%),radial-gradient(900px 500px at -10% 40%,rgba(230,185,60,.14),transparent 60%),#04120c}
.card{width:min(420px,100%);padding:30px 26px;border-radius:22px;background:rgba(255,255,255,.05);border:1px solid rgba(230,185,60,.28);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 8px 30px rgba(0,20,10,.55),inset 0 1px 0 rgba(255,216,74,.10)}
.logo{display:inline-block;font-weight:800;font-size:1.4rem;color:var(--gold);text-decoration:none;text-shadow:0 0 24px rgba(255,216,74,.5);margin-bottom:14px}
h1{font-size:1.8rem;line-height:1.15;margin-bottom:4px;background:linear-gradient(90deg,#fff,#FFD84A);-webkit-background-clip:text;background-clip:text;color:transparent}
p.sm{font-size:.9rem;margin-bottom:18px}
input{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:12px;padding:13px;margin:0 0 10px;font:inherit}
input[hidden],select[hidden]{display:none}
select{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:12px;padding:13px;margin:0 0 10px;font:inherit}
select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(230,185,60,.22)}
select option{background:#04120c;color:#fff}
input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(230,185,60,.22)}
input::placeholder{color:#d5dcd6}
button.go{width:100%;padding:14px;border-radius:12px;border:1px solid #FFE680;font:inherit;font-weight:800;letter-spacing:.02em;cursor:pointer;color:#1b1204;background:linear-gradient(135deg,#FFF1A8,#FFD84A 42%,#FF9A2E);box-shadow:0 8px 26px rgba(255,154,46,.38),inset 0 1px 0 rgba(255,255,255,.75)}
button.go:disabled{opacity:.5;cursor:default}
a{color:var(--yellow)}
.links{margin-top:14px;font-size:.9rem;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
#msg{min-height:1.3em;font-size:.9rem;margin-top:10px;color:#FFB36B}
</style>
<meta name="stz-page" content="login">
<script>
window.stzGo=function(rel,replace){var u=String(rel||"index.html");location[replace?"replace":"assign"](u);};
</script>
</head>
<body>
<main class="card">
  <a class="logo" href="index.html">Stezeo</a>
  <h1 id="ttl">Log in</h1>
  <p class="sm">Welcome to Stezeo. Students and trainers log in here.</p>
  <input id="nm" placeholder="Full name" autocomplete="name" hidden>
  <select id="rl" aria-label="Account type" hidden><option value="student">I am a Student</option><option value="trainer">I am a Trainer</option></select>
  <input id="em" type="email" placeholder="Email" autocomplete="email">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <button class="go" id="go">Log in</button>
  <p id="msg"></p>
  <div class="links"><a href="#" id="sw">No account? Sign up</a><a href="index.html">Back to home</a></div>
</main>
<script>
const SB_URL='https://uxrltzlxdttbjstomhkb.supabase.co';
const SB_KEY='sb_publishable_bAbA5_9yIPt5IWQ0WwphMg_gdZ6E8-b';
const db=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);let signup=false,busy=false;
const say=(text,color='#FFB36B')=>{$('msg').style.color=color;$('msg').textContent=text};
const friendly=e=>{const m=String(e&&e.message||e||'');
 if(/invalid login credentials/i.test(m))return 'Wrong email or password.';
 if(/email not confirmed/i.test(m))return 'Please confirm your email first (check your inbox), then log in.';
 if(/already registered|already been registered/i.test(m))return 'This email already has an account. Please log in.';
 if(/rate limit|too many/i.test(m))return 'Too many attempts. Please wait a minute and try again.';
 if(/failed to fetch|network/i.test(m))return 'Cannot reach Stezeo servers. Check your internet connection.';
 return m||'Something went wrong. Please try again.'};
const nextPage=(role)=>{const n=new URLSearchParams(location.search).get('next')||'';if(role==='trainer')return 'trainer.html';return /^(user|trainng|compotion)\.html([?#].*)?$/.test(n)?n:'user.html'};
/* One login for everyone: the account's role decides which dashboard opens. */
async function routeUser(session,name='',chosen=''){
  const {data:profile,error:readError}=await db.from('profiles').select('role').eq('id',session.user.id).maybeSingle();
  if(readError)throw new Error('Could not check your account profile: '+readError.message);
  let role=profile?.role;
  if(!role){
    const meta=session.user.user_metadata||{};
    role=(chosen||meta.account_type||meta.role)==='trainer'?'trainer':'student';
    const fullName=name||meta.full_name||session.user.email?.split('@')[0]||(role==='trainer'?'Trainer':'Student');
    const {error}=await db.from('profiles').upsert({id:session.user.id,full_name:fullName,role},{onConflict:'id'});
    if(error)throw new Error('Signed in, but the profile could not be saved: '+error.message+' Check the profiles table and Supabase RLS policies.');
  }
  location.replace(nextPage(role));
}
function mode(v){signup=v;$('ttl').textContent=v?'Create your account':'Log in';$('go').textContent=v?'Create account':'Log in';$('nm').hidden=!v;$('rl').hidden=!v;$('nm').required=v;$('pw').autocomplete=v?'new-password':'current-password';$('sw').textContent=v?'Have an account? Log in':'No account? Sign up';say('');}
$('sw').onclick=e=>{e.preventDefault();mode(!signup)};
$('go').onclick=async()=>{
 if(busy)return;const email=$('em').value.trim(),password=$('pw').value,name=$('nm').value.trim();
 if(!email||!password||signup&&!name){say(signup?'Enter your full name, email and password.':'Enter your email and password.');return}
 if(password.length<6){say('Password must contain at least 6 characters.');return}
 busy=true;$('go').disabled=true;say('Connecting securely to Stezeo…','#7be3a6');
 try{
  if(signup){
   const {data,error}=await db.auth.signUp({email,password,options:{data:{full_name:name,role:$('rl').value,account_type:$('rl').value},emailRedirectTo:location.origin+location.pathname}});
   if(error)throw error;
   if(data.user&&Array.isArray(data.user.identities)&&data.user.identities.length===0)throw new Error('This email already has an account. Please log in.');
   if(!data.session){say('Your account has been created. Check your email, confirm your address, then log in.','#7be3a6');return}
   await routeUser(data.session,name,$('rl').value);return;
  }
  const {data,error}=await db.auth.signInWithPassword({email,password});if(error)throw error;
  if(!data||!data.session)throw new Error('Login failed. Please try again.');
  await routeUser(data.session);
 }catch(e){say(friendly(e));}
 finally{busy=false;$('go').disabled=false;}
};
['em','pw','nm'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()}));
(async()=>{
 const params=new URLSearchParams(location.search);if(params.get('error')==='student-only')say('Please sign in with a student account.');if(params.get('error')==='trainer-only')say('Please sign in with a trainer account.');
 if(location.hash==='#signup'){mode(true);return}
 const {data:{session},error}=await db.auth.getSession();
 if(error){say(error.message);return}
 if(session){try{await routeUser(session)}catch(e){say(e.message)}}
})();
</script>
</body>
</html>
