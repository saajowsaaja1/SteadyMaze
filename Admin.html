<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stezeo – Admin login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--pu:#8b5cf6;--cy:#22d3ee}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px;font:15px/1.6 Inter,system-ui,sans-serif;color:#e9ebff;background:radial-gradient(900px 500px at 70% -10%,rgba(139,92,246,.35),transparent 60%),radial-gradient(700px 400px at 0% 100%,rgba(34,211,238,.15),transparent 60%),#080a1a}
.card{width:min(400px,100%);padding:30px 26px;border-radius:20px;background:#12142b;border:1px solid rgba(139,92,246,.4);box-shadow:0 10px 40px rgba(0,0,0,.5)}
.lg{font-weight:800;font-size:1.3rem;margin-bottom:4px}.lg b{color:var(--pu)}
h1{font-size:1.5rem;margin-bottom:4px}
p.sm{color:#9aa0c7;font-size:.9rem;margin-bottom:16px}
input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:12px;padding:13px;margin-bottom:10px;font:inherit}
input:focus{outline:none;border-color:var(--pu);box-shadow:0 0 0 3px rgba(139,92,246,.25)}
button{width:100%;padding:14px;border:0;border-radius:12px;font:inherit;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--pu),#6366f1)}
button:disabled{opacity:.5}
#msg{min-height:1.3em;margin-top:10px;font-size:.9rem;color:#f87171}#msg.ok{color:#34d399}
small{display:block;color:#9aa0c7;font-size:.8rem;margin:-4px 0 10px}
a{color:var(--cy);font-size:.9rem;display:inline-block;margin-top:14px}
</style>
</head>
<body>
<main class="card">
  <div class="lg">Ste<b>zeo</b> Admin</div>
  <h1>Admin login</h1>
  <p class="sm">For administrators only. Student and trainer accounts cannot enter here.</p>
  <input id="em" type="email" placeholder="Email" autocomplete="email">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <input id="ac" type="password" placeholder="Secret admin code (first time only)" autocomplete="off">
  <small>If your account is already an admin, leave the code empty.</small>
  <button id="go">Log in</button>
  <p id="msg"></p>
  <a href="index.html">← Website</a>
</main>
<script>
const db=window.supabase.createClient('https://uxrltzlxdttbjstomhkb.supabase.co','sb_publishable_bAbA5_9yIPt5IWQ0WwphMg_gdZ6E8-b',{auth:{persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);let busy=false;
const say=(t,ok)=>{$('msg').textContent=t;$('msg').className=ok?'ok':''};
const friendly=e=>{const m=String(e&&e.message||e||'');
 if(/sending confirmation email|rate limit/i.test(m))return 'Supabase could not send the confirmation email. In Supabase go to Authentication > Sign In / Providers > Email and turn OFF “Confirm email”, or create the user in Authentication > Users with “Auto Confirm User” ticked.';
 if(/email not confirmed/i.test(m))return 'Please confirm your email first (open the email Supabase sent you), then log in again.';
 if(/504|gateway|timeout|timed out/i.test(m))return 'Supabase did not answer in time. Check that the project is not paused, wait a minute and try again.';
 if(/failed to fetch|network/i.test(m))return 'Cannot reach Supabase. Check your internet connection.';
 return m||'Something went wrong. Please try again.'};
/* Only profiles.role = admin can enter. */
async function enter(session,code){
 let {data:p,error}=await db.from('profiles').select('role').eq('id',session.user.id).maybeSingle();
 if(error)throw new Error('Could not check your account: '+error.message);
 if(!p&&code){
  const u=await db.from('profiles').upsert({id:session.user.id,full_name:session.user.email.split('@')[0],role:'student'},{onConflict:'id'});
  if(u.error)throw new Error(u.error.message);p={role:'student'}}
 if(p&&p.role!=='admin'&&code){
  const r=await db.rpc('stz_claim_admin',{p_code:code});
  if(r.error)throw new Error(/stz_claim_admin|function/i.test(r.error.message)?'Admin setup is missing. Run admin_setup.sql in Supabase > SQL Editor first.':r.error.message);
  if(!r.data)throw new Error('Wrong admin code.');
  p={role:'admin'}}
 if(!p||p.role!=='admin'){
  await db.auth.signOut();
  throw new Error(code?'This account could not become admin.':'This account is not an admin yet. Enter your secret admin code once, then log in.')}
 location.replace('Admin.html');
}
$('go').onclick=async()=>{
 if(busy)return;
 const email=$('em').value.trim(),password=$('pw').value,code=$('ac').value.trim();
 if(!email||!password)return say('Enter your email and password.');
 busy=true;$('go').disabled=true;say('');
 try{
  let {data,error}=await db.auth.signInWithPassword({email,password});
  if(error){
   if(!/invalid login/i.test(error.message))throw error;
   if(!code)throw new Error('Wrong email or password.');
   /* new email + admin code: create the account first */
   const s=await db.auth.signUp({email,password,options:{data:{full_name:email.split('@')[0],role:'student',account_type:'student'}}});
   if(s.error)throw s.error;
   if(s.data.user&&Array.isArray(s.data.user.identities)&&s.data.user.identities.length===0)throw new Error('Wrong password for this email.');
   if(!s.data.session){say('Account created. Open the confirmation email, then log in again with the same admin code.',true);return}
   data=s.data}
  await enter(data.session,code);
 }catch(e){say(friendly(e))}
 finally{busy=false;$('go').disabled=false}
};
['em','pw','ac'].forEach(i=>$(i).addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()}));
(async()=>{const {data:{session}}=await db.auth.getSession();
 if(session){const {data:p}=await db.from('profiles').select('role').eq('id',session.user.id).maybeSingle();
  if(p&&p.role==='admin')location.replace('Admin.html')}})();
</script>
</body>
</html>
