<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stezeo – Admin login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--pu:#8b5cf6;--cy:#22d3ee}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px;font:15px/1.6 Inter,system-ui,sans-serif;color:#e9ebff;background:radial-gradient(900px 500px at 70% -10%,rgba(139,92,246,.35),transparent 60%),radial-gradient(700px 400px at 0% 100%,rgba(34,211,238,.15),transparent 60%),#080a1a}
.card{width:min(400px,100%);padding:30px 26px;border-radius:20px;background:#12142b;border:1px solid rgba(139,92,246,.4);box-shadow:0 10px 40px rgba(0,0,0,.5)}
.lg{font-weight:800;font-size:1.3rem;margin-bottom:4px}.lg b{color:var(--pu)}
h1{font-size:1.5rem;margin-bottom:4px}
p.sm{color:#9aa0c7;font-size:.9rem;margin-bottom:16px}
input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:12px;padding:13px;margin-bottom:10px;font:inherit}
input[hidden]{display:none}
input:focus{outline:none;border-color:var(--pu);box-shadow:0 0 0 3px rgba(139,92,246,.25)}
button{width:100%;padding:14px;border:0;border-radius:12px;font:inherit;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--pu),#6366f1)}
button:disabled{opacity:.5}
#msg{min-height:1.3em;margin-top:10px;font-size:.9rem;color:#f87171}#msg.ok{color:#34d399}
.l{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
a{color:var(--cy);font-size:.9rem;display:inline-block;margin-top:14px}
</style>
</head>
<body>
<main class="card">
  <div class="lg">Ste<b>zeo</b> Admin</div>
  <h1 id="ttl">Admin login</h1>
  <p class="sm" id="sub">For administrators only. Student and trainer emails cannot enter here.</p>
  <input id="nm" placeholder="Full name" autocomplete="name" hidden>
  <input id="em" type="email" placeholder="Admin email" autocomplete="email">
  <input id="pw" type="password" placeholder="Password (min 6)" autocomplete="current-password">
  <input id="ac" type="password" placeholder="Secret admin code" autocomplete="off" hidden>
  <button id="go">Log in</button>
  <p id="msg"></p>
  <div class="l"><a href="#" id="sw">New admin? Sign up</a><a href="#" id="adm">Have an admin code?</a><a href="index.html">← Website</a></div>
</main>
<script>
const db=window.supabase.createClient('https://uxrltzlxdttbjstomhkb.supabase.co','sb_publishable_bAbA5_9yIPt5IWQ0WwphMg_gdZ6E8-b',{auth:{persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);let busy=false,signup=false;
const friendly=e=>{const m=String(e&&e.message||e||'');
 if(/504|gateway|timeout|timed out/i.test(m))return 'Supabase did not answer in time (504). In Supabase turn OFF Authentication > Providers > Email > Confirm email (and remove custom SMTP), make sure the project is not paused, wait a minute and try again.';
 if(/email.*rate limit|over_email_send_rate_limit/i.test(m))return 'Too many confirmation emails. In Supabase turn OFF Confirm email while testing, then try again.';
 if(/database error saving new user/i.test(m))return 'Supabase could not save the new user. Run the latest schema.sql in Supabase > SQL Editor.';
 if(/signups? not allowed|signups are disabled/i.test(m))return 'New sign ups are OFF in Supabase (Authentication > Sign In / Providers).';
 if(/failed to fetch|network/i.test(m))return 'Cannot reach Supabase. Check your internet connection.';
 return m||'Something went wrong. Please try again.'};
const say=(t,ok)=>{$('msg').textContent=t;$('msg').className=ok?'ok':''};
function mode(v){signup=v;$('nm').hidden=!v;$('ac').hidden=!v;$('adm').style.display=v?'none':'';$('ttl').textContent=v?'Admin sign up':'Admin login';
 $('sub').textContent=v?'Needs the secret admin code. Works only with a new email.':'For administrators only. Student and trainer emails cannot enter here.';
 $('go').textContent=v?'Create admin account':'Log in';$('sw').textContent=v?'Have an account? Log in':'New admin? Sign up';$('pw').autocomplete=v?'new-password':'current-password';say('')}
$('sw').onclick=e=>{e.preventDefault();mode(!signup);if(!signup)$('ac').hidden=true};
$('adm').onclick=e=>{e.preventDefault();$('ac').hidden=!$('ac').hidden};
/* Only role = admin gets in. Everyone else is signed out. */
async function check(session,code,name){
 let {data:p,error}=await db.from('profiles').select('role').eq('id',session.user.id).maybeSingle();
 if(error)throw new Error('Could not check your account: '+error.message);
 if(!p&&code){const u=await db.from('profiles').upsert({id:session.user.id,full_name:name||session.user.email.split('@')[0],role:'student'},{onConflict:'id'});if(u.error)throw new Error(u.error.message);p={role:'student'}}
 if(p&&p.role!=='admin'&&code){
  const r=await db.rpc('stz_claim_admin',{p_code:code});
  if(r.error){await db.auth.signOut();throw new Error(/stz_claim_admin|function/i.test(r.error.message)?'Admin setup is missing. Run admin_setup.sql in Supabase > SQL Editor first.':r.error.message)}
  if(!r.data){await db.auth.signOut();throw new Error('Wrong admin code.')}
  p={role:'admin'};
 }
 if(!p||p.role!=='admin'){await db.auth.signOut();throw new Error('This account is not an administrator. Student and trainer accounts cannot enter the admin dashboard.')}
 location.replace('Admin.html');
}
$('go').onclick=async()=>{
 if(busy)return;const email=$('em').value.trim(),password=$('pw').value,name=$('nm').value.trim(),code=$('ac').hidden?'':$('ac').value.trim();
 if(!email||!password)return say('Enter your email and password.');
 if(password.length<6)return say('Password must have at least 6 characters.');
 if(signup&&(!name||!code))return say('Enter your name and the secret admin code.');
 busy=true;$('go').disabled=true;say('');
 try{
  let session;
  if(signup){
   const {data,error}=await db.auth.signUp({email,password,options:{data:{full_name:name,role:'student',account_type:'student'}}});
   if(error)throw new Error(/already/i.test(error.message)?'This email already has an account, so it cannot become admin.':error.message);
   if(data.user&&Array.isArray(data.user.identities)&&data.user.identities.length===0)throw new Error('This email already has an account, so it cannot become admin.');
   if(!data.session){say('Account created. Open the confirmation email sent to '+email+', then come back, press "Log in" and enter your admin code.',true);mode(false);$('ac').hidden=false;return}
   session=data.session;
  }else{
   const {data,error}=await db.auth.signInWithPassword({email,password});
   if(error)throw new Error(/invalid login/i.test(error.message)?'Wrong email or password.':error.message);
   session=data.session;
  }
  await check(session,code,name);
 }catch(e){say(friendly(e))}
 finally{busy=false;$('go').disabled=false}
};
['em','pw','nm','ac'].forEach(i=>$(i).addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()}));
(async()=>{const {data:{session}}=await db.auth.getSession();if(session){try{await check(session,'','')}catch(e){say(friendly(e))}}})();
</script>
</body>
</html>
