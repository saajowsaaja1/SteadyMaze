/* =====================================================
   USER-SPECIFIC LOCAL STORAGE
   IMPORTANT:
   Nothing here is shared between accounts.
===================================================== */

function userStorageKey(name){

    if(!currentUser){
        return null;
    }

    return "steadymaze_" +
           name +
           "_" +
           currentUser.id;
}


function getUserStorage(name, fallback){

    const key =
        userStorageKey(name);

    if(!key){
        return fallback;
    }

    try{

        const value =
            localStorage.getItem(key);

        if(value === null){
            return fallback;
        }

        return JSON.parse(value);

    }catch(error){

        console.error(
            "Local storage read error:",
            error
        );

        return fallback;

    }

}


function setUserStorage(name, value){

    const key =
        userStorageKey(name);

    if(!key){
        return;
    }

    try{

        localStorage.setItem(
            key,
            JSON.stringify(value)
        );

    }catch(error){

        console.error(
            "Local storage save error:",
            error
        );

    }

}

/* =====================================================
   PREVIEW PHOTO
===================================================== */

function previewProfilePhoto(event){

    const file =
        event.target.files[0];

    if(!file){
        return;
    }


    const reader =
        new FileReader();


    reader.onload =
        function(e){

            const image =
                document.getElementById(
                    "profileModalImage"
                );

            const letter =
                document.getElementById(
                    "profileModalLetter"
                );


            if(image){

                image.src =
                    e.target.result;

                image.style.display =
                    "block";

            }


            if(letter){

                letter.style.display =
                    "none";

            }

        };


    reader.readAsDataURL(file);

}


/* =====================================================
   SAVE PROFILE TO SUPABASE
===================================================== */

async function saveProfile(){

    if(!currentUser){

        alert(
            "No active student account."
        );

        return;

    }


    const nameInput =
        document.getElementById(
            "profileNameInput"
        );

    const photoInput =
        document.getElementById(
            "profilePhotoInput"
        );


    const name =
        nameInput
        ? nameInput.value.trim()
        : "";


    if(!name){

        alert(
            "Please enter your name."
        );

        return;

    }


    /*
       We intentionally DO NOT put profile
       information into localStorage.
    */

    let photoUrl =
        studentProfile.photo || null;


    /*
       If the user selected a new local image,
       show it in the current page.

       Permanent upload requires a Supabase
       Storage bucket. We do not pretend that
       a browser data URL is a real database
       profile photo.
    */

    if(
        photoInput &&
        photoInput.files &&
        photoInput.files.length
    ){

        const file =
            photoInput.files[0];


        const reader =
            new FileReader();


        reader.onload =
            function(e){

                photoUrl =
                    e.target.result;

                updateProfileAfterNameSave(
                    name,
                    photoUrl
                );

            };


        reader.readAsDataURL(file);

        return;

    }


    await updateProfileAfterNameSave(
        name,
        photoUrl
    );

}


/* =====================================================
   UPDATE PROFILE DATABASE
===================================================== */

async function updateProfileAfterNameSave(
    name,
    photoUrl
){

    if(!currentUser){
        return;
    }


    const updateData = {

        full_name:name,

        updated_at:
            new Date().toISOString()

    };


    /*
       Only save profile_photo if it already
       contains a URL.

       Local file data is kept only for the
       current browser preview unless Storage
       is connected.
    */

    if(
        photoUrl &&
        (
            photoUrl.startsWith("http://") ||
            photoUrl.startsWith("https://")
        )
    ){

        updateData.profile_photo =
            photoUrl;

    }


    const {
        data,
        error
    } =
    await supabaseClient
        .from("profiles")
        .update(updateData)
        .eq(
            "id",
            currentUser.id
        )
        .select()
        .single();


    if(error){

        console.error(
            "Profile update error:",
            error.message
        );

        alert(
            "Profile update failed:\n\n" +
            error.message
        );

        return;

    }


    currentProfile =
        data;


    /*
       Temporary browser preview for the
       current page only.
    */

    studentProfile.name =
        name;


    if(
        photoUrl &&
        photoUrl.startsWith("data:")
    ){

        studentProfile.photo =
            photoUrl;

    }else if(
        data.profile_photo
    ){

        studentProfile.photo =
            data.profile_photo;

    }


    updateProfileAvatar();

    closeModal();


    alert(
        "Profile updated successfully."
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}

/* =====================================================
   AUTH CHANGE LISTENER
===================================================== */

supabaseClient

    .onAuthStateChange(
        async function(
            event,
            session
        ){

            if(
                event === "SIGNED_OUT" ||
                !session ||
                !session.user
            ){

                currentUser = null;

                currentProfile = null;

                currentStudent = null;

                return;

            }


            /*
               Do not use localStorage to decide
               which account is logged in.
            */

            currentUser =

            await initializeStudentAccount(

            );

        }
    );


/* =====================================================
   INITIALIZE CURRENT STUDENT
===================================================== */

async function initializeStudentAccount(
    user
){

    if(!user){

        window.location.href =
            "login.html";

        return;

    }


    currentUser =
        user;


    console.log(
        "CURRENT AUTH USER:",
        currentUser.id,
        currentUser.email
    );


    /*
       STEP 1
       Load profile ONLY by current auth ID.
    */

    currentProfile =
        await loadCurrentProfile(
            currentUser.id
        );


    /*
       If profile does not exist,
       create it for THIS auth user only.
    */

    if(!currentProfile){

        currentProfile =
            await createMissingProfile(
                currentUser
            );

    }


    /*
       STEP 2
       Load student ONLY by current auth ID.
    */

    currentStudent =
        await loadCurrentStudent(
            currentUser.id
        );


    /*
       If student record does not exist,
       create it for THIS auth user only.
    */

    if(!currentStudent){

        currentStudent =
            await createMissingStudent(
                currentUser.id
            );

    }


    /*
       STEP 3
       If either database record still cannot
       be loaded, do not show old frontend data.
    */

    if(!currentProfile){

        alert(
            "Your student profile could not be loaded.\n\n" +
            "Please check the profiles RLS policies."
        );

        return;

    }


    if(!currentStudent){

        alert(
            "Your student record could not be loaded.\n\n" +
            "Please check the students RLS policies."
        );

        return;

    }


    /*
       STEP 4
       Load frontend-only data using THIS user's UUID.
    */

    loadUserLocalData();


    /*
       STEP 5
       Apply Supabase data to dashboard.
    */

    applyProfileToDashboard();

    applyStudentToDashboard();


    /*
       STEP 6
       Render account-specific lessons.
    */

    renderMyLessons();


    console.log(
        "SteadyMaze student loaded successfully:",
        {
            authId:currentUser.id,
            profileId:currentProfile.id,
            studentId:currentStudent.id,
            email:currentProfile.email
        }
    );

}

/* =====================================================
   COURSE LEVELS
===================================================== */

function renderCourseLevels(){

    if(!selectedSkill){
        return;
    }


    const levels =
        document.querySelector(
            ".levels"
        );


    const maxLevel =
        selectedSkill.group === "HIGH"
        ? 2
        : 3;


    let html = "";


    for(
        let level = 1;
        level <= maxLevel;
        level++
    ){

        const price =
            coursePrices[
                selectedSkill.group
            ][level];


        const bought =
            hasPurchasedCourse(
                selectedSkill.name,
                level
            );


        html += `

            <button
                class="level-btn"
                type="button"
                onclick="openLevel(${level})"
            >

                LEVEL ${level}

                <br>

                ${
                    bought
                    ? "PURCHASED"
                    : "$" + price
                }

            </button>

        `;

    }


    levels.innerHTML =
        html;

}


/* =====================================================
   OPEN LEVEL
===================================================== */

function openLevel(level){

    if(!selectedSkill){
        return;
    }


    const price =
        coursePrices[
            selectedSkill.group
        ][level];


    const bought =
        hasPurchasedCourse(
            selectedSkill.name,
            level
        );


    document.getElementById(
        "modalTitle"
    ).textContent =
        selectedSkill.name +
        " — LEVEL " +
        level;


    document.getElementById(
        "modalText"
    ).innerHTML = `

        <div style="
            padding:15px;
            border-radius:13px;
            background:#09151e;
            border:1px solid rgba(255,255,255,.07);
        ">

            <strong>
                ${escapeHtml(
                    selectedSkill.name
                )}
            </strong>

            <br><br>

            <span style="color:#00e676;">
                LEVEL ${level}
            </span>

            <br><br>

            <span style="color:#718492;">
                Course Price:
            </span>

            <strong style="color:#00e676;">
                $${price}
            </strong>

        </div>

        <br>

        ${
            bought
            ? "This level is already available in My Lessons."
            : "Choose BUY to continue."
        }

    `;


    if(bought){

        const index =
            purchasedLessons.findIndex(
                item =>
                    item.name ===
                    selectedSkill.name &&
                    Number(item.level) ===
                    Number(level)
            );


        document.querySelector(
            ".levels"
        ).innerHTML = `

            <button
                class="level-btn"
                type="button"
                onclick="openPurchasedLesson(${index})"
            >
                OPEN LESSON
            </button>

            <button
                class="level-btn"
                type="button"
                onclick="renderCourseLevels()"
            >
                BACK
            </button>

        `;


        return;

    }


    document.querySelector(
        ".levels"
    ).innerHTML = `

        <button
            class="level-btn"
            type="button"
            onclick="openCoursePayment(
                '${escapeJs(
                    selectedSkill.name
                )}',
                '${selectedSkill.group}',
                ${level},
                ${price},
                '${selectedSkill.image}'
            )"
        >

            BUY LEVEL ${level}

            <br>

            $${price}

        </button>

        <button
            class="level-btn"
            type="button"
            onclick="renderCourseLevels()"
        >

            BACK TO LEVELS

        </button>

    `;

}


/* =====================================================
   ESCAPE JS
===================================================== */

function escapeJs(value){

    return String(value)
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        );

}

/* =====================================================
   PAY COURSE
===================================================== */

function payForCourse(
    name,
    group,
    level,
    price,
    image
){

    if(!currentUser){

        alert(
            "Please login first."
        );

        return;

    }


    if(!selectedPaymentMethod){

        alert(
            "Please select a payment method."
        );

        return;

    }


    const accountInput =
        document.getElementById(
            "paymentAccount"
        );


    const account =
        accountInput
        ? accountInput.value.trim()
        : "";


    if(
        selectedPaymentMethod === "PayPal" &&
        !account
    ){

        alert(
            "Please enter your PayPal account."
        );

        return;

    }


    if(
        hasPurchasedCourse(
            name,
            level
        )
    ){

        alert(
            "This course is already in My Lessons."
        );

        return;

    }


    const purchase = {

        name:name,

        group:group,

        level:level,

        price:price,

        image:image,

        paymentMethod:
            selectedPaymentMethod,

        status:
            "PAYMENT_PENDING",

        purchasedAt:
            new Date().toISOString()

    };


    if(
        savePurchase(
            purchase
        )
    ){

        savedPayment = {

            method:
                selectedPaymentMethod,

            account:
                selectedPaymentMethod === "PayPal"
                ? account
                : "SECURE_CARD_PAYMENT",

            status:
                "ADDED"

        };


        setUserStorage(
            "payment",
            savedPayment
        );


        renderMyLessons();

        closeModal();


        setTimeout(
            function(){

                scrollToId(
                    "myLessons"
                );

            },
            150
        );


        alert(
            "Payment form submitted.\n\n" +
            "The real payment provider/backend " +
            "must confirm the transaction."
        );

    }

}

function submitProject(){

    if(!currentUser){

        alert(
            "Please login first."
        );

        return;

    }


    const video =
        document.getElementById(
            "projectVideo"
        );


    const title =
        document.getElementById(
            "projectTitle"
        );


    if(
        !video ||
        !video.files.length
    ){

        alert(
            "Please choose your project video."
        );

        return;

    }


    if(
        !title ||
        !title.value.trim()
    ){

        alert(
            "Please enter your project title."
        );

        return;

    }


    alert(
        "Frontend upload form is ready.\n\n" +
        "The real upload will use the current " +
        "Supabase student ID:\n\n" +
        currentUser.id
    );

}

function createLeaderboard(

){

        return;
    }


    let html = "";


    html += `

        <div
            class="row"
            style="
                cursor:default;
                background:rgba(255,255,255,.025);
            "
        >

            <div class="column-title">
                RANK
            </div>

            <div class="column-title">
                STUDENT
            </div>

            <div class="column-title">
                POINTS
            </div>

            <div class="column-title">
                PROJECT/COURSES
            </div>

            <div class="column-title">
                LEVEL
            </div>

            <div class="column-title">
                STATUS
            </div>

        </div>

    `;


    for(
        let i = 1;
        i <= 300;
        i++
    ){

        const number =
            String(i).padStart(
                3,
                "0"

        html += `

                    00
                </div>

                <div class="level">
                    00
                </div>

                <div class="level">
                    —
                </div>

            </div>

        `;

    }


    container.innerHTML =

}

);


/* =====================================================
   COMPETITION TIMER
   NOTE:
   This remains frontend schedule logic.
===================================================== */

let competitionStart =
    localStorage.getItem(
        "steadymazeCompetitionStart"
    );


if(!competitionStart){

    competitionStart =
        Date.now();

    localStorage.setItem(
        "steadymazeCompetitionStart",
        competitionStart
    );

}


competitionStart =
    Number(
        competitionStart
    );


const learningDuration =
    7 *
    24 *
    60 *
    60 *
    1000;


const uploadDuration =
    24 *
    60 *
    60 *
    1000;


function updateCompetition(){

    const now =
        Date.now();


    const uploadStart =
        competitionStart +
        learningDuration;


    const uploadEnd =
        uploadStart +
        uploadDuration;


    const title =
        document.getElementById(
            "stageTitle"
        );


    const text =
        document.getElementById(
            "stageText"
        );


    const pill =
        document.getElementById(
            "statusPill"
        );


    const uploadStatus =
        document.getElementById(
            "uploadStatus"
        );


    const uploadText =
        document.getElementById(
            "uploadText"
        );


    const uploadButton =
        document.getElementById(
            "uploadBtn"
        );


    resetSteps();


    if(
        now < uploadStart
    ){

        title.textContent =
            "LEARNING PERIOD";


        text.textContent =
            "Students are learning before project submission.";


        pill.textContent =
            "LEARNING";


        uploadStatus.textContent =
            "CLOSED";


        uploadText.textContent =
            "Project upload will open when the submission window begins.";


        uploadButton.classList.add(
            "disabled"
        );


        setActiveStep(1);


        updateTimer(
            uploadStart - now
        );


        return;

    }


    if(
        now >= uploadStart &&
        now < uploadEnd
    ){

        title.textContent =
            "PROJECT UPLOAD";


        text.textContent =
            "The project submission window is currently open.";


        pill.textContent =
            "UPLOAD OPEN";


        uploadStatus.textContent =
            "OPEN";


        uploadText.textContent =
            "Submit your project before the submission window closes.";


        uploadButton.classList.remove(
            "disabled"
        );


        setActiveStep(2);


        updateTimer(
            uploadEnd - now
        );


        return;

    }


    title.textContent =
        "REVIEW PERIOD";


    text.textContent =
        "Project submission is closed. Submitted projects move to review.";


    pill.textContent =
        "REVIEW";


    uploadStatus.textContent =
        "CLOSED";


    uploadText.textContent =
        "Submission is closed. Projects are now being reviewed.";


    uploadButton.classList.add(
        "disabled"
    );


    setActiveStep(3);


    updateTimer(0);

}


function resetSteps(){

    for(
        let i = 1;
        i <= 4;
        i++
    ){

        const step =
            document.getElementById(
                "step" + i
            );


        if(step){

            step.classList.remove(
                "active"
            );

        }

    }

}


function setActiveStep(number){

    const step =
        document.getElementById(
            "step" + number
        );


    if(step){

        step.classList.add(
            "active"
        );

    }

}


function updateTimer(ms){

    const days =
        Math.floor(
            ms /
            (
                1000 *
                60 *
                60 *
                24
            )
        );


    const hours =
        Math.floor(
            (
                ms %
                (
                    1000 *
                    60 *
                    60 *
                    24
                )
            )
            /
            (
                1000 *
                60 *
                60
            )
        );


    const minutes =
        Math.floor(
            (
                ms %
                (
                    1000 *
                    60 *
                    60
                )
            )
            /
            (
                1000 *
                60
            )
        );


    const seconds =
        Math.floor(
            (
                ms %
                (
                    1000 *
                    60
                )
            )
            /
            1000
        );


    document.getElementById(
        "days"
    ).textContent =
        String(days).padStart(
            2,
            "0"
        );


    document.getElementById(
        "hours"
    ).textContent =
        String(hours).padStart(
            2,
            "0"
        );


    document.getElementById(
        "minutes"
    ).textContent =
        String(minutes).padStart(
            2,
            "0"
        );


    document.getElementById(
        "seconds"
    ).textContent =
        String(seconds).padStart(
            2,
            "0"
        );

}


/* =====================================================
   NAVIGATION
===================================================== */

function scrollToId(id){

    const target =
        document.getElementById(
            id
        );


    if(!target){
        return;
    }


    target.scrollIntoView({
        behavior:"smooth"
    });

}


/* =====================================================
   MODAL
===================================================== */

document.getElementById(
    "modal"
)
.addEventListener(
    "click",
    function(event){

        if(
            event.target === this
        ){

            closeModal();

        }

    }
);


function closeModal(){

    document.getElementById(
        "modal"
    )
    .classList.remove(
        "show"
    );

}


/* =====================================================
   INITIALIZATION
===================================================== */

async function startStudentDashboard(){

    /*
       IMPORTANT:
       We do NOT call localStorage for profile.
       First we get the real Supabase user.
    */

    const user =
        await getCurrentUser();


    if(!user){

        window.location.href =
            "login.html";

        return;

    }


    await initializeStudentAccount(
        user
    );


    updateCompetition();

}


startStudentDashboard();


/* =====================================================
   TIMER LOOP
===================================================== */

setInterval(
    updateCompetition,
    1000
);

</script>
