<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STEADYMAZE | Student Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<style>
:root{--bg:#020202;--p:#17002d;--v:#240048;--r:#8b0000;--t:#fff;--mut:rgba(255,255,255,.62);--line:rgba(255,255,255,.1);--glass:rgba(255,255,255,.05)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:15px/1.5 "Segoe UI",system-ui,sans-serif;color:var(--t);background:radial-gradient(900px 500px at 85% -10%,var(--v),transparent),radial-gradient(700px 400px at -10% 110%,rgba(139,0,0,.35),transparent),var(--bg);background-attachment:fixed}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:.01em}
button,input,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(14px)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--glass);cursor:pointer;transition:.2s}
.btn:hover{border-color:var(--r)}
.btn.pri{background:linear-gradient(135deg,var(--r),#4a0066);border-color:transparent;box-shadow:0 0 24px rgba(139,0,0,.45)}
.btn:disabled{opacity:.5;cursor:wait}
.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #c33;outline-offset:2px}
input,textarea,select{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.4)}
select option{background:#17002d}
.tbl{overflow-x:auto;padding:4px}.tbl table{width:100%;min-width:620px;border-collapse:collapse}.tbl th{text-align:left;color:var(--mut);font-size:12px;font-weight:500;padding:10px}.tbl td{padding:10px;border-top:1px solid var(--line)}
.badge{background:var(--r);border-radius:99px;padding:0 7px;font-size:11px;margin-left:auto}.pend{color:#f5c26b}.pub{color:#8ff0b0}
.bub{max-width:85%;padding:10px 14px;border-radius:14px;margin-bottom:8px;white-space:pre-wrap;overflow-wrap:anywhere}.bub.u{margin-left:auto;background:linear-gradient(135deg,var(--r),#4a0066)}.bub.a{background:var(--glass);border:1px solid var(--line)}
label{display:block;margin:12px 0 5px;color:var(--mut);font-size:13px}
.brand{font-family:Georgia,serif;font-size:20px;letter-spacing:.28em}
.warn{background:#4a0000;padding:10px 16px;text-align:center}
/* auth */
#auth{min-height:100%;display:grid;place-items:center;padding:20px}
.card{width:100%;max-width:420px;padding:28px}
.tabs{display:flex;gap:6px;margin:18px 0 4px}
.tabs button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:none;cursor:pointer}
.tabs button.on{background:var(--v);border-color:var(--r)}
.msg{margin-top:12px;font-size:13px;min-height:18px}
.err{color:#ff8a8a}.ok{color:#8ff0b0}
/* app */
#app{display:grid;grid-template-columns:230px 1fr;min-height:100%}
aside{padding:22px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
aside .brand{padding:0 10px 18px;font-size:16px}
.nav{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;background:none;border:0;cursor:pointer;color:var(--mut);text-align:left;width:100%}
.nav:hover{color:#fff;background:var(--glass)}
.nav.on{color:#fff;background:linear-gradient(90deg,rgba(139,0,0,.5),transparent)}
.nav.out{margin-top:auto}
main{padding:28px;min-width:0}
main>h2{font-size:28px;margin-bottom:4px}
.sub{color:var(--mut);margin-bottom:22px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.stat{padding:18px}
.stat i{color:#ff5c5c}
.stat b{display:block;font-size:30px;font-family:Georgia,serif;margin-top:8px}
.stat span{color:var(--mut);font-size:13px}
.tv{overflow:hidden;display:flex;flex-direction:column}
.thumb{aspect-ratio:16/9;background:var(--v) center/cover;position:relative}
.thumb i{position:absolute;inset:0;margin:auto;width:44px;height:44px;padding:11px;border-radius:50%;background:rgba(0,0,0,.6)}
.tv .in{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.who{display:flex;align-items:center;gap:10px}
.av{width:38px;height:38px;border-radius:50%;background:var(--v) center/cover;border:1px solid var(--line);flex:none}
.av.big{width:84px;height:84px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:12px;padding:3px 9px;border-radius:99px;background:rgba(139,0,0,.3)}
.desc{color:var(--mut);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.row{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.state{padding:40px 20px;text-align:center;color:var(--mut)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--r);border-radius:50%;margin:0 auto 10px;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:grid;place-items:center;padding:16px;z-index:50}
#modal .box{width:100%;max-width:820px;max-height:92vh;overflow:auto;padding:18px;background:var(--p);border:1px solid var(--line);border-radius:18px}
#modal video{width:100%;border-radius:12px;background:#000}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:12px;background:var(--v);border:1px solid var(--r);z-index:60}
@media(max-width:800px){
.nav{padding:9px 10px;flex:1 0 auto}.badge{position:absolute;margin:-14px 0 0 14px;padding:0 5px}
#app{grid-template-columns:1fr}
aside{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;justify-content:flex-start;overflow-x:auto;padding:6px;border:0;border-top:1px solid var(--line);background:rgba(2,2,2,.94);z-index:40}
aside .brand,.nav span{display:none}
.nav{justify-content:center;width:auto}.nav.out{margin:0}
main{padding:18px 16px 96px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="cfg" class="warn hide">Open student.html in a text editor and paste your Supabase URL and anon key at the top of the script.</div>

<!-- APP -->
<div id="app" class="hide">
  <aside>
    <div class="brand">STEADYMAZE</div>
    <button class="nav on" data-v="home"><i data-lucide="circle-play"></i><span>Teachers</span></button>
    <button class="nav" data-v="overview"><i data-lucide="layout-dashboard"></i><span>Overview</span></button>
    <button class="nav" data-v="profile"><i data-lucide="user"></i><span>My profile</span></button>
    <button class="nav" data-v="courses"><i data-lucide="book-open"></i><span>Courses</span></button>
    <button class="nav" data-v="compete"><i data-lucide="trophy"></i><span>Competition</span></button>
    <button class="nav" data-v="cycle"><i data-lucide="calendar-clock"></i><span>Cycle</span></button>
    <button class="nav" data-v="rewards"><i data-lucide="gift"></i><span>Rewards</span></button>
    <button class="nav" data-v="alerts"><i data-lucide="bell"></i><span>Alerts</span><b id="nbadge" class="badge hide">0</b></button>
    <button class="nav" data-v="assistant"><i data-lucide="bot"></i><span>Assistant</span></button>
    <button class="nav" data-v="settings"><i data-lucide="settings"></i><span>Settings</span></button>
    <button class="nav out" id="logout"><i data-lucide="log-out"></i><span>Log out</span></button>
  </aside>
  <main id="main"></main>
</div>
<div id="modal" class="hide"><div class="box" id="box"></div></div>
<div id="toast" class="hide" role="status"></div>

<script>
/* ====== 1. PASTE YOUR OWN VALUES HERE (anon/publishable key only, never the service-role key) ====== */
const SUPABASE_URL = "https://uxrltzlxdttbjstomhkb.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_bAbA5_9yIPt5IWQ0WwphMg_gdZ6E8-b";
/* ====== 2. TABLE NAMES (change here if yours differ) ====== */
const T = {
  profiles: "student_profiles", teachers: "teacher_profiles", videos: "teacher_intro_videos",
  enroll: "student_enrollments", entries: "competition_entries", scores: "competition_scores",
  board: "competition_scores", rewards: "student_rewards"
};

const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const cssUrl = u => u ? `url("${esc(encodeURI(u))}")` : "none";
const icons = () => window.lucide && lucide.createIcons();

if (SUPABASE_URL.startsWith("PASTE") || SUPABASE_ANON_KEY.startsWith("PASTE")) {
  $("#cfg").classList.remove("hide");
  throw new Error("Supabase keys not set");
}
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
let user = null, profile = null, mode = "login", view = "home", booting = true;

function toast(t) { const e = $("#toast"); e.textContent = t; e.classList.remove("hide"); setTimeout(() => e.classList.add("hide"), 2800); }
const loading = () => `<div class="state"><div class="spin"></div>Loading...</div>`;
const fail = (t, fn) => `<div class="state glass"><i data-lucide="triangle-alert"></i><p>${esc(t)}</p><button class="btn" onclick="${fn}()" style="margin-top:12px">Try again</button></div>`;

/* ---------- SESSION GUARD (login, register and forgot password live in login.html) ---------- */
const LOGIN_PAGE = "login.html";
let recovering = false;
function showAuth() { if (nch) { sb.removeChannel(nch); nch = null; } user = null; profile = null; location.replace(LOGIN_PAGE); }
$("#logout").onclick = async () => { await sb.auth.signOut(); };
sb.auth.onAuthStateChange((ev, session) => {
  if (ev === "SIGNED_OUT" || !session) { setTimeout(showAuth, 0); return; }
  if (ev === "PASSWORD_RECOVERY") { view = "settings"; toast("Choose your new password below."); }
  if (ev === "USER_UPDATED") return;
  setTimeout(() => enter(session.user), 0);
});

async function enter(u) {
  if (recovering || (user && user.id === u.id)) return;
  user = u;
  let { data, error } = await sb.from(T.profiles).select("*").eq("id", u.id).maybeSingle();
  if (!data && !error) {
    const m = u.user_metadata || {};
    const ins = await sb.from(T.profiles).insert({ id: u.id, full_name: m.full_name || m.name || m.fullName || u.email, country: m.country || null }).select().maybeSingle();
    data = ins.data;
  }
  profile = data || { id: u.id, full_name: u.user_metadata?.full_name || u.email };
  if (recovering) { user = null; return; }
  $("#app").classList.remove("hide");
  go(view); startNotifs();
}

/* ---------- NAV ---------- */
document.querySelectorAll(".nav[data-v]").forEach(b => b.onclick = () => go(b.dataset.v));
function go(v) {
  view = v;
  document.querySelectorAll(".nav[data-v]").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  if (rt && v !== "compete") { sb.removeChannel(rt); rt = null; }
  ({ home: renderHome, overview: renderOverview, profile: renderProfile, courses: renderCourses, compete: renderCompete, cycle: renderCycle, rewards: renderRewards, alerts: renderAlerts, assistant: renderAssistant, settings: renderSettings })[v]();
  icons();
}

/* ---------- HOME: TEACHER INTRO VIDEOS ---------- */
let vids = [], tmap = {};
async function renderHome() {
  const m = $("#main");
  m.innerHTML = `<h2>Meet your teachers</h2><p class="sub">Watch introductions from SteadyMaze teachers, then choose who you learn with.</p><div id="cybn"></div><div id="vl">${loading()}</div>`; cycleBanner();
  try {
    const { data, error } = await sb.from(T.videos).select("*").eq("status", "published").order("created_at", { ascending: false });
    if (error) throw error;
    vids = data || [];
    if (!vids.length) { $("#vl").innerHTML = `<div class="state glass"><i data-lucide="video-off"></i><p>No teacher introductions are published yet. Check back soon.</p></div>`; return icons(); }
    $("#vl").innerHTML = `<div class="grid">${vids.map((v, i) => card(v, i)).join("")}</div>`;
  } catch (x) {
    $("#vl").innerHTML = fail("Could not load teacher videos: " + (x.message || "network error"), "renderHome");
  }
  icons();
}
const skillsOf = s => Array.isArray(s) ? s : String(s || "").split(",").map(x => x.trim()).filter(Boolean);
function card(v, i) {
  const name = v.teacher_name || "Teacher";
  return `<article class="glass tv">
    <div class="thumb" style="background-image:${cssUrl(v.thumbnail_url)}"><i data-lucide="play"></i></div>
    <div class="in">
      <div class="who"><div class="av" style="background-image:${cssUrl(v.teacher_photo_url)}"></div><b>${esc(name)}</b></div>
      <h3 style="font-size:17px">${esc(v.title)}</h3>
      <div class="tags">${skillsOf(v.skills).map(s => `<span>${esc(s)}</span>`).join("")}</div>
      <p class="desc">${esc(v.description)}</p>
      <div class="row">
        <button class="btn pri" onclick="watch(${i})"><i data-lucide="play"></i>Watch introduction</button>
        <button class="btn" onclick="teacher(${i})"><i data-lucide="user"></i>View teacher profile</button>
      </div>
    </div></article>`;
}
function openModal(html) { $("#box").innerHTML = `<div style="text-align:right;margin-bottom:8px"><button class="btn" onclick="closeModal()" aria-label="Close"><i data-lucide="x"></i>Close</button></div>${html}`; $("#modal").classList.remove("hide"); icons(); }
function closeModal() { $("#modal").classList.add("hide"); $("#box").innerHTML = ""; }
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
function watch(i) {
  const v = vids[i];
  if (!v.video_url) return toast("This video has no file yet.");
  openModal(`<h3 style="margin-bottom:10px">${esc(v.title)}</h3><video controls autoplay playsinline poster="${esc(v.thumbnail_url || "")}" src="${esc(v.video_url)}"></video><p class="desc" style="-webkit-line-clamp:unset;margin-top:10px">${esc(v.description)}</p>`);
}
function teacher(i) {
  const v = vids[i];
  openModal(`<div class="who" style="gap:16px"><div class="av big" style="background-image:${cssUrl(v.teacher_photo_url)}"></div><div><h3>${esc(v.teacher_name || "Teacher")}</h3><div class="tags" style="margin-top:8px">${skillsOf(v.skills).map(s => `<span>${esc(s)}</span>`).join("")}</div></div></div><p style="margin-top:16px;color:var(--mut)">${esc(v.teacher_bio || "This teacher has not added a bio yet.")}</p>`);
}

/* ---------- OVERVIEW (all numbers from this student's rows) ---------- */
async function renderOverview() {
  const m = $("#main");
  m.innerHTML = `<h2>Welcome, ${esc(profile.full_name)}</h2><p class="sub">Your learning and competition progress.</p><div id="ov">${loading()}</div>`;
  const cnt = async tbl => { const r = await sb.from(tbl).select("*", { count: "exact", head: true }).eq("student_id", user.id); return r.error ? null : r.count; };
  const [enr, ent, rew] = await Promise.all([cnt(T.enroll), cnt(T.entries), cnt(T.rewards)]);
  let pts = null, rank = null;
  try {
    const s = await sb.from(T.scores).select("points").eq("student_id", user.id);
    if (!s.error) pts = (s.data || []).reduce((a, r) => a + Number(r.points || 0), 0);
    const r = await sb.from(T.board).select("rank").eq("student_id", user.id).order("cycle_id", { ascending: false }).limit(1);
    if (!r.error && r.data?.length) rank = r.data[0].rank;
  } catch (_) {}
  const f = v => v === null ? "-" : v;
  const S = (ic, n, l) => `<div class="glass stat"><i data-lucide="${ic}"></i><b>${esc(n)}</b><span>${l}</span></div>`;
  $("#ov").innerHTML = `<div class="grid">${S("book-open", f(enr), "Enrolled courses")}${S("trophy", f(ent), "Competition entries")}${S("medal", rank ? "#" + rank : "-", "Current rank")}${S("zap", f(pts), "Total points")}${S("gift", f(rew), "Rewards")}${S("heart-handshake", f(profile.support_points ?? null), "Support points")}</div>`;
  icons();
}

/* ---------- PROFILE ---------- */
function renderProfile() {
  $("#main").innerHTML = `<h2>My profile</h2><p class="sub">Your name and photo appear on leaderboards.</p>
  <form id="pf" class="glass card" style="max-width:520px" novalidate>
    <div class="who" style="gap:16px"><div class="av big" id="pav" style="background-image:${cssUrl(profile.avatar_url)}"></div>
    <div><label for="pfile" style="margin:0 0 6px">Profile photo (JPG/PNG, max 2 MB)</label><input id="pfile" type="file" accept="image/jpeg,image/png,image/webp"></div></div>
    <label for="p-name">Full name (required)</label><input id="p-name" value="${esc(profile.full_name)}">
    <label for="p-country">Country</label><input id="p-country" value="${esc(profile.country)}">
    <label for="p-about">About me</label><textarea id="p-about" rows="4">${esc(profile.about)}</textarea>
    <button class="btn pri" style="margin-top:16px" id="p-go"><i data-lucide="save"></i>Save changes</button>
    <div class="msg" id="p-msg" role="status"></div></form>`;
  icons();
  $("#pf").onsubmit = async e => {
    e.preventDefault();
    const name = $("#p-name").value.trim(), pm = $("#p-msg"), btn = $("#p-go");
    if (!name) { pm.className = "msg err"; return pm.textContent = "Full name is required."; }
    btn.disabled = true; pm.textContent = "";
    try {
      const upd = { full_name: name, country: $("#p-country").value.trim(), about: $("#p-about").value.trim() };
      const f = $("#pfile").files[0];
      if (f) {
        if (!/^image\/(jpeg|png|webp)$/.test(f.type) || f.size > 2 * 1024 * 1024) throw new Error("Photo must be JPG, PNG or WebP, up to 2 MB.");
        const path = `${user.id}/avatar-${Date.now()}.${f.type.split("/")[1]}`;
        const up = await sb.storage.from("avatars").upload(path, f, { upsert: true, contentType: f.type });
        if (up.error) throw up.error;
        upd.avatar_url = sb.storage.from("avatars").getPublicUrl(path).data.publicUrl;
      }
      const r = await sb.from(T.profiles).update(upd).eq("id", user.id).select().single();
      if (r.error) throw r.error;
      profile = r.data; pm.className = "msg ok"; pm.textContent = "Saved."; toast("Saved");
    } catch (x) { pm.className = "msg err"; pm.textContent = x.message || "Could not save."; }
    btn.disabled = false;
  };
}

/* ---------- COURSES + COMPETITION ---------- */
let skills = [], prices = {}, cprices = {}, cycles = [], myEnr = [];
let cg = "lower", cs = null, cp = 0, cq = "", cycle = null, rt = null, rtT = null;
const PS = 25, GN = { lower: "Lower", medium: "Medium", high: "High" };
const money = v => v == null ? "Not set" : "$" + Number(v);
async function loadCatalog() {
  if (skills.length) return;
  const r = await Promise.all([
    sb.from("skills").select("*").eq("active", true).order("sort"),
    sb.from("level_prices").select("*"), sb.from("competition_prices").select("*"),
    sb.from("competition_cycles").select("*").in("status", ["open", "upcoming"]).order("number")]);
  r.forEach(x => { if (x.error) throw x.error; });
  skills = r[0].data; r[1].data.forEach(x => prices[x.grp + x.level] = x.price);
  r[2].data.forEach(x => cprices[x.grp] = x); cycles = r[3].data;
}
async function loadEnr() { const e = await sb.from("student_enrollments").select("skill_id,level").eq("student_id", user.id); myEnr = e.data || []; }

async function renderCourses() {
  $("#main").innerHTML = `<h2>Courses</h2><p class="sub">Learn a skill level by level. Finish Level 2 to unlock its competition.</p><div id="cl">${loading()}</div>`;
  try {
    await loadCatalog(); await loadEnr();
    $("#cl").innerHTML = Object.keys(GN).map(g => `<h3 style="margin:22px 0 10px">${GN[g]} group</h3><div class="grid">${skills.filter(s => s.grp === g).map(s => {
      const mine = myEnr.filter(x => x.skill_id === s.id).map(x => x.level);
      return `<div class="glass stat"><b style="font-size:18px;margin:0 0 10px">${esc(s.name)}</b><div class="tags">${[1, 2, 3].map(l => `<span style="${mine.includes(l) ? "background:#0a6b3a" : ""}">Level ${l}: ${money(prices[g + l])}</span>`).join("")}</div><span style="display:block;margin-top:10px">${mine.length ? "Your levels: " + mine.join(", ") : "Not enrolled"}</span>${mine.length ? `<button class="btn" style="margin-top:12px" onclick="lessons(${s.id})"><i data-lucide="circle-play"></i>Lessons</button>` : ""}</div>`;
    }).join("")}</div>`).join("");
  } catch (x) { $("#cl").innerHTML = fail("Could not load courses: " + (x.message || "network error"), "renderCourses"); }
  icons();
}

async function renderCompete() {
  $("#main").innerHTML = `<h2>Competition</h2><p class="sub">Every skill has its own leaderboard and cycle.</p><div id="cb">${loading()}</div>`;
  try { await loadCatalog(); await loadEnr(); } catch (x) { $("#cb").innerHTML = fail("Could not load: " + (x.message || "network error"), "renderCompete"); return icons(); }
  cycle = cycles.find(c => c.status === "open") || cycles[0] || null;
  $("#cb").innerHTML = `<div class="tabs" id="gt" style="margin-top:0">${Object.keys(GN).map(g => `<button data-g="${g}">${GN[g]}</button>`).join("")}</div>
  <label for="sk">Skill</label><select id="sk"></select><div id="cx" style="margin-top:18px"></div>`;
  document.querySelectorAll("#gt button").forEach(b => b.onclick = () => pickGroup(b.dataset.g));
  $("#sk").onchange = e => { cs = Number(e.target.value); loadSkill(); };
  pickGroup(cg);
}
function pickGroup(g) {
  cg = g;
  document.querySelectorAll("#gt button").forEach(b => b.classList.toggle("on", b.dataset.g === g));
  const list = skills.filter(s => s.grp === g);
  $("#sk").innerHTML = list.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join("");
  cs = list[0]?.id; loadSkill();
}
async function loadSkill() {
  cp = 0; cq = "";
  if (!cs) { $("#cx").innerHTML = `<div class="state glass">No skills found for this group.</div>`; return; }
  if (!cycle) { $("#cx").innerHTML = `<div class="state glass"><i data-lucide="calendar-clock"></i><p>No competition cycle is open yet. The next one will be announced soon.</p></div>`; return icons(); }
  $("#cx").innerHTML = loading();
  const s = skills.find(x => x.id === cs), cz = cprices[s.grp] || {};
  const [st, me, en] = await Promise.all([
    sb.rpc("competition_stats", { p_skill: cs, p_cycle: cycle.id }),
    sb.from("competition_scores").select("rank").eq("skill_id", cs).eq("cycle_id", cycle.id).eq("student_id", user.id).maybeSingle(),
    sb.from("competition_entries").select("status,free_cycle").eq("skill_id", cs).eq("cycle_id", cycle.id).eq("student_id", user.id).maybeSingle()]);
  if (st.error) { $("#cx").innerHTML = fail("Could not load competition: " + st.error.message, "loadSkill"); return icons(); }
  const d = st.data, ready = myEnr.some(x => x.skill_id === cs && x.level >= 2);
  const S = (ic, n, l) => `<div class="glass stat"><i data-lucide="${ic}"></i><b>${esc(n)}</b><span>${l}</span></div>`;
  const act = en.data ? `<span class="tags"><span>Registered: ${esc(en.data.status)}</span></span>`
    : ready ? `<button class="btn pri" id="claim"><i data-lucide="gift"></i>Claim your free 8-video cycle</button>`
    : `<span class="sub" style="margin:0">Finish Level 2 of ${esc(s.name)} to unlock your free cycle.</span>`;
  $("#cx").innerHTML = `<div class="grid">${S("users", d.registrations, "Total registrations")}${S("shopping-bag", d.purchases, "Total purchases")}${S("graduation-cap", d.ready, "Competition-ready students")}${S("star", d.ratings, "Total ratings")}${S("ticket", d.available, "Available slots")}${S("medal", me.data?.rank ? "#" + me.data.rank : "-", "My competition rank")}</div>
  <div class="glass" style="padding:16px;margin:14px 0;display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between"><div><b>${esc(s.name)}</b> · Cycle ${cycle.number}<br><span class="sub" style="margin:0">${money(cz.price)} per cycle · ${cz.videos || 8} videos · ${cz.months || 2} months · ends ${new Date(cycle.ends_at).toLocaleDateString()}</span></div>${act}</div>
  <h3 style="margin:18px 0 8px">Leaderboard</h3><input id="lq" type="search" placeholder="Search student..." aria-label="Search student" style="max-width:320px;margin-bottom:10px">
  <div class="glass tbl"><table><thead><tr><th>Rank</th><th>Student</th><th>Points</th><th>Creativity</th><th>Quality</th><th>Storytelling</th></tr></thead><tbody id="lb"></tbody></table></div>
  <div class="row" style="margin-top:12px;align-items:center"><button class="btn" id="pv">Previous</button><span id="pg" class="sub" style="margin:0"></span><button class="btn" id="nx">Next</button></div>`;
  icons();
  $("#claim")?.addEventListener("click", async e => { e.target.disabled = true; const r = await sb.rpc("claim_free_cycle", { p_skill: cs }); if (r.error) { toast(r.error.message); e.target.disabled = false; } else { toast("You are registered."); loadSkill(); } });
  let t; $("#lq").oninput = e => { clearTimeout(t); t = setTimeout(() => { cq = e.target.value.trim(); cp = 0; loadRows(); }, 400); };
  $("#pv").onclick = () => { if (cp > 0) { cp--; loadRows(); } };
  $("#nx").onclick = () => { cp++; loadRows(); };
  loadRows();
  if (rt) sb.removeChannel(rt);
  rt = sb.channel("lb-" + cs).on("postgres_changes", { event: "*", schema: "public", table: "competition_scores", filter: "skill_id=eq." + cs }, () => { clearTimeout(rtT); rtT = setTimeout(loadRows, 1500); }).subscribe();
}
async function loadRows() {
  const body = $("#lb"); if (!body) return;
  const r = await sb.rpc("get_leaderboard", { p_skill: cs, p_cycle: cycle.id, p_search: cq || null, p_limit: PS, p_offset: cp * PS });
  if (r.error) { body.innerHTML = `<tr><td colspan="6" class="state">Could not load leaderboard: ${esc(r.error.message)}</td></tr>`; return; }
  const rows = r.data || [];
  body.innerHTML = rows.length ? rows.map(x => `<tr><td>${x.rank ?? "-"}</td><td><div class="who"><div class="av" style="background-image:${cssUrl(x.avatar_url)}"></div>${esc(x.student_name)}</div></td><td><b>${x.points}</b></td><td>${x.creativity}</td><td>${x.quality}</td><td>${x.storytelling}</td></tr>`).join("")
    : `<tr><td colspan="6" class="state">${cq ? "No student matches your search." : "No scores yet for this skill."}</td></tr>`;
  $("#pg").textContent = "Page " + (cp + 1);
  $("#pv").disabled = cp === 0; $("#nx").disabled = rows.length < PS;
}

/* ---------- LESSONS ---------- */
let ls = [];
async function lessons(id) {
  const s = skills.find(x => x.id === id);
  openModal(`<h3 style="margin-bottom:10px">${esc(s.name)} lessons</h3><div id="ll">${loading()}</div>`);
  const r = await sb.from("lessons").select("id,title,level,lesson_number,description,video_url").ilike("skill", s.name).eq("status", "approved").order("level").order("lesson_number");
  if (r.error) { $("#ll").innerHTML = `<div class="state">Could not load lessons: ${esc(r.error.message)}</div>`; return; }
  ls = r.data || [];
  $("#ll").innerHTML = ls.length ? ls.map((l, i) => `<div class="glass" style="padding:12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;justify-content:space-between"><div><b>${esc(l.level)} · ${esc(l.lesson_number ?? "")} ${esc(l.title)}</b><div class="desc">${esc(l.description)}</div></div><button class="btn pri" onclick="play(${i},${id})"><i data-lucide="play"></i></button></div>`).join("") : `<div class="state">No approved lessons for your levels yet.</div>`;
  icons();
}
function play(i, id) { const l = ls[i]; openModal(`<button class="btn" onclick="lessons(${id})" style="margin-bottom:10px"><i data-lucide="arrow-left"></i>Lessons</button><h3 style="margin-bottom:10px">${esc(l.title)}</h3><video controls autoplay playsinline src="${esc(l.video_url)}"></video>`); }

/* ---------- REWARDS ---------- */
async function renderRewards() {
  $("#main").innerHTML = `<h2>Rewards</h2><p class="sub">Official winners are announced by the Admin only.</p><div id="rw">${loading()}</div>`;
  const r = await sb.from("student_rewards").select("*").eq("status", "published").order("announced_at", { ascending: false }).limit(200);
  if (r.error) { $("#rw").innerHTML = fail("Could not load rewards: " + r.error.message, "renderRewards"); return icons(); }
  $("#rw").innerHTML = Object.keys(GN).map(g => {
    const rows = (r.data || []).filter(x => x.grp === g), cy = Math.max(0, ...rows.map(x => x.cycle_id || 0));
    const cur = rows.filter(x => (x.cycle_id || 0) === cy);
    return `<h3 style="margin:22px 0 10px">${GN[g]} winners</h3><div class="grid">${[1, 2, 3, 4, 5, 6].map(n => {
      const w = cur.find(x => x.rank === n);
      return w ? `<div class="glass stat"><div class="who"><div class="av" style="background-image:${cssUrl(w.avatar_url)}"></div><div><b style="font-size:16px;margin:0">#${n} ${esc(w.winner_name)}</b><span>${esc(w.prize || "")}</span></div></div><span class="pub" style="display:block;margin-top:10px">Published · ${w.announced_at ? new Date(w.announced_at).toLocaleDateString() : ""}</span></div>`
        : `<div class="glass stat"><b style="font-size:16px;margin:0">#${n}</b><span class="pend">Pending</span></div>`;
    }).join("")}</div>`;
  }).join("");
  icons();
}

/* ---------- NOTIFICATIONS ---------- */
let nch = null;
async function countUnread() {
  const r = await sb.from("student_notifications").select("*", { count: "exact", head: true }).eq("student_id", user.id).eq("read", false);
  const b = $("#nbadge"); b.textContent = r.count || 0; b.classList.toggle("hide", !r.count);
}
async function startNotifs() {
  if (nch) sb.removeChannel(nch);
  countUnread();
  nch = sb.channel("n-" + user.id).on("postgres_changes", { event: "INSERT", schema: "public", table: "student_notifications", filter: "student_id=eq." + user.id }, p => { toast(p.new.title); countUnread(); if (view === "alerts") renderAlerts(); if (view === "rewards") renderRewards(); }).subscribe();
}
async function renderAlerts() {
  $("#main").innerHTML = `<h2>Alerts</h2><p class="sub">Competition and reward updates.</p><div id="al">${loading()}</div>`;
  const r = await sb.from("student_notifications").select("*").eq("student_id", user.id).order("created_at", { ascending: false }).limit(50);
  if (r.error) { $("#al").innerHTML = fail("Could not load alerts: " + r.error.message, "renderAlerts"); return icons(); }
  const d = r.data || [];
  $("#al").innerHTML = d.length ? `<button class="btn" id="mr" style="margin-bottom:12px"><i data-lucide="check-check"></i>Mark all read</button>` + d.map(n => `<div class="glass" style="padding:14px;margin-bottom:8px;${n.read ? "opacity:.6" : ""}"><b>${esc(n.title)}</b><div class="desc">${esc(n.body)}</div><span class="sub" style="font-size:12px;margin:0">${new Date(n.created_at).toLocaleString()}</span></div>`).join("") : `<div class="state glass"><i data-lucide="bell-off"></i><p>No notifications yet.</p></div>`;
  $("#mr")?.addEventListener("click", async () => { await sb.from("student_notifications").update({ read: true }).eq("student_id", user.id).eq("read", false); countUnread(); renderAlerts(); });
  icons();
}

/* ---------- SETTINGS ---------- */
async function renderSettings() {
  const st = await sb.from("student_settings").select("*").eq("student_id", user.id).maybeSingle();
  const c = st.data || { language: "en", email_notifications: true };
  $("#main").innerHTML = `<h2>Settings</h2><p class="sub">Account, security and preferences.</p>
  <form id="sf" class="glass card" style="max-width:520px" novalidate>
    <label for="s-mail">Email</label><input id="s-mail" value="${esc(user.email)}" readonly>
    <label for="s-lang">Language</label><select id="s-lang"><option value="en">English</option><option value="so">Soomaali</option><option value="ar">العربية</option></select>
    <label style="display:flex;gap:10px;align-items:center;margin-top:14px"><input id="s-mail-on" type="checkbox" style="width:auto" ${c.email_notifications ? "checked" : ""}>Email notifications</label>
    <button class="btn pri" style="margin-top:16px"><i data-lucide="save"></i>Save preferences</button></form>
  <form id="pw" class="glass card" style="max-width:520px;margin-top:14px" novalidate>
    <h3>Password and security</h3><label for="s-pw">New password (8+ characters)</label><input id="s-pw" type="password" autocomplete="new-password">
    <button class="btn pri" style="margin-top:16px"><i data-lucide="lock"></i>Change password</button></form>
  <button class="btn" style="margin-top:14px" onclick="sb.auth.signOut()"><i data-lucide="log-out"></i>Log out</button>`;
  $("#s-lang").value = c.language; icons();
  $("#sf").onsubmit = async e => { e.preventDefault(); const r = await sb.from("student_settings").upsert({ student_id: user.id, language: $("#s-lang").value, email_notifications: $("#s-mail-on").checked, updated_at: new Date().toISOString() }); toast(r.error ? r.error.message : "Preferences saved"); };
  $("#pw").onsubmit = async e => { e.preventDefault(); const p = $("#s-pw").value; if (p.length < 8) return toast("Password must be at least 8 characters."); const r = await sb.auth.updateUser({ password: p }); toast(r.error ? r.error.message : "Password changed"); if (!r.error) $("#s-pw").value = ""; };
}

/* ---------- CYCLE (menu + homepage banner) ---------- */
function fmtLeft(ms) {
  if (!(ms > 0)) return "Ended";
  const d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5), m = Math.floor(ms % 36e5 / 6e4), x = Math.floor(ms % 6e4 / 1e3);
  return `${d}d ${h}h ${m}m ${x}s`;
}
function tick() { document.querySelectorAll("[data-end]").forEach(e => e.textContent = fmtLeft(new Date(e.dataset.end) - Date.now())); }
setInterval(tick, 1000);
const cyDate = d => new Date(d).toLocaleDateString();
async function cycleBanner() {
  try { await loadCatalog(); } catch (_) { return; }
  const c = cycles.find(x => x.status === "open") || cycles[0], b = $("#cybn"); if (!b) return;
  const open = c && c.status === "open";
  b.innerHTML = c ? `<div class="glass" style="padding:16px;margin-bottom:18px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between"><div><b>Competition Cycle ${c.number} · ${open ? "Open now" : "Opens " + cyDate(c.starts_at)}</b><div class="sub" style="margin:0">${open ? "Time left: " : "Starts in: "}<span data-end="${esc(open ? c.ends_at : c.starts_at)}"></span></div></div><button class="btn pri" onclick="go('cycle')"><i data-lucide="calendar-clock"></i>View cycle</button></div>` : "";
  tick(); icons();
}
function cycleCard(c) {
  const open = c.status === "open", end = open ? c.ends_at : c.starts_at;
  return `<div class="glass" style="padding:18px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><h3>Cycle ${c.number}</h3><div class="tags"><span>${open ? "Open" : "Upcoming"}</span></div></div><p class="sub" style="margin:6px 0 10px">${cyDate(c.starts_at)} to ${cyDate(c.ends_at)}</p><b style="font-family:Georgia,serif;font-size:24px" data-end="${esc(end)}"></b><span class="sub" style="display:block;margin:0">${open ? "left to upload and compete" : "until it opens"}</span></div>`;
}
async function renderCycle() {
  $("#main").innerHTML = `<h2>Competition cycle</h2><p class="sub">Each cycle has 8 videos and lasts 2 months.</p><div id="cy">${loading()}</div>`;
  try {
    await loadCatalog();
    const [past, mine] = await Promise.all([
      sb.from("competition_cycles").select("*").eq("status", "closed").order("number", { ascending: false }).limit(6),
      sb.from("competition_entries").select("skill_id,cycle_id,status,free_cycle").eq("student_id", user.id).order("created_at", { ascending: false })]);
    if (past.error) throw past.error; if (mine.error) throw mine.error;
    const all = cycles.concat(past.data || []), nm = id => skills.find(x => x.id === id)?.name || "Skill", num = id => all.find(c => c.id === id)?.number ?? "?";
    $("#cy").innerHTML = (cycles.length ? `<div class="grid">${cycles.map(cycleCard).join("")}</div>` : `<div class="state glass"><i data-lucide="calendar-clock"></i><p>No cycle is open yet. The next cycle will be announced soon.</p></div>`)
    + `<h3 style="margin:24px 0 10px">Entry price per cycle</h3><div class="grid">${Object.keys(GN).map(g => { const p = cprices[g] || {}; return `<div class="glass stat"><span>${GN[g]} group</span><b>${money(p.price)}</b><span>${p.videos || 8} videos · ${p.months || 2} months</span></div>`; }).join("")}</div>`
    + `<h3 style="margin:24px 0 10px">My entries</h3>` + ((mine.data || []).length ? (mine.data).map(e => `<div class="glass" style="padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><b>${esc(nm(e.skill_id))} · Cycle ${esc(num(e.cycle_id))}</b><span class="tags"><span>${esc(e.status)}</span><span>${e.free_cycle ? "Free cycle" : "Paid"}</span></span></div>`).join("") : `<div class="state glass">You have no competition entries yet.</div>`)
    + `<h3 style="margin:24px 0 10px">Previous cycles</h3>` + ((past.data || []).length ? past.data.map(c => `<div class="glass" style="padding:12px;margin-bottom:8px">Cycle ${c.number} · ${cyDate(c.starts_at)} to ${cyDate(c.ends_at)}</div>`).join("") : `<div class="state glass">No finished cycles yet.</div>`);
    tick();
  } catch (x) { $("#cy").innerHTML = fail("Could not load cycle: " + (x.message || "network error"), "renderCycle"); }
  icons();
}

/* ---------- AI ASSISTANT (calls the secure Edge Function; no AI key in this file) ---------- */
let hist = [];
function renderAssistant() {
  $("#main").innerHTML = `<h2>AI Assistant</h2><p class="sub">Ask about lessons, skills, practice questions, competition rules, rewards or how to use the dashboard.</p>
  <div id="chat" class="glass" style="padding:14px;height:calc(100vh - 340px);min-height:260px;overflow-y:auto"></div>
  <form id="cf" style="display:flex;gap:8px;margin-top:10px" novalidate><input id="ci" placeholder="Write a message..." maxlength="1000" aria-label="Message" autocomplete="off"><button class="btn pri" id="csend" aria-label="Send"><i data-lucide="send"></i></button></form>`;
  icons();
  const add = (r, t) => { const c = $("#chat"), d = document.createElement("div"); d.className = "bub " + r; d.textContent = t; if (c) { c.appendChild(d); c.scrollTop = c.scrollHeight; } return d; };
  if (!hist.length) add("a", "Hello! I am your SteadyMaze assistant. How can I help you today?");
  hist.forEach(m => add(m.role === "user" ? "u" : "a", m.content));
  $("#cf").onsubmit = async e => {
    e.preventDefault();
    const t = $("#ci").value.trim(); if (!t) return;
    $("#ci").value = ""; hist.push({ role: "user", content: t }); add("u", t);
    const w = add("a", "Thinking..."), bt = $("#csend"); bt.disabled = true;
    const r = await sb.functions.invoke("student-assistant", { body: { messages: hist.slice(-10) } });
    bt.disabled = false;
    if (r.error || !r.data?.reply) { w.textContent = "The assistant is not available right now. Please try again later."; hist.pop(); return; }
    w.textContent = r.data.reply; hist.push({ role: "assistant", content: r.data.reply });
  };
}
</script>
