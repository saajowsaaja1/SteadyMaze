<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Portal - Xisaabtaada</title>
    <!-- Tailwind CSS -->
    <script src="https://tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://jsdelivr.net"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        @import url('https://googleapis.com');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <!-- ========================================== -->
    <!-- 1. QAYBTA LOGIN & SIGNUP (MARKA UUSAN GALIN) -->
    <!-- ========================================== -->
    <div id="auth-section" class="flex-1 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl shadow-xl border border-slate-200/60 overflow-hidden">
            
            <!-- Header -->
            <div class="bg-gradient-to-r from-indigo-600 to-purple-700 p-8 text-center text-white">
                <div class="w-14 h-14 bg-white/20 backdrop-blur-md rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <h1 class="text-2xl font-bold" id="auth-title">Ku Soo Dhawoow</h1>
                <p class="text-indigo-100 text-sm mt-1" id="auth-subtitle">Gali xogtaada si aad u maamusho xisaabtaada</p>
            </div>

            <!-- Tabs (Login / Register) -->
            <div class="flex border-b border-slate-200">
                <button onclick="switchAuthTab('login')" id="tab-login" class="flex-1 py-3.5 text-sm font-bold text-indigo-600 border-b-2 border-indigo-600 transition">
                    Soo Gal (Login)
                </button>
                <button onclick="switchAuthTab('signup')" id="tab-signup" class="flex-1 py-3.5 text-sm font-semibold text-slate-500 hover:text-slate-700 transition">
                    Is-diiwaangeli (Sign Up)
                </button>
            </div>

            <!-- Alert Box -->
            <div id="auth-alert" class="hidden mx-6 mt-6 p-3.5 rounded-xl text-sm font-medium"></div>

            <!-- LOGIN FORM -->
            <form id="login-form" class="p-6 sm:p-8 space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-500 mb-1.5">Email-kaaga</label>
                    <div class="relative">
                        <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="email" id="login-email" required placeholder="magaca@gmail.com"
                            class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-slate-500 mb-1.5">Erayga Sirta ah (Password)</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="password" id="login-password" required placeholder="••••••••"
                            class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                    </div>
                </div>

                <button type="submit" id="login-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-indigo-200 transition flex items-center justify-center gap-2 mt-2">
                    <span>Soo Gal Hadda</span>
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                </button>
            </form>

            <!-- SIGNUP FORM -->
            <form id="signup-form" class="hidden p-6 sm:p-8 space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-500 mb-1.5">Magacaaga oo buuxa</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="signup-name" required placeholder="Axmed Maxamed"
                            class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-slate-500 mb-1.5">Lambarka Telefoonka</label>
                    <div class="relative">
                        <i class="fa-solid fa-phone absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="tel" id="signup-phone" required placeholder="+252 61 XXXXXXX"
                            class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-slate-500 mb-1.5">Email-kaaga</label>
                    <div class="relative">
                        <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="email" id="signup-email" required placeholder="magaca@gmail.com"
                            class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-slate-500 mb-1.5">Erayga Sirta ah (Ugu yaraan 6 xaraf)</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="password" id="signup-password" required minlength="6" placeholder="••••••••"
                            class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                    </div>
                </div>

                <button type="submit" id="signup-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-indigo-200 transition flex items-center justify-center gap-2 mt-2">
                    <span>Samee Xisaab Cusub</span>
                    <i class="fa-solid fa-user-plus"></i>
                </button>
            </form>

        </div>
    </div>


    <!-- ========================================== -->
    <!-- 2. USER DASHBOARD (MARKA UU SOO GALO)      -->
    <!-- ========================================== -->
    <div id="dashboard-section" class="hidden flex-1 flex flex-col">
        
        <!-- Top Navbar -->
        <nav class="bg-white border-b border-slate-200 sticky top-0 z-30">
            <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex justify-between items-center">
                <div class="flex items-center gap-2.5">
                    <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold">
                        <i class="fa-solid fa-layer-group"></i>
                    </div>
                    <span class="font-bold text-lg text-slate-900">User<span class="text-indigo-600">Portal</span></span>
                </div>

                <div class="flex items-center gap-3">
                    <span id="nav-user-email" class="hidden sm:inline-block text-xs font-medium text-slate-500 bg-slate-100 px-3 py-1.5 rounded-full"></span>
                    <button onclick="handleLogout()" class="bg-red-50 hover:bg-red-100 text-red-600 text-xs font-bold px-4 py-2 rounded-xl transition flex items-center gap-1.5">
                        <i class="fa-solid fa-right-from-bracket"></i> Ka Bax
                    </button>
                </div>
            </div>
        </nav>

        <!-- Dashboard Main Content -->
        <main class="max-w-5xl w-full mx-auto px-4 sm:px-6 py-8 space-y-6">
            
            <!-- Welcome Banner -->
            <div class="bg-gradient-to-r from-indigo-600 via-indigo-700 to-purple-800 rounded-3xl p-6 sm:p-8 text-white shadow-lg flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                <div class="flex items-center gap-4">
                    <div id="user-avatar" class="w-16 h-16 rounded-2xl bg-white/20 backdrop-blur-md flex items-center justify-center text-2xl font-bold border border-white/30 shrink-0">
                        U
                    </div>
                    <div>
                        <span class="text-xs font-semibold uppercase tracking-wider text-indigo-200">Xisaabtaada Gaarka ah</span>
                        <h2 id="dash-user-name" class="text-2xl font-bold mt-0.5">Soo Dhawoow!</h2>
                        <p id="dash-user-id" class="text-xs text-indigo-200 mt-1 font-mono opacity-80">ID: ...</p>
                    </div>
                </div>
                <div class="bg-white/10 backdrop-blur-md px-4 py-2.5 rounded-2xl border border-white/10 text-xs">
                    <span class="text-indigo-200 block">Xaaladda Xisaabta:</span>
