<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stezeo – My Dashboard</title>
<style>
:root{color-scheme:dark;--bg:#05060a;--card:#0e1017;--line:#1f2230;--ink:#f4f1ea;--muted:#9a9db0;--gold:#F5B301;--red:#E8192C;--purple:#8B3DFF;--orange:#FF7A1A;--ok:#2fd27a}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;min-height:100vh;overflow-x:hidden;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
body::before{content:"";position:fixed;top:-120px;right:-100px;width:360px;height:360px;background:var(--purple);filter:blur(120px);opacity:.3;pointer-events:none}
.wrap{max-width:980px;margin:0 auto;padding:0 18px 50px;position:relative}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 0;gap:10px;flex-wrap:wrap}
.logo{font-weight:800;font-size:1.3rem;color:var(--gold);text-decoration:none}
button,input{font:inherit}
.btn{background:linear-gradient(90deg,var(--orange),var(--red));color:#fff;border:0;border-radius:9px;padding:10px 18px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(232,25,44,.3)}
.btn.s{background:none;border:1px solid var(--line);box-shadow:none;color:var(--ink);padding:6px 12px;font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.tab:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 8px rgba(139,61,255,.18)}
#auth{max-width:380px;margin:50px auto}
#auth h1{font-size:1.7rem;margin-bottom:14px;color:var(--gold)}
input{width:100%;background:#07080d;border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:11px;margin-bottom:10px}
#msg{color:var(--orange);font-size:.9rem;margin-top:10px;min-height:1.2em}
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.tab{background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:7px 16px;cursor:pointer}
.tab.on{background:linear-gradient(90deg,var(--red),var(--orange));border-color:transparent;color:#fff;font-weight:600}
h2{font-size:1.5rem;margin-bottom:14px}
.list{display:grid;gap:14px}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.bar{height:8px;background:#1a1d29;border-radius:9px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--orange))}
.muted{color:var(--muted);font-size:.88rem}
.pill{font-size:.75rem;padding:2px 10px;border-radius:99px;border:1px solid var(--line)}
.pill.active,.pill.finished{color:var(--ok);border-color:var(--ok)}
.pill.pending,.pill.booked{color:var(--gold);border-color:var(--gold)}
.pill.removed,.pill.closed{color:var(--red);border-color:var(--red)}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:14px}
.v{background:#07080d;border:1px solid var(--line);border-radius:10px;padding:12px}
.v.done{border-color:var(--ok)}
.v b{display:block;margin-bottom:4px}
.v .row{margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat b{display:block;font-size:1.5rem;color:var(--gold)}
.big{font-size:1.7rem;font-weight:800;color:var(--orange);font-variant-numeric:tabular-nums}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px}
.mi{text-align:left;color:inherit;cursor:pointer}.mi b{display:block;color:var(--gold)}
.clock{font-variant-numeric:tabular-nums;color:var(--orange);font-weight:600}
select{background:#07080d;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px}
tr.me td{background:rgba(245,179,1,.12)}
.up{cursor:pointer;display:inline-block}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500}
.scroll{overflow-x:auto}
dialog{background:#0b0d14;color:var(--ink);border:1px solid var(--line);border-radius:14px;width:min(720px,94vw);padding:16px;margin:auto}
dialog::backdrop{background:rgba(0,0,0,.8)}
dialog video,dialog iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#000;margin:12px 0}

/* ===== Luxury purple / gold theme ===== */
:root{--bg:#07040f;--card:rgba(255,255,255,.045);--line:rgba(255,255,255,.11);--ink:#fff;--muted:#bdb4d8;--gold:#F5C542;--orange:#FFE08A;--red:#9F67FF;--purple:#7C3AED}
body{background:radial-gradient(1200px 600px at 80% -10%,rgba(124,58,237,.35),transparent 60%),radial-gradient(900px 500px at -10% 40%,rgba(159,103,255,.22),transparent 60%),#07040f}
.glow{filter:blur(140px)!important;opacity:.55!important}
.tier,.step,.fee,.card,.box,dialog,.v{background:rgba(255,255,255,.045)!important;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.12)!important;box-shadow:0 8px 30px rgba(10,4,30,.5),inset 0 1px 0 rgba(255,255,255,.08)!important}
.comp,#lessons{background:rgba(10,5,24,.55)!important}
.btn.p,.cta .btn,.btn:not(.s):not(.o){background:linear-gradient(135deg,#FFF3B8,#F5C542 45%,#C8921A)!important;color:#1b1204!important;border:1px solid #ffe9a0!important;font-weight:800;letter-spacing:.02em;position:relative;overflow:hidden;box-shadow:0 8px 26px rgba(245,197,66,.38),inset 0 1px 0 rgba(255,255,255,.75)!important;transition:transform .15s,box-shadow .2s}
.btn.p::after,.cta .btn::after,.btn:not(.s):not(.o)::after{content:"";position:absolute;top:0;left:-120%;width:55%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.8),transparent);transition:left .7s}
.btn.p:hover::after,.cta .btn:hover::after,.btn:not(.s):not(.o):hover::after{left:140%}
.btn.p:hover,.cta .btn:hover,.btn:not(.s):not(.o):hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(245,197,66,.5),inset 0 1px 0 rgba(255,255,255,.75)!important}
.btn.o,.btn.s{background:rgba(255,255,255,.06)!important;border:1px solid rgba(245,197,66,.55)!important;color:#ffe9a0!important;backdrop-filter:blur(10px);box-shadow:none!important}
.btn.o:hover,.btn.s:hover{background:rgba(245,197,66,.14)!important}
.btn:disabled{opacity:.45;transform:none!important}
.chip{background:rgba(255,255,255,.06)!important;backdrop-filter:blur(8px)}
.chip.on{border-color:var(--gold)!important;color:var(--gold)!important}
.chip.grp.on,.tab.on{background:linear-gradient(135deg,#FFF3B8,#F5C542 45%,#C8921A)!important;color:#1b1204!important;border-color:transparent!important}
.cta{background:linear-gradient(120deg,#3b1a8a,#7C3AED 55%,#a678ff)!important}
.logo{text-shadow:0 0 24px rgba(245,197,66,.55)}
.sm{font-size:.78rem;color:#fff;opacity:.85}
@media(prefers-reduced-motion:reduce){.btn::after{display:none}}

body::after{content:"";position:fixed;bottom:-140px;left:-120px;width:380px;height:380px;background:#9F67FF;filter:blur(130px);opacity:.3;pointer-events:none}
#auth{max-width:420px;margin:60px auto;padding:30px!important;border-radius:22px!important;box-shadow:0 20px 60px rgba(124,58,237,.35),inset 0 1px 0 rgba(255,255,255,.1)!important}
#auth h1{background:linear-gradient(90deg,#fff,#F5C542);-webkit-background-clip:text;background-clip:text;color:transparent}
#auth .sub{color:#fff;opacity:.8;font-size:.8rem;margin:-6px 0 16px}
input,select{background:rgba(255,255,255,.07)!important;border:1px solid rgba(255,255,255,.16)!important;color:#fff!important;border-radius:12px!important;padding:13px!important}
input::placeholder{color:#bdb4d8}
input:focus{border-color:var(--gold)!important;box-shadow:0 0 0 3px rgba(245,197,66,.2)}
#go{padding:14px!important;font-size:1rem}

.tabs{overflow-x:auto;flex-wrap:nowrap;padding-bottom:6px;scrollbar-width:none}.tab{white-space:nowrap}
.gt{margin:22px 0 10px;font-size:1.15rem}.gt .muted{font-weight:400;margin-left:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tile{text-align:left;color:inherit;font:inherit;cursor:pointer;border-radius:14px;padding:14px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);transition:transform .15s,border-color .2s}
.tile:hover{transform:translateY(-3px);border-color:var(--gold)}
.tile b{display:block;margin-bottom:6px}.tile .muted{display:block;margin-top:6px;font-size:.78rem}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#7C3AED,#F5C542);display:inline-grid;place-items:center;font-weight:700;font-size:.8rem;color:#fff;object-fit:cover;vertical-align:middle;margin-right:8px}
.mb{height:9px;border-radius:9px;background:rgba(255,255,255,.08);position:relative;margin:4px 0 12px}.mb i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,#9F67FF,#F5C542)}.mb u{position:absolute;top:-3px;bottom:-3px;width:3px;background:#fff;border-radius:2px}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.chart{display:flex;align-items:flex-end;gap:6px;height:130px;margin-top:10px}.chart div{flex:1;background:linear-gradient(180deg,#F5C542,#7C3AED);border-radius:6px 6px 0 0;min-height:3px;position:relative}.chart div span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:.7rem;color:#fff}
.lab{display:flex;gap:6px;margin-top:6px;font-size:.7rem;color:var(--muted)}.lab span{flex:1;text-align:center}
.srch{max-width:360px;margin:0 0 14px!important}
.les{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
select{margin-right:6px}
dialog{width:min(780px,95vw)}
</style>
</head>
<body>
<div class="wrap">
<header><a class="logo" href="index.html">Stezeo</a><div id="who" class="row" style="gap:10px"></div></header>

<div id="auth" class="box">
  <h1 id="at">Log in</h1>
  <p class="sub">Welcome to Stezeo. Learn, compete, get hired.</p>
  <input id="nm" placeholder="Full name" autocomplete="name" hidden>
  <input id="em" type="email" placeholder="Email" autocomplete="email">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <button class="btn" id="go" style="width:100%">Log in</button>
  <p class="muted" style="margin-top:12px"><a href="#" id="sw" style="color:var(--gold)">No account? Sign up</a></p>
  <p id="msg"></p>
</div>

<div id="app" hidden>
  <nav class="tabs" aria-label="Menu">
    <button class="tab on" data-t="home">Home</button>
    <button class="tab" data-t="train">My training</button>
    <button class="tab" data-t="comp">Competition</button>
    <button class="tab" data-t="pay">Payments</button>
    <button class="tab" data-t="ana">Analytics</button>
    <button class="tab" data-t="stand">My standing</button>
  </nav>
  <div id="home"></div><div id="train" hidden></div><div id="comp" hidden></div><div id="pay" hidden></div><div id="ana" hidden></div><div id="stand" hidden></div>
</div>
</div>
<dialog id="dlg"><div class="row"><b id="dt"></b><button class="btn s" id="dc">Close</button></div><div id="dv"></div></dialog>
<script>
const URL_='https://uxrltzlxdttbjstomhkb.supabase.co';
const KEY='sb_publishable_bAbA5_9yIPt5IWQ0WwphMg_gdZ6E8-b'; // publishable: safe when RLS is on
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GN={lower:'Beginner',medium:'Intermediate',high:'Advanced'};
const C={lower:['Video editing','Thumbnail creator','Photo editing','Graphic design','Movie recap','Logo creator'],medium:['AI agent','English','UI/UX','Data analysis'],high:['AI app','AI web','Python','Java','Web development']};
const FEE={lower:8,medium:10,high:13},PER=50,METHODS=['EVC Plus','Zaad','Sahal','Bank card'];
let sess=null,signup=false,D={},R={tier:'lower',skill:C.lower[0],page:0,rows:[],total:0,my:null,err:null},T={sel:null,q:''},curSkill=null;
try{sess=JSON.parse(localStorage.getItem('stz')||'null')}catch(e){}

async function raw(path,o={}){
  const r=await fetch(URL_+path,{...o,headers:{apikey:KEY,...(o.body&&typeof o.body==='string'?{'Content-Type':'application/json'}:{}),...(sess?{Authorization:'Bearer '+sess.access_token}:{}),...(o.headers||{})}});
  if(r.status===401&&sess){logout();throw new Error('Session expired')}return r}
async function api(path,o={}){const r=await raw(path,o),t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok)throw new Error((j&&(j.msg||j.message||j.error_description))||r.status);return j}
const q=(t,qs='')=>api('/rest/v1/'+t+'?'+qs);
const nm=()=>(sess.user.user_metadata&&sess.user.user_metadata.full_name)||sess.user.email;
const avatar=(n,u)=>u?`<img class="av" src="${esc(u)}" alt="">`:`<span class="av">${esc((n||'?')[0].toUpperCase())}</span>`;

/* ---------- auth ---------- */
$('sw').onclick=e=>{e.preventDefault();signup=!signup;$('at').textContent=signup?'Sign up':'Log in';$('go').textContent=signup?'Create account':'Log in';$('nm').hidden=!signup;$('sw').textContent=signup?'Have an account? Log in':'No account? Sign up';$('msg').textContent=''};
$('go').onclick=async()=>{$('msg').textContent='';
  try{const b={email:$('em').value.trim(),password:$('pw').value};
    if(signup){const r=await api('/auth/v1/signup',{method:'POST',body:JSON.stringify({...b,data:{full_name:$('nm').value}})});
      if(!r.access_token){$('msg').style.color='var(--ok)';$('msg').textContent='Account created. Check your email to confirm, then log in.';return}sess=r}
    else sess=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify(b)});
    localStorage.setItem('stz',JSON.stringify(sess));
    if(signup)await api('/rest/v1/profiles',{method:'POST',body:JSON.stringify({id:sess.user.id,full_name:$('nm').value})}).catch(()=>{});
    start()}catch(e){$('msg').style.color='var(--orange)';$('msg').textContent=e.message}};
function logout(){sess=null;try{localStorage.removeItem('stz')}catch(e){}$('app').hidden=true;$('auth').hidden=false;$('who').innerHTML=''}

/* ---------- load ---------- */
async function start(){
  $('auth').hidden=true;$('app').hidden=false;
  $('who').innerHTML=`<span class="muted">${esc(sess.user.email)}</span><button class="btn s" id="lo">Log out</button>`;$('lo').onclick=logout;
  const uid=sess.user.id,f=(t,qs)=>q(t,qs).catch(()=>[]);
  const [enr,comps,ent,subs,courses,lp,pays,skills,tr]=await Promise.all([
    f('enrollments','select=*&user_id=eq.'+uid),f('competitions','select=*&order=start_date.desc'),
    f('competition_entries','select=*&user_id=eq.'+uid),f('submissions','select=*&user_id=eq.'+uid+'&order=competition_id,number'),
    f('courses','select=id,skill,level_group,level,title,video_url,duration,teacher_name&order=id'),
    f('lesson_progress','select=course_id,watched_at&user_id=eq.'+uid),f('payments','select=*&user_id=eq.'+uid+'&order=created_at.desc'),
    f('skills','select=*'),f('training_rank','select=*&user_id=eq.'+uid)]);
  D={enr,comps,ent,subs,courses,lpRows:lp,lp:new Set(lp.map(x=>x.course_id)),pays,skills,tr:tr[0]||null};
  T.sel=(enr[0]||{}).id||null;drawAll();
  const p=new URLSearchParams(location.search),k=p.get('enroll');if(k)enrollFromUrl(p)}
function drawAll(){drawHome();drawTrain();drawComp();drawPay();drawAna()}
const compFor=s=>D.comps.find(c=>c.skill===s&&c.status!=='closed')||D.comps.find(c=>c.skill===s);
const entFor=c=>c&&D.ent.find(e=>e.competition_id===c.id);
const subsFor=c=>c?D.subs.filter(s=>s.competition_id===c.id):[];

/* ---------- clocks ---------- */
const clock=end=>`<span class="clock" data-end="${esc(end)}">--</span>`;
function tick(){document.querySelectorAll('.clock').forEach(el=>{const ms=new Date(el.dataset.end+'T23:59:59')-Date.now();
  if(ms<=0){el.textContent='Ended';return}const d=Math.floor(ms/864e5),h=Math.floor(ms/36e5)%24,m=Math.floor(ms/6e4)%60,s=Math.floor(ms/1e3)%60;
  el.textContent=`${d}d ${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`})}
setInterval(tick,1000);

/* ---------- 1. home: all competition skills + 8-video cycle ---------- */
function tile(s,t){const c=compFor(s),e=entFor(c),n=subsFor(c).length;
  const st=!c?['No cycle yet','']:e?[e.status,e.status]:['Not joined','closed'];
  return `<button class="tile" data-cyc="${esc(s)}" data-tier="${t}"><b>${esc(s)}</b><span class="pill ${st[1]}">${esc(st[0])}</span>
  ${e&&e.status==='active'?`<div class="bar"><i style="width:${n/8*100}%"></i></div><span class="muted">${n}/8 videos</span>`:''}
  ${c&&c.status!=='closed'?`<span class="muted">${clock(c.end_date)}</span>`:''}</button>`}
function drawHome(){
  const act=D.ent.filter(e=>e.status==='active').length,pts=D.subs.filter(s=>s.status==='approved').reduce((a,s)=>a+Number(s.score),0);
  $('home').innerHTML=`<h2>Welcome, ${esc(nm())}</h2><div class="stats">
  <div class="box stat"><span class="muted">Active competitions</span><b>${act}</b></div>
  <div class="box stat"><span class="muted">Videos submitted</span><b>${D.subs.length}</b></div>
  <div class="box stat"><span class="muted">Points</span><b>${pts}</b></div>
  <div class="box stat"><span class="muted">Courses</span><b>${D.enr.length}</b></div></div>
  <p class="muted" style="margin-top:14px">Choose a skill to open its 8-video cycle, upload your videos and track the clock.</p>`+
  Object.keys(C).map(t=>`<h3 class="gt">${GN[t]}<span class="muted">${C[t].length} skills · $${FEE[t]} entry</span></h3><div class="tiles">${C[t].map(s=>tile(s,t)).join('')}</div>`).join('');tick()}

function openCycle(skill){
  curSkill=skill;const c=compFor(skill),e=entFor(c),subs=subsFor(c);let h='';
  if(!c)h='<p class="muted">No cycle is open for this skill yet. Check back soon.</p>';
  else if(!e)h=`<p class="muted">Entry fee $${esc(c.fee)} · ${esc(c.start_date)} → ${esc(c.end_date)}</p><button class="btn" data-join="${c.id}">Book my spot</button>`;
  else if(e.status!=='active')h=`<p class="muted">${e.status==='pending'?'Waiting for payment confirmation. See Payments.':e.status==='booked'?'Spot booked for this cycle. Pay in Payments to activate it.':e.status==='removed'?'You were removed from this cycle. You can book the next one.':'Finished.'}</p>`;
  else h=`<div class="row"><span>${clock(c.end_date)} left</span><span class="muted">${subs.length}/8 submitted</span></div><div class="bar"><i style="width:${subs.length/8*100}%"></i></div><div class="vids">${Array.from({length:8},(_,i)=>{const n=i+1,s=subs.find(x=>x.number===n);
    return `<div class="v ${s?'done':''}"><b>Video ${n}</b>${s?`<span class="pill ${s.status==='approved'?'active':s.status==='rejected'?'removed':'pending'}">${s.status}${s.status==='approved'?' · '+s.score+' pts':''}</span><div class="row"><a class="btn s" style="text-decoration:none" href="${esc(s.video_url)}" target="_blank" rel="noopener">View</a></div>`:`<label class="btn s up">Upload<input type="file" accept="video/*" hidden data-up="${c.id}:${n}"></label>`}</div>`}).join('')}</div>`;
  $('dt').textContent=skill+' · 8-video cycle';$('dv').innerHTML=h;if(!$('dlg').open)$('dlg').showModal();tick()}
async function upload(inp){const [cid,n]=inp.dataset.up.split(':').map(Number),f=inp.files[0];if(!f)return;
  if(f.size>200*1048576){alert('Max file size is 200 MB.');return}const lab=inp.parentElement;lab.firstChild.textContent='Uploading…';
  try{const path=`${sess.user.id}/${cid}/${n}-${Date.now()}-${f.name.replace(/[^\w.-]/g,'_')}`;
    const r=await raw('/storage/v1/object/submissions/'+path,{method:'POST',body:f,headers:{'Content-Type':f.type||'video/mp4'}});
    if(!r.ok)throw new Error((await r.json().catch(()=>({}))).message||r.status);
    const row=await api('/rest/v1/submissions',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({user_id:sess.user.id,competition_id:cid,number:n,video_url:`${URL_}/storage/v1/object/public/submissions/${path}`})});
    D.subs.push(row[0]);drawHome();drawAna();openCycle(curSkill)}catch(e){lab.firstChild.textContent='Upload';alert('Upload failed: '+e.message)}}

/* ---------- 2. my training: normal course videos ---------- */
const lessonsOf=e=>D.courses.filter(c=>c.skill===e.skill&&c.level===e.level);
const prog=e=>{const l=lessonsOf(e),d=l.filter(c=>D.lp.has(c.id)).length;return{t:l.length,d,p:l.length?Math.round(d/l.length*100):0}};
function drawTrain(){
  const qq=T.q.toLowerCase(),list=D.enr.filter(e=>!qq||e.skill.toLowerCase().includes(qq)||lessonsOf(e).some(c=>(c.title||'').toLowerCase().includes(qq)));
  const sel=D.enr.find(e=>e.id===T.sel)||list[0];
  $('train').innerHTML=`<h2>My training</h2><input class="srch" id="tq" placeholder="Search my courses and videos" value="${esc(T.q)}">`+
  (D.enr.length?`<div class="list">${list.map(e=>{const p=prog(e);return `<div class="box" style="${sel&&sel.id===e.id?'border-color:var(--gold)!important':''}"><div class="row"><b>${esc(e.skill)} – Level ${e.level}</b><span class="pill ${e.paid?'active':'pending'}">${e.paid?'Paid':'Awaiting payment'}</span></div><div class="muted">${GN[e.level_group]||''} · ${p.d}/${p.t} videos (${p.p}%)</div><div class="bar"><i style="width:${p.p}%"></i></div><div class="row" style="margin-top:10px"><button class="btn s" data-sel="${e.id}">Open videos</button>${e.level>=2?'<span class="sm" style="color:var(--gold)">Free competition entry unlocked</span>':''}</div></div>`}).join('')||'<div class="box muted">No match.</div>'}</div>`:'<div class="box muted">No courses yet. <a href="index.html#courses" style="color:var(--gold)">Browse courses</a></div>')+
  (sel?`<h3 class="gt">${esc(sel.skill)} – Level ${sel.level} videos</h3><div class="box">${lessonsOf(sel).filter(c=>!qq||(c.title||'').toLowerCase().includes(qq)||sel.skill.toLowerCase().includes(qq)).map((c,i)=>`<div class="les"><span>${i+1}. ${esc(c.title)} <span class="muted">${esc(c.duration||'')}</span></span><span><button class="btn s" data-lesson="${c.id}" ${sel.paid?'':'disabled'}>${D.lp.has(c.id)?'Watched ✓ · Replay':'Play'}</button></span></div>`).join('')||'<span class="muted">No videos uploaded for this level yet.</span>'}${sel.paid?'':'<p class="sm" style="margin-top:10px">Videos unlock once your payment is confirmed.</p>'}</div>`:'');
  const t=$('tq');t.oninput=()=>{T.q=t.value;const p=t.selectionStart;drawTrain();$('tq').focus();$('tq').setSelectionRange(p,p)}}
function playLesson(id){const c=D.courses.find(x=>x.id==id);$('dt').textContent=c.title;
  const y=(c.video_url||'').match(/(?:youtu\.be\/|v=)([\w-]{11})/);
  $('dv').innerHTML=(c.video_url?(y?`<iframe src="https://www.youtube.com/embed/${y[1]}" allowfullscreen></iframe>`:`<video src="${esc(c.video_url)}" controls playsinline></video>`):'<p class="muted">Video not uploaded yet.</p>')+`<button class="btn" data-watched="${c.id}" ${D.lp.has(c.id)?'disabled':''}>${D.lp.has(c.id)?'Watched ✓':'Mark as watched'}</button>`;$('dlg').showModal()}
async function enrollFromUrl(p){const k=p.get('enroll'),l=+p.get('level')||1;
  try{if(!D.enr.some(e=>e.skill===k&&e.level===l)){const r=await api('/rest/v1/enrollments',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({user_id:sess.user.id,skill:k,level_group:p.get('g')||'lower',level:l,lessons_done:0,lessons_total:10,paid:false})});D.enr.push(r[0]);T.sel=r[0].id;drawAll()}go('train')}catch(e){alert('Enrollment failed: '+e.message)}
  history.replaceState(null,'',location.pathname)}

/* ---------- 3. competition ranking ---------- */
function drawComp(){
  $('comp').innerHTML=`<h2>Competition</h2><div class="tabs">${Object.keys(C).map(t=>`<button class="tab ${t===R.tier?'on':''}" data-rt="${t}">${GN[t]}</button>`).join('')}</div>
  <div class="bar2" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">${C[R.tier].map(s=>`<button class="chip ${s===R.skill?'on':''}" data-rs="${esc(s)}">${esc(s)}</button>`).join('')}</div>
  <div class="row" style="margin-bottom:12px;justify-content:flex-start"><input id="rj" type="number" min="1" placeholder="Jump to rank" style="width:150px;margin:0"><button class="btn s" id="rg">Go</button><button class="btn s" id="rm">My rank</button><span class="muted" id="rcl"></span></div>
  <div class="box scroll"><table><thead><tr><th>Rank</th><th>Name</th><th>Points</th><th>Creativity</th><th>Storytelling</th><th>Quality</th><th>Videos</th></tr></thead><tbody id="rb"></tbody></table></div>
  <div class="row" style="margin-top:12px"><button class="btn s" id="rp">← Prev</button><span class="muted" id="ri"></span><button class="btn s" id="rn">Next →</button></div>`;
  $('rp').onclick=()=>loadRank(R.page-1);$('rn').onclick=()=>loadRank(R.page+1);
  $('rg').onclick=()=>{const n=+$('rj').value;if(n>0)loadRank(Math.floor((n-1)/PER))};
  $('rm').onclick=()=>{if(R.my)loadRank(Math.floor((R.my.rank-1)/PER));else alert('You have no rank in this competition yet.')};paintRank()}
async function loadRank(p){const c=compFor(R.skill);R.rows=[];R.my=null;R.err=null;
  if(!c||p<0){paintRank();return}
  try{const r=await raw(`/rest/v1/leaderboard?select=*&competition_id=eq.${c.id}&order=rank.asc,user_id.asc&limit=${PER}&offset=${p*PER}`,{headers:{Prefer:'count=estimated'}});
    if(!r.ok)throw new Error(r.status);R.rows=await r.json();R.page=p;R.total=+((r.headers.get('content-range')||'').split('/')[1])||R.total;
    R.my=(await q('leaderboard',`select=rank&competition_id=eq.${c.id}&user_id=eq.${sess.user.id}`))[0]||null}catch(e){R.err=e.message}paintRank()}
const medal=n=>n==1?'🥇 1':n==2?'🥈 2':n==3?'🥉 3':Number(n).toLocaleString();
function paintRank(){const b=$('rb');if(!b)return;const c=compFor(R.skill);
  $('rcl').innerHTML=c&&c.status!=='closed'?'Cycle ends in '+clock(c.end_date):'';
  b.innerHTML=R.rows.map(x=>`<tr class="${x.user_id===sess.user.id?'me':''}"><td>${medal(x.rank)}</td><td>${avatar(x.name,x.avatar_url)}${esc(x.name)}</td><td><b>${x.score}</b></td><td>${x.creativity}</td><td>${x.storytelling}</td><td>${x.quality}</td><td>${x.videos}/8</td></tr>`).join('')||`<tr><td colspan="7" class="muted">${!c?'No cycle for this skill yet.':R.err?'Could not load ranking ('+esc(R.err)+').':'No ranked students yet.'}</td></tr>`;
  const from=R.page*PER+1;$('ri').textContent=R.rows.length?`${from.toLocaleString()}–${(from+R.rows.length-1).toLocaleString()}${R.total?' of ~'+R.total.toLocaleString():''}`:'';
  $('rp').disabled=R.page===0;$('rn').disabled=R.rows.length<PER;tick()}

/* ---------- 4. payments ---------- */
const priceOf=e=>{const s=D.skills.find(x=>x.skill===e.skill);return s?s['price_'+e.level]:null};
const reviewing=(k,id)=>D.pays.some(p=>p.kind===k&&p.ref_id==id&&p.status==='pending');
function drawPay(){
  const due=[];D.enr.filter(e=>!e.paid).forEach(e=>due.push({k:'course',id:e.id,label:`${e.skill} – Level ${e.level}`,amt:priceOf(e)}));
  D.ent.filter(e=>!e.paid&&['pending','booked'].includes(e.status)).forEach(e=>{const c=D.comps.find(x=>x.id===e.competition_id);if(c)due.push({k:'competition',id:e.id,label:`Competition: ${c.skill}`,amt:e.free_entry?0:c.fee})});
  $('pay').innerHTML=`<h2>Payments</h2><h3 class="gt" style="margin-top:0">To pay</h3><div class="list">${due.map(x=>`<div class="box row"><div><b>${esc(x.label)}</b><div class="muted">${x.amt===0?'Free entry, no payment needed':x.amt==null?'Price coming soon':'$'+x.amt}</div></div>${reviewing(x.k,x.id)?'<span class="pill pending">Under review</span>':x.amt?`<button class="btn" data-pay="${x.k}:${x.id}:${x.amt}">Pay now</button>`:''}</div>`).join('')||'<div class="box muted">Nothing to pay. 🎉</div>'}</div>
  <h3 class="gt">History</h3><div class="box scroll"><table><thead><tr><th>Date</th><th>For</th><th>Amount</th><th>Method</th><th>Status</th></tr></thead><tbody>${D.pays.map(p=>`<tr><td>${esc((p.created_at||'').slice(0,10))}</td><td>${esc(p.kind)}</td><td>$${esc(p.amount)}</td><td>${esc(p.method)}</td><td><span class="pill ${p.status==='confirmed'?'active':p.status==='rejected'?'removed':'pending'}">${esc(p.status)}</span></td></tr>`).join('')||'<tr><td colspan="5" class="muted">No payments yet.</td></tr>'}</tbody></table></div>`}
function payForm(k,id,amt){$('dt').textContent='Pay $'+amt;
  $('dv').innerHTML=`<p class="muted" style="margin:10px 0">Send the amount, then enter your transaction reference. The admin confirms it and activates your access.</p><select id="pm" style="width:100%;margin-bottom:10px">${METHODS.map(m=>`<option>${m}</option>`).join('')}</select><input id="pr" placeholder="Transaction reference / phone number"><button class="btn" id="ps" data-pk="${k}:${id}:${amt}" style="width:100%">I have paid</button>`;$('dlg').showModal()}

/* ---------- 5. analytics ---------- */
function drawAna(){
  const ap=D.subs.filter(s=>s.status==='approved'),avg=k=>ap.length?(ap.reduce((a,s)=>a+Number(s[k]),0)/ap.length).toFixed(1):'–';
  const pts=ap.reduce((a,s)=>a+Number(s.score),0),spent=D.pays.filter(p=>p.status==='confirmed').reduce((a,p)=>a+Number(p.amount),0);
  const days=Array.from({length:14},(_,i)=>{const d=new Date(Date.now()-(13-i)*864e5).toISOString().slice(0,10);return{d:d.slice(5),n:D.lpRows.filter(x=>(x.watched_at||'').slice(0,10)===d).length}});
  const mx=Math.max(1,...days.map(x=>x.n)),sp=D.subs.slice(-12),sm=Math.max(1,...sp.map(s=>Number(s.score)));
  $('ana').innerHTML=`<h2>Analytics</h2><div class="stats">
  <div class="box stat"><span class="muted">Lessons watched</span><b>${D.lp.size}</b></div>
  <div class="box stat"><span class="muted">Videos approved</span><b>${ap.length}/${D.subs.length}</b></div>
  <div class="box stat"><span class="muted">Total points</span><b>${pts}</b></div>
  <div class="box stat"><span class="muted">Spent</span><b>$${spent}</b></div></div>
  <div class="cols2" style="margin-top:14px"><div class="box"><b>Lessons watched, last 14 days</b><div class="chart">${days.map(x=>`<div style="height:${x.n/mx*100}%"><span>${x.n||''}</span></div>`).join('')}</div><div class="lab">${days.map(x=>`<span>${x.d.slice(3)}</span>`).join('')}</div></div>
  <div class="box"><b>Points per submitted video</b><div class="chart">${sp.map(s=>`<div style="height:${Number(s.score)/sm*100}%"><span>${s.score||''}</span></div>`).join('')||'<span class="muted">No videos yet.</span>'}</div></div></div>
  <div class="box" style="margin-top:14px"><b>My judging averages</b>${[['Creativity','creativity'],['Storytelling','storytelling'],['Quality','quality']].map(m=>`<div class="row" style="margin-top:10px"><span>${m[0]}</span><b>${avg(m[1])}</b></div>`).join('')}</div>`}

/* ---------- 6. my standing: training rank + competition rank vs others ---------- */
async function drawStand(){
  const el=$('stand');el.innerHTML='<h2>My standing</h2><div class="box muted">Loading…</div>';let h='<h2>My standing</h2>';
  try{
    const tr=D.tr,tot=await raw('/rest/v1/training_rank?select=user_id&limit=1',{headers:{Prefer:'count=estimated'}});
    const n=+((tot.headers.get('content-range')||'').split('/')[1])||0;
    h+=`<div class="box"><div class="muted">Training rank (lessons watched)</div><div class="big">${tr?'#'+Number(tr.rank).toLocaleString():'–'}${n?` <span class="muted" style="font-size:.9rem">of ~${n.toLocaleString()}</span>`:''}</div><div class="muted">${tr?tr.lessons+' lessons watched':'Watch course videos to get ranked.'}</div></div>`;
    const act=D.ent.filter(e=>['active','finished'].includes(e.status));
    for(const e of act){const c=D.comps.find(x=>x.id===e.competition_id);if(!c)continue;
      const [me,cs,ah]=await Promise.all([q('leaderboard',`select=*&competition_id=eq.${c.id}&user_id=eq.${sess.user.id}`),q('cohort_stats',`select=*&competition_id=eq.${c.id}`),q('leaderboard',`select=name,score,rank&competition_id=eq.${c.id}&order=rank.desc,user_id.asc&limit=1&rank=lt.${(await q('leaderboard',`select=rank&competition_id=eq.${c.id}&user_id=eq.${sess.user.id}`))[0]?.rank||0}`)]);
      const m=me[0],s=cs[0];if(!m||!s){h+=`<div class="box" style="margin-top:14px"><b>${esc(c.skill)}</b><div class="muted">No scores yet. Submit videos to get ranked.</div></div>`;continue}
      const mets=[['Creativity','creativity'],['Storytelling','storytelling'],['Quality','quality']].map(x=>({n:x[0],me:+m[x[1]],avg:+s['avg_'+x[1]],top:+s['top_'+x[1]]||1}));
      const ratio=x=>x.avg?x.me/x.avg:x.me,best=[...mets].sort((a,b)=>ratio(b)-ratio(a))[0],worst=[...mets].sort((a,b)=>ratio(a)-ratio(b))[0];
      const pct=s.players?Math.max(1,Math.round(100-(m.rank-1)/s.players*100)):0;
      h+=`<div class="box" style="margin-top:14px"><div class="row"><b>${esc(c.skill)} <span class="muted">· ${GN[c.level_group]}</span></b><span class="big" style="font-size:1.5rem">#${Number(m.rank).toLocaleString()}</span></div>
      <div class="muted">${m.score} points · better than ${pct}% of ${Number(s.players).toLocaleString()} players · average ${s.avg_points} · top ${s.top_points}</div>
      ${ah[0]?`<p class="sm" style="margin:8px 0;color:var(--gold)">${(Number(ah[0].score)-Number(m.score)).toFixed(1)} points to pass #${ah[0].rank}</p>`:'<p class="sm" style="margin:8px 0;color:var(--gold)">You are #1. Keep the lead!</p>'}
      ${mets.map(x=>`<div class="row"><span>${x.n}</span><span class="muted">you ${x.me} · avg ${x.avg} · top ${x.top}</span></div><div class="mb"><i style="width:${Math.min(100,x.me/x.top*100)}%"></i><u style="left:${Math.min(100,x.avg/x.top*100)}%"></u></div>`).join('')}
      <p class="sm">White marker = average player. Strongest: <b>${best.n}</b>. Needs work: <b>${worst.n}</b>.</p></div>`}
    if(!act.length)h+='<div class="box muted" style="margin-top:14px">Join a competition to see how you compare with other players.</div>'
  }catch(e){h+=`<div class="box" style="margin-top:14px">Could not load standing: ${esc(e.message)}. Run schema_v3.sql in Supabase.</div>`}
  el.innerHTML=h}

/* ---------- events ---------- */
function go(t){document.querySelectorAll('nav.tabs .tab').forEach(x=>x.classList.toggle('on',x.dataset.t===t));['home','train','comp','pay','ana','stand'].forEach(id=>$(id).hidden=id!==t);
  if(t==='comp'&&!R.rows.length)loadRank(0);if(t==='stand')drawStand();tick()}
document.addEventListener('click',async e=>{const E=s=>e.target.closest(s);let x;
  if(x=E('nav.tabs .tab'))return go(x.dataset.t);
  if(x=E('[data-cyc]'))return openCycle(x.dataset.cyc);
  if(x=E('[data-join]')){try{const r=await api('/rest/v1/competition_entries',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({user_id:sess.user.id,competition_id:+x.dataset.join,status:'booked'})});D.ent.push(r[0]);drawHome();drawPay();openCycle(curSkill)}catch(er){alert(er.message)}return}
  if(x=E('[data-sel]')){T.sel=+x.dataset.sel;drawTrain();return}
  if(x=E('[data-lesson]'))return playLesson(x.dataset.lesson);
  if(x=E('[data-watched]')){const id=+x.dataset.watched;try{await api('/rest/v1/lesson_progress',{method:'POST',body:JSON.stringify({user_id:sess.user.id,course_id:id})});D.lp.add(id);D.lpRows.push({course_id:id,watched_at:new Date().toISOString()});x.textContent='Watched ✓';x.disabled=true;drawTrain();drawAna()}catch(er){alert(er.message)}return}
  if(x=E('[data-rt]')){R.tier=x.dataset.rt;R.skill=C[R.tier][0];R.page=0;drawComp();loadRank(0);return}
  if(x=E('[data-rs]')){R.skill=x.dataset.rs;R.page=0;drawComp();loadRank(0);return}
  if(x=E('[data-pay]')){const [k,id,a]=x.dataset.pay.split(':');return payForm(k,id,a)}
  if(x=E('[data-pk]')){const [k,id,a]=x.dataset.pk.split(':'),ref=$('pr').value.trim();if(!ref){alert('Enter your transaction reference.');return}
    try{const r=await api('/rest/v1/payments',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({user_id:sess.user.id,kind:k,ref_id:+id,amount:+a,method:$('pm').value,reference:ref,status:'pending'})});D.pays.unshift(r[0]);$('dlg').close();drawPay()}catch(er){alert(er.message)}}});
document.addEventListener('change',e=>{if(e.target.dataset.up)upload(e.target)});
$('dc').onclick=()=>$('dlg').close();
$('dlg').addEventListener('close',()=>{$('dv').innerHTML=''});
if(sess)start();
</script>
</body>
</html>
